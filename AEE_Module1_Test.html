<style>
:root{--ink:#16324a;--paper:#f6f8f9;--card:#fff;--line:#d6dfe5;--muted:#52677a;--pasupu:#e3a400;--pasupu-soft:#fff3cf;--leaf:#1f7a55;--leaf-soft:#e3f3ea;--kumkum:#b3322b;--kumkum-soft:#fbe9e7;--chain:#2c6e8f;
--f-display:"Anek Telugu","Noto Sans Telugu","Noto Sans",sans-serif;--f-body:"Noto Sans","Noto Sans Telugu",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6eef4;--paper:#0f1a23;--card:#16242f;--line:#29404f;--muted:#9fb3c2;--pasupu:#f2bd2f;--pasupu-soft:#3a2f0e;--leaf:#4cc28c;--leaf-soft:#123326;--kumkum:#ef7a72;--kumkum-soft:#3a1d1b;--chain:#7cc3e0;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e6eef4;--paper:#0f1a23;--card:#16242f;--line:#29404f;--muted:#9fb3c2;--pasupu:#f2bd2f;--pasupu-soft:#3a2f0e;--leaf:#4cc28c;--leaf-soft:#123326;--kumkum:#ef7a72;--kumkum-soft:#3a1d1b;--chain:#7cc3e0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--f-body)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header{background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;text-decoration:none;color:var(--ink)}
.brand span{color:var(--pasupu)}
.back{margin-left:auto;font-size:.88rem;color:var(--muted)}
h1{font-family:var(--f-display);font-size:1.6rem;line-height:1.25;margin:20px 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:.9rem;font-weight:600;padding:7px 14px;border:0;background:transparent;color:var(--ink);cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.info{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:.92rem}
.info b{font-weight:600}
.info p{margin:4px 0}
label.chk{display:flex;gap:8px;align-items:center;font-size:.92rem;cursor:pointer}
label.chk input{width:18px;height:18px}
.bar{position:sticky;top:0;z-index:4;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:8px}
.prog{flex:1;min-width:0}
.prog small{display:block;color:var(--muted);font-size:.8rem}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--pasupu);width:0}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:.95rem;white-space:nowrap}
.timer.low{color:var(--kumkum)}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:9px 16px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;min-height:42px;text-decoration:none;display:inline-flex;align-items:center}
.btn.primary{background:var(--pasupu);border-color:var(--pasupu);color:#1b1300}
ol.qs{list-style:none;margin:16px 0;padding:0;display:grid;gap:12px}
.q{scroll-margin-top:90px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.q .qt{margin:0 0 10px}
.q .qt>span.qn{color:var(--muted);margin-right:6px}
.q .qt .l0{font-weight:600;display:inline!important}.q .qt span:not(.qn){display:block}
.q .qt .li,.q .qt .la,.q .qt .lh,.q .qt .lc{font-weight:400;margin-top:4px}
.q .qt .li{padding-left:10px}.q .qt .lh{font-weight:600;margin-top:8px;color:var(--chain)}
.q .qt .la{padding:6px 10px;background:var(--paper);border-radius:8px}
.q .qt .lc{font-weight:600;margin-top:8px}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opts button{font:inherit;text-align:left;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:44px;display:flex;gap:8px}
.opts button b{flex:none;font-weight:600;color:var(--muted)}
.opts button[aria-pressed="true"]{border-color:var(--ink);background:var(--pasupu-soft)}
.opts button.right{border-color:var(--leaf);background:var(--leaf-soft)}
.opts button.wrong{border-color:var(--kumkum);background:var(--kumkum-soft)}
.opts button:disabled{cursor:default}
.why{margin:10px 0 0;padding:8px 12px;border-left:4px solid var(--leaf);background:var(--leaf-soft);border-radius:6px;font-size:.92rem}
.why.no{border-color:var(--kumkum);background:var(--kumkum-soft)}
.why.skip{border-color:var(--muted);background:var(--paper)}
.result{scroll-margin-top:90px;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:16px;margin:16px 0}
.result h2{font-family:var(--f-display);margin:0 0 8px;font-size:1.3rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
.stats div{background:var(--paper);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:1.4rem;font-family:var(--f-display)}
.stats small{color:var(--muted);font-size:.8rem}
.verdict{font-weight:600;margin:6px 0}
footer{color:var(--muted);font-size:.85rem;padding:24px 0 40px}
[hidden]{display:none!important}
</style>
</head>

<script>
var DATA={"1":{"q":[{"n":1,"en":["A steel bar 2 m long has a rectangular cross-section 20 mm × 25 mm. It is subjected to an axial pull of 50 kN. Taking E = 2 × 10⁵ N/mm², the elongation of the bar is:"],"o":[["0.5 mm","0.5 mm"],["1.0 mm","1.0 mm"],["1.5 mm","1.5 mm"],["2.0 mm","2.0 mm"]],"sec":"A. Simple Stresses, Strains and Elastic Constants","a":1,"xe":"δ = PL/AE = (50,000 × 2000)/(500 × 2×10⁵) = 10⁸/10⁸ = 1 mm.","te":["A steel bar 2 m long has a rectangular cross-section 20 mm × 25 mm. It is subjected to an axial pull of 50 kN. Taking E = 2 × 10⁵ N/mm², the elongation of the bar is:"],"xt":"δ = PL/AE = (50,000 × 2000)/(500 × 2×10⁵) = 10⁸/10⁸ = 1 mm."},{"n":2,"en":["A material has modulus of elasticity E = 200 GPa and modulus of rigidity G = 80 GPa. Its Poisson's ratio is:"],"o":[["0.30","0.30"],["0.33","0.33"],["0.25","0.25"],["0.20","0.20"]],"sec":"A. Simple Stresses, Strains and Elastic Constants","a":2,"xe":"E = 2G(1+μ) → 200 = 160(1+μ) → μ = 0.25.","te":["A material has modulus of elasticity E = 200 GPa and modulus of rigidity G = 80 GPa. Its Poisson's ratio is:"],"xt":"E = 2G(1+μ) → 200 = 160(1+μ) → μ = 0.25."},{"n":3,"en":["For a material with E = 200 GPa and Poisson's ratio 0.25, the bulk modulus K is:"],"o":[["100 GPa","100 GPa"],["160 GPa","160 GPa"],["266.7 GPa","266.7 GPa"],["133.3 GPa","133.3 GPa"]],"sec":"A. Simple Stresses, Strains and Elastic Constants","a":3,"xe":"E = 3K(1−2μ) → K = 200/(3 × 0.5) = 133.3 GPa.","te":["For a material with E = 200 GPa and Poisson's ratio 0.25, the bulk modulus K is:"],"xt":"E = 3K(1−2μ) → K = 200/(3 × 0.5) = 133.3 GPa."},{"n":4,"en":["Consider the following statements regarding Poisson's ratio (μ):","I. For most metals, μ lies between 0.25 and 0.33.","II. For a perfectly incompressible material, μ = 0.5.","III. For an isotropic elastic material, μ can be greater than 0.5.","IV. For cork, μ is nearly zero.","Which of the above statements are correct?"],"o":[["I, II and IV only","I, II and IV only"],["I and II only","I and II only"],["I, III and IV only","I, III and IV only"],["I, II, III and IV","I, II, III and IV"]],"sec":"A. Simple Stresses, Strains and Elastic Constants","a":0,"xe":"For isotropic materials μ ranges 0 to 0.5, so III is wrong. Cork ≈ 0 (used as bottle stopper — it doesn't bulge).","te":["Consider the following statements regarding Poisson's ratio (μ):","I. For most metals, μ lies between 0.25 and 0.33.","II. For a perfectly incompressible material, μ = 0.5.","III. For an isotropic elastic material, μ can be greater than 0.5.","IV. For cork, μ is nearly zero.","Which of the above statements are correct?"],"xt":"For isotropic materials μ ranges 0 to 0.5, so III is wrong. Cork ≈ 0 (used as bottle stopper — it doesn't bulge)."},{"n":5,"en":["The strain energy stored per unit volume of a body when it is stressed up to the elastic limit is called:"],"o":[["resilience","resilience"],["proof resilience","proof resilience"],["modulus of resilience","modulus of resilience"],["modulus of toughness","modulus of toughness"]],"sec":"A. Simple Stresses, Strains and Elastic Constants","a":2,"xe":"Proof resilience = total energy up to elastic limit; per unit volume = modulus of resilience = σ²/2E (2023 asked its formula).","te":["The strain energy stored per unit volume of a body when it is stressed up to the elastic limit is called:"],"xt":"Proof resilience = total energy up to elastic limit; per unit volume = modulus of resilience = σ²/2E (2023 asked its formula)."},{"n":6,"en":["A short RCC column has a concrete area of 80,000 mm² and steel area of 2,000 mm². The modular ratio is 10 and the column carries an axial load of 500 kN. The stress in steel is:"],"o":[["5 N/mm²","5 N/mm²"],["25 N/mm²","25 N/mm²"],["50 N/mm²","50 N/mm²"],["100 N/mm²","100 N/mm²"]],"sec":"A. Simple Stresses, Strains and Elastic Constants","a":2,"xe":"Equivalent area = Ac + m·As = 80,000 + 20,000 = 1,00,000 mm². σc = 5,00,000/1,00,000 = 5 N/mm². σs = m·σc = 50 N/mm².","te":["A short RCC column has a concrete area of 80,000 mm² and steel area of 2,000 mm². The modular ratio is 10 and the column carries an axial load of 500 kN. The stress in steel is:"],"xt":"Equivalent area = Ac + m·As = 80,000 + 20,000 = 1,00,000 mm². σc = 5,00,000/1,00,000 = 5 N/mm². σs = m·σc = 50 N/mm²."},{"n":7,"en":["A steel rail 10 m long is laid at 20°C with its ends fixed. The temperature rises to 60°C, but the supports yield by 0.4 mm. Take α = 12 × 10⁻⁶ /°C and E = 2 × 10⁵ N/mm². The stress in the rail is:"],"o":[["96 N/mm²","96 N/mm²"],["88 N/mm²","88 N/mm²"],["80 N/mm²","80 N/mm²"],["8 N/mm²","8 N/mm²"]],"sec":"A. Simple Stresses, Strains and Elastic Constants","a":1,"xe":"Free expansion = αLΔT = 12×10⁻⁶ × 10,000 × 40 = 4.8 mm. Prevented = 4.8 − 0.4 = 4.4 mm. σ = E × 4.4/10,000 = 88 N/mm². (Trap: 96 ignores the yielding.)","te":["A steel rail 10 m long is laid at 20°C with its ends fixed. The temperature rises to 60°C, but the supports yield by 0.4 mm. Take α = 12 × 10⁻⁶ /°C and E = 2 × 10⁵ N/mm². The stress in the rail is:"],"xt":"Free expansion = αLΔT = 12×10⁻⁶ × 10,000 × 40 = 4.8 mm. Prevented = 4.8 − 0.4 = 4.4 mm. σ = E × 4.4/10,000 = 88 N/mm². (Trap: 96 ignores the yielding.)"},{"n":8,"en":["A uniformly tapering circular rod 1 m long has diameters 40 mm and 20 mm at its ends. It carries an axial pull of 31.4 kN. Taking E = 2 × 10⁵ N/mm² and π = 3.14, its elongation is:"],"o":[["0.50 mm","0.50 mm"],["1.0 mm","1.0 mm"],["0.125 mm","0.125 mm"],["0.25 mm","0.25 mm"]],"sec":"A. Simple Stresses, Strains and Elastic Constants","a":3,"xe":"δ = 4PL/(πE·d₁·d₂) = (4 × 31,400 × 1000)/(3.14 × 2×10⁵ × 40 × 20) = 0.25 mm. (2023 asked this formula directly.)","te":["A uniformly tapering circular rod 1 m long has diameters 40 mm and 20 mm at its ends. It carries an axial pull of 31.4 kN. Taking E = 2 × 10⁵ N/mm² and π = 3.14, its elongation is:"],"xt":"δ = 4PL/(πE·d₁·d₂) = (4 × 31,400 × 1000)/(3.14 × 2×10⁵ × 40 × 20) = 0.25 mm. (2023 asked this formula directly.)"},{"n":9,"en":["A uniform bar of length L hangs vertically from a support. The elongation due to its own weight W is ______ the elongation that would occur if the same load W were applied at its lower end."],"o":[["equal to","equal to"],["twice","twice"],["half of","half of"],["one-fourth of","one-fourth of"]],"sec":"A. Simple Stresses, Strains and Elastic Constants","a":2,"xe":"Self-weight: δ = WL/2AE; end load: δ = WL/AE. Ratio = ½.","te":["A uniform bar of length L hangs vertically from a support. The elongation due to its own weight W is ______ the elongation that would occur if the same load W were applied at its lower end."],"xt":"Self-weight: δ = WL/2AE; end load: δ = WL/AE. Ratio = ½."},{"n":10,"en":["Match List-I (property) with List-II (meaning):","List-I","A. Ductility","B. Malleability","C. Brittleness","D. Toughness","List-II","1. Energy absorbed up to fracture","2. Can be drawn into thin wires","3. Can be hammered into thin sheets","4. Fractures with very little deformation"],"o":[["A-2, B-3, C-4, D-1","A-2, B-3, C-4, D-1"],["A-3, B-2, C-4, D-1","A-3, B-2, C-4, D-1"],["A-2, B-3, C-1, D-4","A-2, B-3, C-1, D-4"],["A-3, B-2, C-1, D-4","A-3, B-2, C-1, D-4"]],"sec":"A. Simple Stresses, Strains and Elastic Constants","a":0,"xe":"Ductility = wires; malleability = sheets; brittleness = sudden fracture (cast iron, glass); toughness = area under the full stress–strain curve.","te":["Match List-I (property) with List-II (meaning):","List-I","A. Ductility","B. Malleability","C. Brittleness","D. Toughness","List-II","1. Energy absorbed up to fracture","2. Can be drawn into thin wires","3. Can be hammered into thin sheets","4. Fractures with very little deformation"],"xt":"Ductility = wires; malleability = sheets; brittleness = sudden fracture (cast iron, glass); toughness = area under the full stress–strain curve."},{"n":11,"en":["An axial load of 50 kN is applied suddenly to a bar of cross-sectional area 1000 mm². The maximum stress induced is:"],"o":[["50 N/mm²","50 N/mm²"],["100 N/mm²","100 N/mm²"],["150 N/mm²","150 N/mm²"],["200 N/mm²","200 N/mm²"]],"sec":"B. Strain Energy and Types of Loading","a":1,"xe":"Sudden load: σ = 2P/A = 2 × 50,000/1000 = 100 N/mm².","te":["An axial load of 50 kN is applied suddenly to a bar of cross-sectional area 1000 mm². The maximum stress induced is:"],"xt":"Sudden load: σ = 2P/A = 2 × 50,000/1000 = 100 N/mm²."},{"n":12,"en":["A load of 10 kN falls through a height of 2 mm onto a collar attached to a vertical bar 1 m long with area 1000 mm². Take E = 2 × 10⁵ N/mm². The maximum impact stress in the bar is:"],"o":[["10 N/mm²","10 N/mm²"],["20 N/mm²","20 N/mm²"],["90 N/mm²","90 N/mm²"],["100 N/mm²","100 N/mm²"]],"sec":"B. Strain Energy and Types of Loading","a":3,"xe":"σ = (P/A)[1 + √(1 + 2AEh/PL)]. 2AEh/PL = (2 × 1000 × 2×10⁵ × 2)/(10,000 × 1000) = 80. √81 = 9 → σ = 10 × (1 + 9) = 100 N/mm².","te":["A load of 10 kN falls through a height of 2 mm onto a collar attached to a vertical bar 1 m long with area 1000 mm². Take E = 2 × 10⁵ N/mm². The maximum impact stress in the bar is:"],"xt":"σ = (P/A)[1 + √(1 + 2AEh/PL)]. 2AEh/PL = (2 × 1000 × 2×10⁵ × 2)/(10,000 × 1000) = 80. √81 = 9 → σ = 10 × (1 + 9) = 100 N/mm²."},{"n":13,"en":["A bar of cross-sectional area 500 mm² and length 2 m is stressed to 100 N/mm². With E = 2 × 10⁵ N/mm², the strain energy stored in the bar is:"],"o":[["12.5 N·m","12.5 N·m"],["50 N·m","50 N·m"],["100 N·m","100 N·m"],["25 N·m","25 N·m"]],"sec":"B. Strain Energy and Types of Loading","a":3,"xe":"U = (σ²/2E) × V = (10,000/4×10⁵) × (500 × 2000) = 0.025 × 10⁶ = 25,000 N·mm = 25 N·m.","te":["A bar of cross-sectional area 500 mm² and length 2 m is stressed to 100 N/mm². With E = 2 × 10⁵ N/mm², the strain energy stored in the bar is:"],"xt":"U = (σ²/2E) × V = (10,000/4×10⁵) × (500 × 2000) = 0.025 × 10⁶ = 25,000 N·mm = 25 N·m."},{"n":14,"en":["Consider the following statements:","I. For the same load, the stress produced by a suddenly applied load is twice, and the strain energy stored is four times, that produced by a gradually applied load.","II. Proof resilience is the maximum strain energy that can be stored in a body up to the elastic limit.","III. Modulus of resilience is a dimensionless quantity.","IV. The impact stress formula reduces to the sudden-load stress when the height of fall is zero.","Which of the above statements are correct?"],"o":[["I and II only","I and II only"],["I, II and IV only","I, II and IV only"],["II, III and IV only","II, III and IV only"],["I, II, III and IV","I, II, III and IV"]],"sec":"B. Strain Energy and Types of Loading","a":1,"xe":"U ∝ σ², so 2× stress → 4× energy (I true). Modulus of resilience = energy/volume = N·mm/mm³ = N/mm² — it has units of stress, so III is false. With h = 0, σ = (P/A)(1+1) = 2P/A (IV true).","te":["Consider the following statements:","I. For the same load, the stress produced by a suddenly applied load is twice, and the strain energy stored is four times, that produced by a gradually applied load.","II. Proof resilience is the maximum strain energy that can be stored in a body up to the elastic limit.","III. Modulus of resilience is a dimensionless quantity.","IV. The impact stress formula reduces to the sudden-load stress when the height of fall is zero.","Which of the above statements are correct?"],"xt":"U ∝ σ², so 2× stress → 4× energy (I true). Modulus of resilience = energy/volume = N·mm/mm³ = N/mm² — it has units of stress, so III is false. With h = 0, σ = (P/A)(1+1) = 2P/A (IV true)."},{"n":15,"en":["Assertion (A): Mild steel is preferred over cast iron for members subjected to shock loads.","Reason (R): Cast iron has a higher modulus of elasticity than mild steel."],"o":[["Both A and R are true, and R is the correct explanation of A","Both A and R are true, and R is the correct explanation of A"],["Both A and R are true, but R is NOT the correct explanation of A","Both A and R are true, but R is NOT the correct explanation of A"],["A is true, but R is false","A is true, but R is false"],["A is false, but R is true","A is false, but R is true"]],"sec":"B. Strain Energy and Types of Loading","a":2,"xe":"A is true — mild steel is ductile and tough, absorbs shock. R is false — E of cast iron (≈100 GPa) is lower than steel (≈200 GPa).","te":["Assertion (A): Mild steel is preferred over cast iron for members subjected to shock loads.","Reason (R): Cast iron has a higher modulus of elasticity than mild steel."],"xt":"A is true — mild steel is ductile and tough, absorbs shock. R is false — E of cast iron (≈100 GPa) is lower than steel (≈200 GPa)."},{"n":16,"en":["A simply supported beam of span 6 m carries a UDL of 20 kN/m over the entire span. The maximum bending moment is:"],"o":[["180 kN·m","180 kN·m"],["120 kN·m","120 kN·m"],["90 kN·m","90 kN·m"],["45 kN·m","45 kN·m"]],"sec":"C. Shear Force and Bending Moment","a":2,"xe":"Mmax = wL²/8 = 20 × 36/8 = 90 kN·m at mid-span.","te":["A simply supported beam of span 6 m carries a UDL of 20 kN/m over the entire span. The maximum bending moment is:"],"xt":"Mmax = wL²/8 = 20 × 36/8 = 90 kN·m at mid-span."},{"n":17,"en":["A cantilever 3 m long carries a point load of 10 kN at its free end and a UDL of 4 kN/m over its whole length. The bending moment at the fixed end is:"],"o":[["48 kN·m","48 kN·m"],["30 kN·m","30 kN·m"],["39 kN·m","39 kN·m"],["66 kN·m","66 kN·m"]],"sec":"C. Shear Force and Bending Moment","a":0,"xe":"M = WL + wL²/2 = 10 × 3 + 4 × 9/2 = 30 + 18 = 48 kN·m (hogging).","te":["A cantilever 3 m long carries a point load of 10 kN at its free end and a UDL of 4 kN/m over its whole length. The bending moment at the fixed end is:"],"xt":"M = WL + wL²/2 = 10 × 3 + 4 × 9/2 = 30 + 18 = 48 kN·m (hogging)."},{"n":18,"en":["A simply supported beam of span 5 m carries a point load of 30 kN at 2 m from the left support. The maximum bending moment is:"],"o":[["30 kN·m","30 kN·m"],["37.5 kN·m","37.5 kN·m"],["45 kN·m","45 kN·m"],["36 kN·m","36 kN·m"]],"sec":"C. Shear Force and Bending Moment","a":3,"xe":"Mmax = Wab/L = 30 × 2 × 3/5 = 36 kN·m, under the load. (37.5 = WL/4 trap — only for a central load.)","te":["A simply supported beam of span 5 m carries a point load of 30 kN at 2 m from the left support. The maximum bending moment is:"],"xt":"Mmax = Wab/L = 30 × 2 × 3/5 = 36 kN·m, under the load. (37.5 = WL/4 trap — only for a central load.)"},{"n":19,"en":["In which of the following beams does a point of contraflexure occur?","I. Cantilever carrying UDL over its full length","II. Simply supported beam with a central point load","III. Beam overhanging on both sides, with UDL over the full length","IV. Fixed beam carrying UDL over the full span"],"o":[["I and II only","I and II only"],["III and IV only","III and IV only"],["II and III only","II and III only"],["I, III and IV only","I, III and IV only"]],"sec":"C. Shear Force and Bending Moment","a":1,"xe":"Contraflexure needs BM to change sign (sagging ↔ hogging). Cantilever = only hogging; SS beam = only sagging. Overhanging and fixed beams have both.","te":["In which of the following beams does a point of contraflexure occur?","I. Cantilever carrying UDL over its full length","II. Simply supported beam with a central point load","III. Beam overhanging on both sides, with UDL over the full length","IV. Fixed beam carrying UDL over the full span"],"xt":"Contraflexure needs BM to change sign (sagging ↔ hogging). Cantilever = only hogging; SS beam = only sagging. Overhanging and fixed beams have both."},{"n":20,"en":["A simply supported beam AB of span 6 m carries a load varying uniformly from zero at A to 12 kN/m at B. The reaction at B is:"],"o":[["12 kN","12 kN"],["18 kN","18 kN"],["24 kN","24 kN"],["36 kN","36 kN"]],"sec":"C. Shear Force and Bending Moment","a":2,"xe":"Total load = ½ × 12 × 6 = 36 kN acting at 2L/3 = 4 m from A. RB = 36 × 4/6 = 24 kN; RA = 12 kN (= wL/6, asked in 2023).","te":["A simply supported beam AB of span 6 m carries a load varying uniformly from zero at A to 12 kN/m at B. The reaction at B is:"],"xt":"Total load = ½ × 12 × 6 = 36 kN acting at 2L/3 = 4 m from A. RB = 36 × 4/6 = 24 kN; RA = 12 kN (= wL/6, asked in 2023)."},{"n":21,"en":["Consider the following statements regarding a beam:","I. The slope of the shear force diagram at a section equals the intensity of loading at that section.","II. The slope of the bending moment diagram at a section equals the shear force at that section.","III. Bending moment is maximum or minimum where the shear force changes sign.","IV. Over a portion carrying no load, the bending moment diagram is parabolic.","Which of the above statements are correct?"],"o":[["I, II and III only","I, II and III only"],["I and II only","I and II only"],["II, III and IV only","II, III and IV only"],["I, II, III and IV","I, II, III and IV"]],"sec":"C. Shear Force and Bending Moment","a":0,"xe":"dV/dx = −w, dM/dx = V, so I, II, III are true. With no load, SF is constant and BM is linear (straight line), not parabolic.","te":["Consider the following statements regarding a beam:","I. The slope of the shear force diagram at a section equals the intensity of loading at that section.","II. The slope of the bending moment diagram at a section equals the shear force at that section.","III. Bending moment is maximum or minimum where the shear force changes sign.","IV. Over a portion carrying no load, the bending moment diagram is parabolic.","Which of the above statements are correct?"],"xt":"dV/dx = −w, dM/dx = V, so I, II, III are true. With no load, SF is constant and BM is linear (straight line), not parabolic."},{"n":22,"en":["Match List-I (loading) with List-II (shape of BMD):","List-I","A. SS beam, central point load","B. SS beam, UDL on full span","C. Cantilever, UVL (zero at free end)","D. Cantilever, couple at free end","List-II","1. Rectangle","2. Triangle","3. Cubic curve","4. Parabola"],"o":[["A-2, B-3, C-4, D-1","A-2, B-3, C-4, D-1"],["A-4, B-2, C-3, D-1","A-4, B-2, C-3, D-1"],["A-2, B-4, C-1, D-3","A-2, B-4, C-1, D-3"],["A-2, B-4, C-3, D-1","A-2, B-4, C-3, D-1"]],"sec":"C. Shear Force and Bending Moment","a":3,"xe":"Degree of BMD = degree of load + 2: point load → linear (triangle); UDL → parabola; UVL → cubic. A couple gives constant BM (rectangle).","te":["Match List-I (loading) with List-II (shape of BMD):","List-I","A. SS beam, central point load","B. SS beam, UDL on full span","C. Cantilever, UVL (zero at free end)","D. Cantilever, couple at free end","List-II","1. Rectangle","2. Triangle","3. Cubic curve","4. Parabola"],"xt":"Degree of BMD = degree of load + 2: point load → linear (triangle); UDL → parabola; UVL → cubic. A couple gives constant BM (rectangle)."},{"n":23,"en":["A simply supported beam of span 8 m carries a UDL of 10 kN/m over its full span. The shear force at a section 2 m from the left support is:"],"o":[["0","0"],["20 kN","20 kN"],["40 kN","40 kN"],["60 kN","60 kN"]],"sec":"C. Shear Force and Bending Moment","a":1,"xe":"RA = wL/2 = 40 kN. SF at 2 m = 40 − 10 × 2 = 20 kN. (SF = 0 only at mid-span.)","te":["A simply supported beam of span 8 m carries a UDL of 10 kN/m over its full span. The shear force at a section 2 m from the left support is:"],"xt":"RA = wL/2 = 40 kN. SF at 2 m = 40 − 10 × 2 = 20 kN. (SF = 0 only at mid-span.)"},{"n":24,"en":["A steel plate 12 mm thick is bent into a circular arc of radius 8 m. Taking E = 2 × 10⁵ N/mm², the maximum bending stress induced is:"],"o":[["300 N/mm²","300 N/mm²"],["200 N/mm²","200 N/mm²"],["150 N/mm²","150 N/mm²"],["75 N/mm²","75 N/mm²"]],"sec":"D. Bending Stresses and Shear Stresses in Beams","a":2,"xe":"σ/y = E/R → σ = E·y/R = 2×10⁵ × 6/8000 = 150 N/mm². y = half the thickness (2023 Q3 was this exact type).","te":["A steel plate 12 mm thick is bent into a circular arc of radius 8 m. Taking E = 2 × 10⁵ N/mm², the maximum bending stress induced is:"],"xt":"σ/y = E/R → σ = E·y/R = 2×10⁵ × 6/8000 = 150 N/mm². y = half the thickness (2023 Q3 was this exact type)."},{"n":25,"en":["A rectangular beam 100 mm wide and 200 mm deep is subjected to a maximum bending moment of 20 kN·m. The maximum bending stress is:"],"o":[["30 N/mm²","30 N/mm²"],["15 N/mm²","15 N/mm²"],["60 N/mm²","60 N/mm²"],["45 N/mm²","45 N/mm²"]],"sec":"D. Bending Stresses and Shear Stresses in Beams","a":0,"xe":"Z = bd²/6 = 100 × 200²/6 = 6.67 × 10⁵ mm³. σ = M/Z = 20 × 10⁶/6.67 × 10⁵ = 30 N/mm².","te":["A rectangular beam 100 mm wide and 200 mm deep is subjected to a maximum bending moment of 20 kN·m. The maximum bending stress is:"],"xt":"Z = bd²/6 = 100 × 200²/6 = 6.67 × 10⁵ mm³. σ = M/Z = 20 × 10⁶/6.67 × 10⁵ = 30 N/mm²."},{"n":26,"en":["A rectangular beam has depth twice its width. The ratio of its moment-carrying capacity when placed with the depth vertical to that when placed with the width vertical is:"],"o":[["1","1"],["2","2"],["4","4"],["8","8"]],"sec":"D. Bending Stresses and Shear Stresses in Beams","a":1,"xe":"M ∝ Z. (b·d²/6) ÷ (d·b²/6) = d/b = 2.","te":["A rectangular beam has depth twice its width. The ratio of its moment-carrying capacity when placed with the depth vertical to that when placed with the width vertical is:"],"xt":"M ∝ Z. (b·d²/6) ÷ (d·b²/6) = d/b = 2."},{"n":27,"en":["Statement 1: For the same cross-sectional area, a square section is stronger in bending than a circular section.","Statement 2: An I-section is the most economical beam section because most of its material is placed far from the neutral axis."],"o":[["Both statements are true","Both statements are true"],["Both statements are false","Both statements are false"],["Statement 1 is true, Statement 2 is false","Statement 1 is true, Statement 2 is false"],["Statement 1 is false, Statement 2 is true","Statement 1 is false, Statement 2 is true"]],"sec":"D. Bending Stresses and Shear Stresses in Beams","a":0,"xe":"Z(square)/Z(circle) ≈ 1.18 for equal area, so S1 is true. Bending stress is largest far from the NA, so material there is most effective, so S2 is true.","te":["Statement 1: For the same cross-sectional area, a square section is stronger in bending than a circular section.","Statement 2: An I-section is the most economical beam section because most of its material is placed far from the neutral axis."],"xt":"Z(square)/Z(circle) ≈ 1.18 for equal area, so S1 is true. Bending stress is largest far from the NA, so material there is most effective, so S2 is true."},{"n":28,"en":["Which of the following statements is INCORRECT?"],"o":[["The neutral axis passes through the centroid of the section (homogeneous beam, elastic bending)","The neutral axis passes through the centroid of the section (homogeneous beam, elastic bending)"],["Bending stress is zero at the neutral axis","Bending stress is zero at the neutral axis"],["Shear stress is zero at the neutral axis of a rectangular section","Shear stress is zero at the neutral axis of a rectangular section"],["Fibres lying on the neutral layer do not change in length","Fibres lying on the neutral layer do not change in length"]],"sec":"D. Bending Stresses and Shear Stresses in Beams","a":2,"xe":"Shear stress is MAXIMUM at the NA of a rectangular section (1.5 τavg). It is zero at the top and bottom edges.","te":["Which of the following statements is INCORRECT?"],"xt":"Shear stress is MAXIMUM at the NA of a rectangular section (1.5 τavg). It is zero at the top and bottom edges."},{"n":29,"en":["A rectangular beam 100 mm wide and 200 mm deep carries a shear force of 40 kN. The maximum shear stress is:"],"o":[["2.0 N/mm²","2.0 N/mm²"],["2.67 N/mm²","2.67 N/mm²"],["4.0 N/mm²","4.0 N/mm²"],["3.0 N/mm²","3.0 N/mm²"]],"sec":"D. Bending Stresses and Shear Stresses in Beams","a":3,"xe":"τavg = V/A = 40,000/20,000 = 2 N/mm². τmax = 1.5 τavg = 3 N/mm².","te":["A rectangular beam 100 mm wide and 200 mm deep carries a shear force of 40 kN. The maximum shear stress is:"],"xt":"τavg = V/A = 40,000/20,000 = 2 N/mm². τmax = 1.5 τavg = 3 N/mm²."},{"n":30,"en":["Consider the following statements for an I-section beam:","I. Most of the bending moment is resisted by the flanges.","II. Most of the shear force is resisted by the web.","III. The shear stress distribution shows a sudden jump at the junction of flange and web.","IV. Maximum shear stress occurs at the neutral axis.","Which of the above statements are correct?"],"o":[["I and II only","I and II only"],["I, II and III only","I, II and III only"],["II and IV only","II and IV only"],["I, II, III and IV","I, II, III and IV"]],"sec":"D. Bending Stresses and Shear Stresses in Beams","a":3,"xe":"All are true. The jump happens because τ = VAȳ/(Ib) and the width b changes suddenly from flange width to web thickness.","te":["Consider the following statements for an I-section beam:","I. Most of the bending moment is resisted by the flanges.","II. Most of the shear force is resisted by the web.","III. The shear stress distribution shows a sudden jump at the junction of flange and web.","IV. Maximum shear stress occurs at the neutral axis.","Which of the above statements are correct?"],"xt":"All are true. The jump happens because τ = VAȳ/(Ib) and the width b changes suddenly from flange width to web thickness."},{"n":31,"en":["At a point in a strained material, σx = 80 N/mm² (tensile), σy = 20 N/mm² (tensile) and shear stress τxy = 40 N/mm². The principal stresses are:"],"o":[["100 and 0 N/mm²","100 and 0 N/mm²"],["90 and 10 N/mm²","90 and 10 N/mm²"],["80 and 20 N/mm²","80 and 20 N/mm²"],["110 and −10 N/mm²","110 and −10 N/mm²"]],"sec":"E. Principal Stresses, Mohr's Circle and Theories of Failure","a":0,"xe":"Centre = (80+20)/2 = 50. Radius = √(30² + 40²) = 50. σ₁,₂ = 50 ± 50 = 100, 0. (τmax = radius = 50.)","te":["At a point in a strained material, σx = 80 N/mm² (tensile), σy = 20 N/mm² (tensile) and shear stress τxy = 40 N/mm². The principal stresses are:"],"xt":"Centre = (80+20)/2 = 50. Radius = √(30² + 40²) = 50. σ₁,₂ = 50 ± 50 = 100, 0. (τmax = radius = 50.)"},{"n":32,"en":["A bar is subjected to a direct tensile stress of 100 N/mm². The normal stress on a plane inclined at 30° to the normal cross-section is:"],"o":[["25 N/mm²","25 N/mm²"],["50 N/mm²","50 N/mm²"],["75 N/mm²","75 N/mm²"],["86.6 N/mm²","86.6 N/mm²"]],"sec":"E. Principal Stresses, Mohr's Circle and Theories of Failure","a":2,"xe":"σn = σ cos²θ = 100 × (√3/2)² = 75 N/mm². Shear on that plane = (σ/2) sin 2θ = 43.3 N/mm².","te":["A bar is subjected to a direct tensile stress of 100 N/mm². The normal stress on a plane inclined at 30° to the normal cross-section is:"],"xt":"σn = σ cos²θ = 100 × (√3/2)² = 75 N/mm². Shear on that plane = (σ/2) sin 2θ = 43.3 N/mm²."},{"n":33,"en":["An element of a shaft is in a state of pure shear with τ = 60 N/mm². The principal stresses and the planes on which they act are:"],"o":[["±60 N/mm², on planes at 45° to the shear planes","±60 N/mm², on planes at 45° to the shear planes"],["±30 N/mm², on planes at 45°","±30 N/mm², on planes at 45°"],["60 and 0 N/mm², on planes at 90°","60 and 0 N/mm², on planes at 90°"],["±120 N/mm², on planes at 45°","±120 N/mm², on planes at 45°"]],"sec":"E. Principal Stresses, Mohr's Circle and Theories of Failure","a":0,"xe":"In pure shear, Mohr's circle is centred at the origin with radius τ → σ₁ = +τ, σ₂ = −τ, at 45°. This is why brittle shafts break on 45° helical planes.","te":["An element of a shaft is in a state of pure shear with τ = 60 N/mm². The principal stresses and the planes on which they act are:"],"xt":"In pure shear, Mohr's circle is centred at the origin with radius τ → σ₁ = +τ, σ₂ = −τ, at 45°. This is why brittle shafts break on 45° helical planes."},{"n":34,"en":["Consider the following statements about Mohr's circle of stress:","I. The radius of the circle equals the maximum shear stress.","II. The centre lies on the σ-axis at (σx + σy)/2.","III. When σx = σy and τ = 0, the circle reduces to a point.","IV. An angle measured on Mohr's circle is half the actual angle between the planes.","Which of the above statements are correct?"],"o":[["I and II only","I and II only"],["I, II and III only","I, II and III only"],["I, III and IV only","I, III and IV only"],["I, II, III and IV","I, II, III and IV"]],"sec":"E. Principal Stresses, Mohr's Circle and Theories of Failure","a":1,"xe":"Angles on Mohr's circle are TWICE the actual angles (2θ), so IV is false.","te":["Consider the following statements about Mohr's circle of stress:","I. The radius of the circle equals the maximum shear stress.","II. The centre lies on the σ-axis at (σx + σy)/2.","III. When σx = σy and τ = 0, the circle reduces to a point.","IV. An angle measured on Mohr's circle is half the actual angle between the planes.","Which of the above statements are correct?"],"xt":"Angles on Mohr's circle are TWICE the actual angles (2θ), so IV is false."},{"n":35,"en":["Match List-I (theory of failure) with List-II (criterion):","List-I","A. Rankine","B. Guest / Tresca","C. St. Venant","D. Von Mises / Hencky","List-II","1. Distortion (shear strain) energy","2. Maximum principal stress","3. Maximum shear stress","4. Maximum principal strain"],"o":[["A-2, B-3, C-1, D-4","A-2, B-3, C-1, D-4"],["A-2, B-3, C-4, D-1","A-2, B-3, C-4, D-1"],["A-3, B-2, C-4, D-1","A-3, B-2, C-4, D-1"],["A-4, B-3, C-2, D-1","A-4, B-3, C-2, D-1"]],"sec":"E. Principal Stresses, Mohr's Circle and Theories of Failure","a":1,"xe":"Rankine–stress, Guest/Tresca–shear, St. Venant–strain, Haigh–total strain energy, Von Mises–distortion energy. (2023 asked 'Haigh's theory'.)","te":["Match List-I (theory of failure) with List-II (criterion):","List-I","A. Rankine","B. Guest / Tresca","C. St. Venant","D. Von Mises / Hencky","List-II","1. Distortion (shear strain) energy","2. Maximum principal stress","3. Maximum shear stress","4. Maximum principal strain"],"xt":"Rankine–stress, Guest/Tresca–shear, St. Venant–strain, Haigh–total strain energy, Von Mises–distortion energy. (2023 asked 'Haigh's theory'.)"},{"n":36,"en":["The principal stresses at a point in an elastic material are 180 N/mm² (tensile), 60 N/mm² (tensile) and 30 N/mm² (compressive). The elastic limit in simple tension is 200 N/mm². According to the maximum shear stress theory:"],"o":[["τmax = 60 N/mm², the material is safe","τmax = 60 N/mm², the material is safe"],["τmax = 105 N/mm², failure will occur","τmax = 105 N/mm², failure will occur"],["τmax = 90 N/mm², the material is safe","τmax = 90 N/mm², the material is safe"],["τmax = 105 N/mm², the material is safe","τmax = 105 N/mm², the material is safe"]],"sec":"E. Principal Stresses, Mohr's Circle and Theories of Failure","a":1,"xe":"τmax = (σ₁ − σ₃)/2 = (180 − (−30))/2 = 105. Allowable = 200/2 = 100. 105 > 100 → failure. (2023 Q14 type — always use the largest minus the smallest, keeping the sign.)","te":["The principal stresses at a point in an elastic material are 180 N/mm² (tensile), 60 N/mm² (tensile) and 30 N/mm² (compressive). The elastic limit in simple tension is 200 N/mm². According to the maximum shear stress theory:"],"xt":"τmax = (σ₁ − σ₃)/2 = (180 − (−30))/2 = 105. Allowable = 200/2 = 100. 105 > 100 → failure. (2023 Q14 type — always use the largest minus the smallest, keeping the sign.)"},{"n":37,"en":["Assertion (A): The maximum principal stress theory is not suitable for ductile materials.","Reason (R): Ductile materials generally fail by yielding due to shear rather than by direct tension."],"o":[["Both A and R are true, and R is the correct explanation of A","Both A and R are true, and R is the correct explanation of A"],["Both A and R are true, but R is NOT the correct explanation of A","Both A and R are true, but R is NOT the correct explanation of A"],["A is true, but R is false","A is true, but R is false"],["A is false, but R is true","A is false, but R is true"]],"sec":"E. Principal Stresses, Mohr's Circle and Theories of Failure","a":0,"xe":"Both true, and R explains A. That is why Tresca/Von Mises are used for ductile materials and Rankine for brittle ones.","te":["Assertion (A): The maximum principal stress theory is not suitable for ductile materials.","Reason (R): Ductile materials generally fail by yielding due to shear rather than by direct tension."],"xt":"Both true, and R explains A. That is why Tresca/Von Mises are used for ductile materials and Rankine for brittle ones."},{"n":38,"en":["A plate is subjected to tensile stresses σx = 100 N/mm² and σy = 50 N/mm². Taking E = 2 × 10⁵ N/mm² and μ = 0.3, the strain in the x-direction is:"],"o":[["5.0 × 10⁻⁴","5.0 × 10⁻⁴"],["4.25 × 10⁻⁴","4.25 × 10⁻⁴"],["4.5 × 10⁻⁴","4.5 × 10⁻⁴"],["3.5 × 10⁻⁴","3.5 × 10⁻⁴"]],"sec":"E. Principal Stresses, Mohr's Circle and Theories of Failure","a":1,"xe":"εx = (σx − μσy)/E = (100 − 15)/2×10⁵ = 4.25 × 10⁻⁴.","te":["A plate is subjected to tensile stresses σx = 100 N/mm² and σy = 50 N/mm². Taking E = 2 × 10⁵ N/mm² and μ = 0.3, the strain in the x-direction is:"],"xt":"εx = (σx − μσy)/E = (100 − 15)/2×10⁵ = 4.25 × 10⁻⁴."},{"n":39,"en":["A cantilever 2 m long carries a point load of 20 kN at its free end. The flexural rigidity EI = 4000 kN·m². The deflection at the free end is:"],"o":[["6.67 mm","6.67 mm"],["10 mm","10 mm"],["20 mm","20 mm"],["13.33 mm","13.33 mm"]],"sec":"F. Deflection of Beams (asked heavily in 2023)","a":3,"xe":"δ = WL³/3EI = 20 × 8/(3 × 4000) = 0.01333 m = 13.33 mm.","te":["A cantilever 2 m long carries a point load of 20 kN at its free end. The flexural rigidity EI = 4000 kN·m². The deflection at the free end is:"],"xt":"δ = WL³/3EI = 20 × 8/(3 × 4000) = 0.01333 m = 13.33 mm."},{"n":40,"en":["If the span of a simply supported beam carrying a UDL (same intensity w) is doubled, its maximum deflection becomes:"],"o":[["2 times","2 times"],["4 times","4 times"],["8 times","8 times"],["16 times","16 times"]],"sec":"F. Deflection of Beams (asked heavily in 2023)","a":3,"xe":"δ = 5wL⁴/384EI ∝ L⁴ → 2⁴ = 16 times. (For a central point load, δ ∝ L³ → 8 times.)","te":["If the span of a simply supported beam carrying a UDL (same intensity w) is doubled, its maximum deflection becomes:"],"xt":"δ = 5wL⁴/384EI ∝ L⁴ → 2⁴ = 16 times. (For a central point load, δ ∝ L³ →     var l=L();if(!auto){var u=50-Object.keys(st.a).length;if(u>0&&!confirm(l.confirm(u)))return}
    st.done=true;clearInterval(timerId);save();drawQs();drawResult(auto);$("result").scrollIntoView({behavior:"smooth"})
  }
  function drawResult(auto){
    var l=L(),k=counts(),r=$("result");if(!st.done){r.hidden=true;return}
    var v=l.v.filter(function(x){return k.m>=x[1]})[0][0];
    r.hidden=false;r.innerHTML='<h2>'+esc(l.res)+' · '+esc(l.title(tn))+'</h2>'+(auto?'<p>'+esc(l.time)+'</p>':'')+
      '<div class="stats"><div><b>'+k.m+'</b><small>'+l.m+' / 50</small></div><div><b>'+k.c+'</b><small>'+l.c+'</small></div><div><b>'+k.w+'</b><small>'+l.w+'</small></div><div><b>'+k.s+'</b><small>'+l.s+'</small></div></div>'+
      '<p class="verdict">'+esc(v)+'</p><p><small>'+esc(l.guide)+'</small></p>';
  }
  document.addEventListener("click",function(e){
    var b=e.target.closest(".opts button");
    if(b&&!st.done){var i=+b.dataset.i,j=+b.dataset.j;if(st.inst&&st.a[i]!==undefined)return;if(st.a[i]===j)delete st.a[i];else st.a[i]=j;save();
      if(st.inst){drawQs()}else{b.parentNode.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x===b&&st.a[i]===j)});drawBar()}return}
    var m=e.target.closest("[data-m]");if(m){med=m.dataset.m;ls("sul_med",med);drawAll();return}
    var t=e.target.closest("[data-t]");if(t){tn=+t.dataset.t;history.replaceState(null,"","?t="+tn+"&from="+from);drawAll(true);return}
  });
  $("submit").onclick=$("submit2").onclick=function(){finish(false)};
  $("reset").onclick=function(){st={a:{},done:false,left:3000,inst:st.inst};save();drawAll(true);window.scrollTo(0,0)};
  function drawAll(reload){if(reload!==false&&reload)load();drawHead();drawQs();drawResult();startTimer()}
  load();drawAll(false);
})();
</script>
</body>
</html>
