  h+='<div class="ops">'+o.o.map(function(op,j){var c=show?(j===o.a?"ok":(j===a?"no":"")):"";return'<button type="button" data-q="'+esc(o.id)+'" data-j="'+j+'"'+(c?' class="'+c+'"':'')+(show?' disabled':'')+'><b>('+"abcd"[j]+')</b><span>'+esc(L(op))+'</span></button>'}).join("")+'</div>';
  if(show)h+='<p class="why"><b style="color:'+(a===o.a?'var(--leaf)':'var(--kumkum)')+'">'+(a===o.a?x.right:x.wrong)+'</b> '+x.ans+': ('+"abcd"[o.a]+') — '+esc(L(o.why))+'</p>';
  h+='<p class="src">'+x.orig+' · '+esc(L(o.lab))+' · <a href="'+o.link+'">'+x.open+'</a></p>';
  return h+'</div>'}
function chrome(){var x=t();document.documentElement.lang=med;["eb","h1","lede","foot"].forEach(function(k){$(k).textContent=x[k]});
  document.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-m")===med)});
  var nd=QS.length?due().length:0;
  $("mt").innerHTML='<button type="button" role="tab" data-tab="bank" aria-selected="'+(tab==="bank")+'"><b>'+x.bank+'</b><small>'+x.bankS(QS.length)+'</small></button><button type="button" role="tab" data-tab="rev" aria-selected="'+(tab==="rev")+'" class="'+(nd?"due":"")+'"><b>'+x.rev+'</b><small>'+x.revS(nd)+'</small></button>'}
function drawBank(){var x=t(),F=view||filtered(),cnt={};QS.forEach(function(o){cnt[o.subj]=(cnt[o.subj]||0)+1});
  var h='<div class="flt"><div class="rw">'+['all'].concat(Object.keys(SUBJ).filter(function(k){return cnt[k]})).map(function(k){var s=SUBJ[k];return'<button type="button" class="chip" data-s="'+k+'" aria-pressed="'+(fS===k)+'">'+(k==="all"?x.all:s[0]+' '+(med==="te"?s[2]:s[1])+' '+cnt[k])+'</button>'}).join("")+'</div>'+
    '<div class="rw2"><select id="fT"><option value="all">'+x.type+'</option>'+Object.keys(TYPES).map(function(k){return'<option value="'+k+'"'+(fT===k?" selected":"")+'>'+TYPES[k][med==="te"?1:0]+'</option>'}).join("")+'</select>'+
    '<select id="fSrc"><option value="all">'+x.src+'</option><option value="d"'+(fSrc==="d"?" selected":"")+'>'+x.sD+'</option><option value="w"'+(fSrc==="w"?" selected":"")+'>'+x.sW+'</option><option value="p"'+(fSrc==="p"?" selected":"")+'>'+x.sP+'</option></select>'+
    '<input type="search" id="q" placeholder="'+x.ph+'" value="'+esc(q)+'"></div></div>';
  h+='<div class="bar"><span>'+x.shown(Math.min(shown,F.length),F.length)+'</span><button type="button" class="go" data-rnd="1">'+x.rnd+'</button></div>';
  h+=F.length?F.slice(0,shown).map(card).join(""):'<p class="empty">'+x.none+'</p>';
  if(F.length>shown)h+='<button type="button" class="more" data-more="1">'+x.more+' ('+(F.length-shown)+')</button>';
  $("pane").innerHTML=h}
function drawRev(){var x=t(),D=due(),R=revGet(),boxes=[0,0,0,0],later=0,td=liso(0);Object.keys(R).forEach(function(id){var e=R[id];boxes[Math.min(3,e.b-1)]++;if(e.due>td)later++});
  var h='<div class="rvh"><h2>'+x.rvh+'</h2><p>'+x.rvp+'</p><div class="boxes">'+boxes.map(function(n,i){return'<span>'+x.box(i+1,n)+'</span>'}).join("")+'</div></div>';
  h+=D.length?D.map(card).join(""):'<p class="empty">'+x.noDue+'</p>';
  if(later)h+='<p class="empty" style="padding-top:0">'+x.upcoming(later)+'</p>';
  h+='<p class="empty" style="padding-top:0;font-size:.82rem">🔒 '+x.stored+'</p>';
  $("pane").innerHTML=h}
function draw(){chrome();if(!QS.length){return}if(tab==="bank")drawBank();else drawRev()}
document.addEventListener("click",function(e){
  var b=e.target.closest(".seg button");if(b){med=b.getAttribute("data-m");try{localStorage.setItem("sul_med",med);localStorage.setItem("sul_lang",med)}catch(x){}draw();return}
  var tb=e.target.closest("[data-tab]");if(tb){tab=tb.getAttribute("data-tab");view=null;history.replaceState(null,"",tab==="rev"?"?tab=rev":location.pathname);draw();window.scrollTo({top:0});return}
  var s=e.target.closest("[data-s]");if(s){fS=s.getAttribute("data-s");shown=20;view=null;draw();return}
  var m=e.target.closest("[data-more]");if(m){shown+=20;draw();return}
  var r=e.target.closest("[data-rnd]");if(r){var F=filtered().slice();for(var i=F.length-1;i>0;i--){var k=Math.floor(Math.random()*(i+1)),z=F[i];F[i]=F[k];F[k]=z}view=F.slice(0,10);shown=10;F.forEach(function(o){});view.forEach(function(o){delete ANS[o.id]});draw();window.scrollTo({top:0});return}
  var o=e.target.closest("[data-q]");if(o){var id=o.getAttribute("data-q"),Q=BY[id];if(!Q||ANS[id]!==undefined)return;var j=+o.getAttribute("data-j");ANS[id]=j;sulRev(id,j===Q.a);
    var box=o.closest(".qq"),tmp=document.createElement("div");tmp.innerHTML=card(Q,0);tmp.firstChild.id=box.id;box.replaceWith(tmp.firstChild);chrome();return}
});
document.addEventListener("change",function(e){if(e.target.id==="fT"){fT=e.target.value;shown=20;view=null;draw()}if(e.target.id==="fSrc"){fSrc=e.target.value;shown=20;view=null;draw()}});
document.addEventListener("input",function(e){if(e.target.id==="q"){q=e.target.value.trim().toLowerCase();shown=20;view=null;var pos=e.target.selectionStart;drawBank();var n=$("q");n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}});
chrome();load().then(draw);
})();
</script>
