<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Progress</title>
<meta name="description" content="Your Sulabham progress: streak, quiz scores, weak areas, Group 2 syllabus coverage and course progress.">
<meta property="og:image" content="sulabham-logo.png">
<link rel="icon" type="image/svg+xml" href="sulabham-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Telugu:wght@500;700;800&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans:wght@400;600&display=swap">
<style>
:root{--ink:#16324a;--paper:#f6f8f9;--card:#fff;--line:#d6dfe5;--muted:#52677a;--pasupu:#e3a400;--pasupu-soft:#fff3cf;--leaf:#1f7a55;--leaf-soft:#e3f3ea;--kumkum:#b3322b;--chain:#2c6e8f;--chain-soft:#e6f1f6;--plum:#7a3b8f;
  --f-display:"Anek Telugu","Noto Sans",sans-serif;--f-body:"Noto Sans","Noto Sans Telugu",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6eef4;--paper:#0f1a23;--card:#16242f;--line:#29404f;--muted:#9fb3c2;--pasupu:#f2bd2f;--pasupu-soft:#3a2f0e;--leaf:#4cc28c;--leaf-soft:#123326;--kumkum:#ef7a72;--chain:#7cc3e0;--chain-soft:#14303d;--plum:#d59be6;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e6eef4;--paper:#0f1a23;--card:#16242f;--line:#29404f;--muted:#9fb3c2;--pasupu:#f2bd2f;--pasupu-soft:#3a2f0e;--leaf:#4cc28c;--leaf-soft:#123326;--kumkum:#ef7a72;--chain:#7cc3e0;--chain-soft:#14303d;--plum:#d59be6;color-scheme:dark}
*{box-sizing:border-box}
html[lang="te"]{--f-body:"Noto Sans Telugu","Noto Sans",sans-serif}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
a{color:var(--chain)}button{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
nav{position:sticky;top:0;z-index:8;background:var(--card);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.brand b{color:var(--pasupu)}.brand img{width:32px;height:32px}
.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;font-weight:600;font-size:.88rem;padding:7px 12px;min-height:38px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
header{padding:20px 0 4px}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.1;margin:4px 0 6px}
.lede{color:var(--muted);margin:0;font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1.1}
.stat small{color:var(--muted);font-size:.78rem;font-weight:600}
.stat.fire{background:linear-gradient(135deg,#fff3cf,#ffe08a);border-color:#e3a400;color:#3a2a00}.stat.fire small{color:#6b5200}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 14px}
.box h2{margin:0 0 10px;font-family:var(--f-display);font-size:1.2rem;display:flex;align-items:center;gap:8px}
.box h2 a{margin-left:auto;font-family:var(--f-body);font-size:.85rem;font-weight:700;text-decoration:none}
.task{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.task:first-of-type{border-top:0}
.task .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.25rem;background:var(--chain-soft)}
.task .tx{flex:1;min-width:0}.task .tx b{display:block;font-size:.98rem}.task .tx small{color:var(--muted);font-size:.82rem}
.task .st{flex:none;font-size:.8rem;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--pasupu-soft);color:#7a5600}
.task .st.ok{background:var(--leaf-soft);color:var(--leaf)}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.bars .b i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--chain)}
.bars .b i.lo{background:var(--kumkum)}.bars .b i.mid{background:var(--pasupu)}.bars .b i.hi{background:var(--leaf)}
.bars .b small{font-size:.66rem;color:var(--muted);white-space:nowrap}
.bars .b em{font-style:normal;font-size:.7rem;font-weight:700}
.row{display:grid;grid-template-columns:minmax(110px,40%) 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:.92rem}
.track{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--leaf)}.track i.w{background:var(--kumkum)}.track i.m{background:var(--pasupu)}
.row b{font-size:.85rem}
ul.rv{margin:0;padding-left:20px}ul.rv li{margin:4px 0;font-size:.93rem}
.muted{color:var(--muted);font-size:.9rem;margin:0}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:800;border-radius:999px;padding:9px 16px;background:var(--ink);color:var(--paper);min-height:42px}
.note{font-size:.8rem;color:var(--muted);margin:6px 0 18px}
footer{color:var(--muted);font-size:.85rem;padding:10px 0 40px}
</style>
</head>

      return'<a class="task" href="'+k.href+(med==="te"?"&m=te":"")+'"><span class="ic">'+ic+'</span><span class="tx"><b>'+esc(lab)+'</b></span>'+st+'</a>'}).join("")+'</section>';
  // trend
  var tr=q.slice(-10);h+='<section class="box"><h2>📈 '+x.trend+'</h2>'+(tr.length?'<div class="bars">'+tr.map(function(z){var p=Math.round(100*z.c/z.n),cl=p>=80?"hi":p>=50?"mid":"lo",dp=z.d.split("-");return'<div class="b"><em>'+z.c+'/'+z.n+'</em><i class="'+cl+'" style="height:'+Math.max(6,p*0.8)+'px"></i><small>'+(+dp[2])+'/'+(+dp[1])+(z.k==="m"?"☀":"☾")+'</small></div>'}).join("")+'</div>':'<p class="muted">'+x.notrend+'</p>')+'</section>';
  // weak areas
  var ca=Object.keys(R.cat).filter(function(k){return R.cat[k].n>=2}).sort(function(a,b){return R.cat[a].c/R.cat[a].n-R.cat[b].c/R.cat[b].n});
  h+='<section class="box"><h2>🎯 '+x.weak+'</h2>'+(ca.length?ca.map(function(k){var o=R.cat[k],p=Math.round(100*o.c/o.n),c=CATS[k]||["📌",k,k];return'<div class="row"><span>'+c[0]+' '+(med==="te"?c[2]:c[1])+'</span><span class="track"><i class="'+(p<50?"w":p<75?"m":"")+'" style="width:'+p+'%"></i></span><b>'+p+'%</b></div>'}).join("")+'<p class="note" style="margin:8px 0 0">'+x.weakTip+'</p>':'<p class="muted">'+x.noweak+'</p>')+'</section>';
  // syllabus
  if(R.SY){var S=lj("sul_syl_g2",{}),all=[],nextT=null,rev=[],per={};R.SY.stages.forEach(function(s){var d=0,tt=0;s.sec.forEach(function(c){c.u.forEach(function(u){u.t.forEach(function(z){all.push(z);tt++;if(S[z.id]===1)d++;if(S[z.id]===2)rev.push(z);if(!S[z.id]&&!nextT)nextT={z:z,s:s.id}})})});per[s.id]=[d,tt]});
    var d=all.filter(function(z){return S[z.id]===1}).length;
    h+='<section class="box"><h2>🗺️ '+x.syl+'<a href="syllabus.html'+(med==="te"?"?m=te":"")+'">'+x.sylOpen+'</a></h2><p class="muted" style="margin-bottom:8px">'+x.sylTxt(d,all.length,rev.length)+'</p>'+
      Object.keys(per).map(function(k){var p=per[k];return'<div class="row"><span>'+x.stg[k]+'</span><span class="track"><i style="width:'+(100*p[0]/p[1])+'%"></i></span><b>'+Math.round(100*p[0]/p[1])+'%</b></div>'}).join("")+
      (nextT?'<p style="margin:10px 0 0;font-size:.93rem"><b>'+x.next+'</b> <a href="syllabus.html?s='+nextT.s+(med==="te"?"&m=te":"")+'">'+esc(L(nextT.z))+'</a></p>':'')+
      '<h3 style="font-size:.95rem;margin:12px 0 4px">★ '+x.rev+'</h3>'+(rev.length?'<ul class="rv">'+rev.slice(0,8).map(function(z){return"<li>"+esc(L(z))+"</li>"}).join("")+'</ul>':'<p class="muted">'+x.norev+'</p>')+'</section>'}
  // courses
  h+='<section class="box"><h2>📚 '+x.courses+'</h2>'+
    '<a class="task" href="prelims.html"><span class="ic">🏛️</span><span class="tx"><b>'+x.pk+'</b><small>'+x.pkS(R.pk[0],R.pk[1])+'</small></span><span class="st'+(R.hasPk?" ok":"")+'">'+(R.hasPk?"🔓":"🎁")+' '+x.open+'</span></a>'+
    '<a class="task" href="aso.html"><span class="ic">📊</span><span class="tx"><b>'+x.aso+'</b><small>'+x.asoS(R.aso[0],R.aso[1])+'</small></span><span class="st'+(R.hasAso?" ok":"")+'">'+(R.hasAso?"🔓":"🎁")+' '+x.open+'</span></a></section>';
  h+='<p class="note">🔒 '+x.note+'</p>';
  $("main").innerHTML=h}
document.addEventListener("click",function(e){var b=e.target.closest(".seg button");if(b){med=b.getAttribute("data-m");try{localStorage.setItem("sul_med",med);localStorage.setItem("sul_lang",med)}catch(x){}draw()}});
draw();gather();
})();
</script>
