ర్పు భారత రుతుపవనాలను వివరిస్తుంది.","II. ఉష్ణమండల తూర్పు జెట్ వేసవి రుతుపవనాలతో ముడిపడి ఉంది.","III. ఎల్‌నినో సంవత్సరాల్లో భారత్‌కు సాధారణంగా సగటు కంటే ఎక్కువ రుతుపవన వర్షం వస్తుంది.","IV. సానుకూల హిందూ మహాసముద్ర ద్విధ్రువం (IOD) సాధారణంగా రుతుపవనాలకు అనుకూలం.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["III and IV","III మరియు IV"],["I and III","I మరియు III"],["II and III","II మరియు III"],["Only III","III మాత్రమే"]],"a":3,"xe":"El Niño usually weakens the monsoon and causes deficient rainfall.","xt":"ఎల్‌నినో సాధారణంగా రుతుపవనాలను బలహీనపరిచి వర్షలోటు కలిగిస్తుంది."},{"n":28,"en":["Consider the following statements:","I. The Siachen Glacier lies in the Karakoram range.","II. The Gangotri Glacier is the source of the Bhagirathi.","III. The Zemu Glacier is in Sikkim.","IV. The Siachen Glacier is located in Himachal Pradesh.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. సియాచిన్ హిమానీనదం కారకోరం శ్రేణిలో ఉంది.","II. గంగోత్రి హిమానీనదం భాగీరథి మూలం.","III. జెము హిమానీనదం సిక్కింలో ఉంది.","IV. సియాచిన్ హిమానీనదం హిమాచల్‌ప్రదేశ్‌లో ఉంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and II","I మరియు II"],["I and III","I మరియు III"],["I, II and III","I, II మరియు III"],["II and III","II మరియు III"]],"a":2,"xe":"Siachen is in the Karakoram of Ladakh (Nubra valley).","xt":"సియాచిన్ లద్దాఖ్ నుబ్రా లోయలోని కారకోరంలో ఉంది."},{"n":29,"en":["Consider the following statements:","I. The Narmada and Tapti flow westwards through rift valleys.","II. The Godavari is the longest river of peninsular India.","III. The Kosi is known as the 'Sorrow of Bihar'.","IV. The Narmada forms a large delta at its mouth.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. నర్మద, తపతి చీలిక లోయల గుండా పశ్చిమంగా ప్రవహిస్తాయి.","II. గోదావరి ద్వీపకల్ప భారతంలో అత్యంత పొడవైన నది.","III. కోసి నదిని 'బీహార్ దుఃఖదాయని' అంటారు.","IV. నర్మద ముఖద్వారం వద్ద పెద్ద డెల్టాను ఏర్పరుస్తుంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and III","I మరియు III"],["I, II and III","I, II మరియు III"],["II and III","II మరియు III"],["I and II","I మరియు II"]],"a":1,"xe":"The Narmada forms an estuary, not a delta.","xt":"నర్మద డెల్టా కాదు, ఈస్ట్యూరీ ఏర్పరుస్తుంది."},{"n":30,"en":["Arrange the following passes from west to east:"],"te":["ఈ కనుమలను పశ్చిమం నుండి తూర్పుకు వరుసగా అమర్చండి:"],"o":[["Zoji La – Shipki La – Nathu La – Bomdi La","జోజి లా – శిప్కి లా – నాథు లా – బొమ్డి లా"],["Shipki La – Zoji La – Nathu La – Bomdi La","శిప్కి లా – జోజి లా – నాథు లా – బొమ్డి లా"],["Zoji La – Nathu La – Shipki La – Bomdi La","జోజి లా – నాథు లా – శిప్కి లా – బొమ్డి లా"],["Zoji La – Shipki La – Bomdi La – Nathu La","జోజి లా – శిప్కి లా – బొమ్డి లా – నాథు లా"]],"a":0,"xe":"Ladakh/J&K (Zoji La) → Himachal (Shipki La) → Sikkim (Nathu La) → Arunachal (Bomdi La).","xt":"లద్దాఖ్ (జోజి లా) → హిమాచల్ (శిప్కి లా) → సిక్కిం (నాథు లా) → అరుణాచల్ (బొమ్డి లా)."},{"n":31,"en":["Consider the following statements:","I. The Tropic of Cancer passes through eight Indian states.","II. The Standard Meridian of India (82°30′E) passes through Mirzapur in Uttar Pradesh.","III. Indira Point in Great Nicobar is the southernmost point of India.","IV. India shares land boundaries with eight countries.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. కర్కాటక రేఖ ఎనిమిది భారత రాష్ట్రాల గుండా వెళ్తుంది.","II. భారత ప్రామాణిక రేఖాంశం (82°30′E) ఉత్తరప్రదేశ్‌లోని మీర్జాపూర్ గుండా వెళ్తుంది.","III. గ్రేట్ నికోబార్‌లోని ఇందిరా పాయింట్ భారతదేశపు దక్షిణ చివరి బిందువు.","IV. భారతదేశం ఎనిమిది దేశాలతో భూ సరిహద్దులు పంచుకుంటుంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and II","I మరియు II"],["I and III","I మరియు III"],["II and III","II మరియు III"],["I, II and III","I, II మరియు III"]],"a":3,"xe":"India has land borders with seven countries (Pakistan, Afghanistan via PoK, China, Nepal, Bhutan, Bangladesh, Myanmar).","xt":"భారత్‌కు ఏడు దేశాలతో భూ సరిహద్దు ఉంది (పాకిస్తాన్, ఆఫ్ఘనిస్తాన్, చైనా, నేపాల్, భూటాన్, బంగ్లాదేశ్, మయన్మార్)."},{"n":32,"en":["Match the lakes with their characteristics:","List-I (Lake)","A. Loktak","B. Vembanad","C. Sambhar","D. Chilika","List-II (Characteristic)","I. Largest inland saline lake","II. Floating phumdis, Manipur","III. Longest lake of Kerala","IV. Brackish-water lagoon in Odisha","Choose the correct answer using the codes given below:"],"te":["సరస్సులను వాటి లక్షణాలతో జతపరచండి:","జాబితా-I (సరస్సు)","A. లోక్‌తక్","B. వెంబనాడ్","C. సాంభార్","D. చిలికా","జాబితా-II (లక్షణం)","I. అతిపెద్ద అంతర్గత లవణ సరస్సు","II. తేలియాడే 'ఫుమ్డీలు', మణిపూర్","III. కేరళలో పొడవైన సరస్సు","IV. ఒడిశాలోని ఉప్పు–మంచి నీటి మడుగు","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–II, B–III, C–IV, D–I","A–II, B–III, C–IV, D–I"],["A–I, B–III, C–II, D–IV","A–I, B–III, C–II, D–IV"],["A–II, B–III, C–I, D–IV","A–II, B–III, C–I, D–IV"],["A–II, B–IV, C–I, D–III","A–II, B–IV, C–I, D–III"]],"a":2,"xe":"Loktak–phumdis; Vembanad–longest in Kerala; Sambhar–saline; Chilika–lagoon.","xt":"లోక్‌తక్–ఫుమ్డీలు; వెంబనాడ్–కేరళ పొడవైన; సాంభార్–లవణ; చిలికా–మడుగు."},{"n":33,"en":["Consider the following Assertion (A) and Reason (R) and choose the correct code:","Assertion (A): The Narmada and Tapti form estuaries rather than deltas.","Reason (R): They flow eastwards across the Peninsula and enter the Bay of Bengal."],"te":["కింది ధృవీకరణ (A), కారణం (R) లను పరిగణించి సరైన కోడ్‌ను ఎంచుకోండి:","ధృవీకరణ (A): నర్మద, తపతి డెల్టాలు కాక ఈస్ట్యూరీలను ఏర్పరుస్తాయి.","కారణం (R): అవి ద్వీపకల్పం గుండా తూర్పుగా ప్రవహించి బంగాళాఖాతంలో కలుస్తాయి."],"o":[["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A), (R) రెండూ నిజం, (R) అనేది (A)కు సరైన వివరణ"],["Both (A) and (R) are true but (R) is not the correct explanation of (A)","(A), (R) రెండూ నిజం, కానీ (R) అనేది (A)కు సరైన వివరణ కాదు"],["(A) is true but (R) is false","(A) నిజం, కానీ (R) తప్పు"],["(A) is false but (R) is true","(A) తప్పు, కానీ (R) నిజం"]],"a":2,"xe":"(A) true; (R) false: they flow west into the Arabian Sea through rift valleys.","xt":"(A) నిజం; (R) తప్పు: అవి చీలిక లోయల గుండా పశ్చిమాన అరేబియా సముద్రంలో కలుస్తాయి."},{"n":34,"en":["Consider the following statements:","I. The Konkan coast lies between Daman and Goa.","II. The Malabar coast lies mainly in Kerala.","III. The Northern Circars lie between the Mahanadi and the Krishna deltas.","IV. The Kannad coast lies in Gujarat.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. కొంకణ తీరం డామన్, గోవా మధ్య ఉంది.","II. మలబార్ తీరం ప్రధానంగా కేరళలో ఉంది.","III. ఉత్తర సర్కారులు మహానది, కృష్ణా డెల్టాల మధ్య ఉన్నాయి.","IV. కన్నడ తీరం గుజరాత్‌లో ఉంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I, II and III","I, II మరియు III"],["I and II","I మరియు II"],["I and III","I మరియు III"],["II and III","II మరియు III"]],"a":0,"xe":"The Kannad (Karnataka) coast lies between Goa and Mangalore.","xt":"కన్నడ తీరం గోవా, మంగళూరు మధ్య (కర్ణాటకలో) ఉంది."},{"n":35,"en":["Arrange the physiographic units from north to south:"],"te":["భౌతిక విభాగాలను ఉత్తరం నుండి దక్షిణానికి అమర్చండి:"],"o":[["Himachal – Himadri – Shiwaliks – Northern Plains","హిమాచల్ – హిమాద్రి – శివాలిక్ – ఉత్తర మైదానాలు"],["Himadri – Shiwaliks – Himachal – Northern Plains","హిమాద్రి – శివాలిక్ – హిమాచల్ – ఉత్తర మైదానాలు"],["Himadri – Himachal – Northern Plains – Shiwaliks","హిమాద్రి – హిమాచల్ – ఉత్తర మైదానాలు – శివాలిక్"],["Himadri – Himachal – Shiwaliks – Northern Plains","హిమాద్రి – హిమాచల్ – శివాలిక్ – ఉత్తర మైదానాలు"]],"a":3,"xe":"Greater Himalaya (Himadri) → Lesser (Himachal) → Shiwaliks → plains.","xt":"బృహత్ హిమాలయాలు (హిమాద్రి) → లఘు (హిమాచల్) → శివాలిక్ → మైదానాలు."},{"n":36,"en":["Consider the following statements:","I. The south-west monsoon normally sets in over Kerala around 1 June.","II. Western disturbances bring winter rain to north-west India.","III. Tamil Nadu receives most of its rainfall from the south-west monsoon.","IV. Kalbaisakhi are pre-monsoon thunderstorms of Bengal.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. నైరుతి రుతుపవనాలు సాధారణంగా జూన్ 1 నాటికి కేరళను తాకుతాయి.","II. పశ్చిమ అలజడులు వాయవ్య భారతానికి శీతాకాల వర్షాన్ని తెస్తాయి.","III. తమిళనాడుకు అత్యధిక వర్షం నైరుతి రుతుపవనాల నుండి వస్తుంది.","IV. కాల్‌బైశాఖి బెంగాల్ రుతుపవన పూర్వ ఉరుములతో కూడిన వర్షాలు.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["II and IV","II మరియు IV"],["I and II","I మరియు II"],["I, II and IV","I, II మరియు IV"],["I and IV","I మరియు IV"]],"a":2,"xe":"Tamil Nadu gets most rain in Oct–Dec from the north-east (retreating) monsoon.","xt":"తమిళనాడుకు అక్టోబర్–డిసెంబర్‌లో ఈశాన్య (తిరోగమన) రుతుపవనాల నుండి ఎక్కువ వర్షం వస్తుంది."},{"n":37,"en":["Arrange the confluences (Prayags) in the order met going downstream on the Alaknanda–Bhagirathi system:"],"te":["అలకనంద–భాగీరథి వ్యవస్థలో దిగువకు వెళ్తే ఎదురయ్యే ప్రయాగల వరుస క్రమం:"],"o":[["Karnaprayag – Nandprayag – Rudraprayag – Devprayag","కర్ణప్రయాగ – నందప్రయాగ – రుద్రప్రయాగ – దేవప్రయాగ"],["Nandprayag – Karnaprayag – Rudraprayag – Devprayag","నందప్రయాగ – కర్ణప్రయాగ – రుద్రప్రయాగ – దేవప్రయాగ"],["Nandprayag – Rudraprayag – Karnaprayag – Devprayag","నందప్రయాగ – రుద్రప్రయాగ – కర్ణప్రయాగ – దేవప్రయాగ"],["Devprayag – Rudraprayag – Karnaprayag – Nandprayag","దేవప్రయాగ – రుద్రప్రయాగ – కర్ణప్రయాగ – నందప్రయాగ"]],"a":1,"xe":"Order: Vishnuprayag, Nandprayag, Karnaprayag, Rudraprayag, Devprayag.","xt":"క్రమం: విష్ణుప్రయాగ, నందప్రయాగ, కర్ణప్రయాగ, రుద్రప్రయాగ, దేవప్రయాగ."},{"n":38,"en":["Which one of the following rivers does NOT drain into the Bay of Bengal?"],"te":["కింది నదుల్లో బంగాళాఖాతంలో కలవనిది ఏది?"],"o":[["Narmada","నర్మద"],["Mahanadi","మహానది"],["Godavari","గోదావరి"],["Subarnarekha","సువర్ణరేఖ"]],"a":0,"xe":"The Narmada drains into the Arabian Sea (Gulf of Khambhat).","xt":"నర్మద అరేబియా సముద్రంలో (ఖంభాత్ సింధుశాఖ) కలుస్తుంది."},{"n":39,"en":["Consider the following statements:","I. Jim Corbett is the oldest national park of India.","II. Project Tiger was launched in 1973.","III. Keoladeo Ghana National Park is known for the Asiatic lion.","IV. Gir is the only natural habitat of the Asiatic lion.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. జిమ్ కార్బెట్ భారతదేశపు అతి పురాతన జాతీయ ఉద్యానవనం.","II. ప్రాజెక్ట్ టైగర్ 1973లో ప్రారంభమైంది.","III. కేవలాదేవ్ ఘనా జాతీయ ఉద్యానవనం ఆసియా సింహానికి ప్రసిద్ధి.","IV. ఆసియా సింహానికి గిర్ ఒక్కటే సహజ ఆవాసం.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["III and IV","III మరియు IV"],["I and III","I మరియు III"],["II and III","II మరియు III"],["Only III","III మాత్రమే"]],"a":3,"xe":"Keoladeo (Bharatpur) is a bird sanctuary and Ramsar site.","xt":"కేవలాదేవ్ (భరత్‌పూర్) పక్షి అభయారణ్యం, రామ్‌సర్ ప్రాంతం."},{"n":40,"en":["Match the waterfalls with their rivers:","List-I (Waterfall)","A. Jog Falls","B. Shivasamudram","C. Dhuandhar","D. Chitrakoot","List-II (River)","I. Kaveri","II. Narmada","III. Indravati","IV. Sharavati","Choose the correct answer using the codes given below:"],"te":["జలపాతాలను వాటి నదులతో జతపరచండి:","జాబితా-I (జలపాతం)","A. జోగ్ జలపాతం","B. శివసముద్రం","C. ధువాంధార్","D. చిత్రకూట్","జాబితా-II (నది)","I. కావేరి","II. నర్మద","III. ఇంద్రావతి","IV. శరావతి","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–IV, B–III, C–II, D–I","A–IV, B–III, C–II, D–I"],["A–III, B–I, C–II, D–IV","A–III, B–I, C–II, D–IV"],["A–IV, B–I, C–II, D–III","A–IV, B–I, C–II, D–III"],["A–IV, B–II, C–I, D–III","A–IV, B–II, C–I, D–III"]],"a":2,"xe":"Jog–Sharavati; Shivasamudram–Kaveri; Dhuandhar–Narmada; Chitrakoot–Indravati.","xt":"జోగ్–శరావతి; శివసముద్రం–కావేరి; ధువాంధార్–నర్మద; చిత్రకూట్–ఇంద్రావతి."},{"n":41,"en":["Consider the following statements:","I. The Chotanagpur plateau is rich in minerals and is called the 'Ruhr of India'.","II. The Malwa plateau lies between the Aravalli and the Vindhyan ranges.","III. The Meghalaya plateau is a detached part of the Peninsular block.","IV. The Aravalli is the youngest fold mountain range of India.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. ఛోటానాగ్‌పూర్ పీఠభూమి ఖనిజ సంపన్నం; దీన్ని 'భారత రుహర్' అంటారు.","II. మాళ్వా పీఠభూమి ఆరావళి, వింధ్య శ్రేణుల మధ్య ఉంది.","III. మేఘాలయ పీఠభూమి ద్వీపకల్ప భూభాగం నుండి విడిపోయిన భాగం.","IV. ఆరావళి భారతదేశపు అత్యంత యువ ముడత పర్వత శ్రేణి.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["II and IV","II మరియు IV"],["Only IV","IV మాత్రమే"],["III and IV","III మరియు IV"],["I and IV","I మరియు IV"]],"a":1,"xe":"The Aravalli is among the oldest fold mountains; the Himalayas are the youngest.","xt":"ఆరావళి అతి పురాతన ముడత పర్వతాల్లో ఒకటి; హిమాలయాలు అతి యువవి."},{"n":42,"en":["Consider the following statements:","I. Wular is the largest freshwater lake in India.","II. Chilika is the largest brackish-water lagoon in India.","III. Pulicat lagoon lies on the Andhra Pradesh–Tamil Nadu border.","IV. Sambhar is a freshwater lake in Rajasthan.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. వూలర్ భారతదేశపు అతిపెద్ద మంచినీటి సరస్సు.","II. చిలికా భారతదేశపు అతిపెద్ద ఉప్పు–మంచి నీటి మడుగు.","III. పులికాట్ మడుగు ఆంధ్రప్రదేశ్–తమిళనాడు సరిహద్దులో ఉంది.","IV. సాంభార్ రాజస్థాన్‌లోని మంచినీటి సరస్సు.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I, II and III","I, II మరియు III"],["II and III","II మరియు III"],["I and II","I మరియు II"],["I and III","I మరియు III"]],"a":0,"xe":"Sambhar is India's largest inland saline lake.","xt":"సాంభార్ భారతదేశపు అతిపెద్ద లవణ అంతర్గత సరస్సు."},{"n":43,"en":["Consider the following statements:","I. The Western Ghats were inscribed as a UNESCO World Heritage site in 2012.","II. The Sundarbans National Park is a UNESCO World Heritage site.","III. Chilika Lake is a UNESCO World Heritage site.","IV. The Great Himalayan National Park is a UNESCO World Heritage site.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. పశ్చిమ కనుమలు 2012లో యునెస్కో ప్రపంచ వారసత్వ ప్రదేశంగా గుర్తించబడ్డాయి.","II. సుందర్‌బన్స్ జాతీయ ఉద్యానవనం యునెస్కో ప్రపంచ వారసత్వ ప్రదేశం.","III. చిలికా సరస్సు యునెస్కో ప్రపంచ వారసత్వ ప్రదేశం.","IV. గ్రేట్ హిమాలయన్ నేషనల్ పార్క్ యునెస్కో ప్రపంచ వారసత్వ ప్రదేశం.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and II","I మరియు II"],["I and IV","I మరియు IV"],["II and IV","II మరియు IV"],["I, II and IV","I, II మరియు IV"]],"a":3,"xe":"Chilika is a Ramsar site, not a World Heritage site.","xt":"చిలికా రామ్‌సర్ ప్రదేశం; ప్రపంచ వారసత్వ ప్రదేశం కాదు."},{"n":44,"en":["Consider the following statements:","I. The Terai is a marshy belt lying south of the Bhabar.","II. In the Bhabar, streams sink into porous pebbly deposits.","III. Khadar is the older alluvium of the Northern Plains.","IV. Duars are floodplain areas of north Bengal and Assam.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. టెరాయ్ భాబర్‌కు దక్షిణాన ఉన్న చిత్తడి పట్టీ.","II. భాబర్‌లో వాగులు రంధ్రాలు గల గులకరాళ్ల నిక్షేపాల్లో ఇంకిపోతాయి.","III. ఖాదర్ ఉత్తర మైదానాల పాత ఒండ్రు నేల.","IV. డువార్లు ఉత్తర బెంగాల్, అస్సాంలోని వరద మైదాన ప్రాంతాలు.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["II and III","II మరియు III"],["III and IV","III మరియు IV"],["Only III","III మాత్రమే"],["I and III","I మరియు III"]],"a":2,"xe":"Bhangar is older alluvium; Khadar is newer.","xt":"భాంగర్ పాతది; ఖాదర్ కొత్తది."},{"n":45,"en":["Consider the following statements:","I. The Nilgiri was the first biosphere reserve of India (1986).","II. The Nanda Devi Biosphere Reserve is in Himachal Pradesh.","III. The Gulf of Mannar Biosphere Reserve is in Kerala.","IV. Pachmarhi Biosphere Reserve is in Madhya Pradesh.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. నీలగిరి భారతదేశపు మొదటి జీవావరణ రిజర్వ్ (1986).","II. నందాదేవి జీవావరణ రిజర్వ్ హిమాచల్‌ప్రదేశ్‌లో ఉంది.","III. గల్ఫ్ ఆఫ్ మన్నార్ జీవావరణ రిజర్వ్ కేరళలో ఉంది.","IV. పచ్‌మడి జీవావరణ రిజర్వ్ మధ్యప్రదేశ్‌లో ఉంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["Only I","I మాత్రమే"],["I and IV","I మరియు IV"],["I, II and IV","I, II మరియు IV"],["I, III and IV","I, III మరియు IV"]],"a":1,"xe":"Nanda Devi is in Uttarakhand; Gulf of Mannar is in Tamil Nadu.","xt":"నందాదేవి ఉత్తరాఖండ్‌లో; గల్ఫ్ ఆఫ్ మన్నార్ తమిళనాడులో."},{"n":46,"en":["Consider the following statements:","I. The Brahmaputra is called the Yarlung Tsangpo in Tibet.","II. It is known as the Siang or Dihang in Arunachal Pradesh.","III. Majuli, the largest river island, lies in the Brahmaputra.","IV. The Brahmaputra flows through Sikkim.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. బ్రహ్మపుత్ర టిబెట్‌లో యార్లుంగ్ త్సాంగ్పో అనబడుతుంది.","II. ఇది అరుణాచల్‌ప్రదేశ్‌లో సియాంగ్/దిహాంగ్ అనబడుతుంది.","III. అతిపెద్ద నదీ ద్వీపం మజూలి బ్రహ్మపుత్రలో ఉంది.","IV. బ్రహ్మపుత్ర సిక్కిం గుండా ప్రవహిస్తుంది.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["Only IV","IV మాత్రమే"],["I and IV","I మరియు IV"],["II and IV","II మరియు IV"],["III and IV","III మరియు IV"]],"a":0,"xe":"It enters India through Arunachal Pradesh and flows through Assam.","xt":"ఇది అరుణాచల్ ద్వారా భారత్‌లోకి ప్రవేశించి అస్సాం గుండా ప్రవహిస్తుంది."},{"n":47,"en":["Consider the following Assertion (A) and Reason (R) and choose the correct code:","Assertion (A): The retreating monsoon brings heavy rain to north-west India in October–November.","Reason (R): The Tamil Nadu coast receives most of its rain in October–December."],"te":["కింది ధృవీకరణ (A), కారణం (R) లను పరిగణించి సరైన కోడ్‌ను ఎంచుకోండి:","ధృవీకరణ (A): తిరోగమన రుతుపవనాలు అక్టోబర్–నవంబర్‌లో వాయవ్య భారతానికి భారీ వర్షం తెస్తాయి.","కారణం (R): తమిళనాడు తీరం అక్టోబర్–డిసెంబర్‌లో ఎక్కువ వర్షం పొందుతుంది."],"o":[["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A), (R) రెండూ నిజం, (R) అనేది (A)కు సరైన వివరణ"],["Both (A) and (R) are true but (R) is not the correct explanation of (A)","(A), (R) రెండూ నిజం, కానీ (R) అనేది (A)కు సరైన వివరణ కాదు"],["(A) is true but (R) is false","(A) నిజం, కానీ (R) తప్పు"],["(A) is false but (R) is true","(A) తప్పు, కానీ (R) నిజం"]],"a":3,"xe":"(A) false: the monsoon withdraws and north-west India turns dry; (R) true.","xt":"(A) తప్పు: రుతుపవనాలు వెళ్లిపోయి వాయవ్య భారతం పొడిగా మారుతుంది; (R) నిజం."},{"n":48,"en":["Consider the following statements:","I. Indira Point lies in the Great Nicobar Island.","II. The Ten Degree Channel separates the Andaman Islands from the Nicobar Islands.","III. The Nine Degree Channel separates Minicoy from the main Lakshadweep group.","IV. Barren Island, India's only active volcano, lies in Lakshadweep.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. ఇందిరా పాయింట్ గ్రేట్ నికోబార్ దీవిలో ఉంది.","II. టెన్ డిగ్రీ ఛానల్ అండమాన్ దీవులను నికోబార్ దీవుల నుండి వేరుచేస్తుంది.","III. నైన్ డిగ్రీ ఛానల్ మినికాయ్‌ను లక్షద్వీప్ ప్రధాన సమూహం నుండి వేరుచేస్తుంది.","IV. భారత్‌లోని ఏకైక క్రియాశీల అగ్నిపర్వతం బారెన్ దీవి లక్షద్వీప్‌లో ఉంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["II and III","II మరియు III"],["I and II","I మరియు II"],["I, II and III","I, II మరియు III"],["I and III","I మరియు III"]],"a":2,"xe":"Barren Island is in the Andaman Sea (Andaman and Nicobar Islands).","xt":"బారెన్ దీవి అండమాన్ సముద్రంలో (అండమాన్ నికోబార్) ఉంది."},{"n":49,"en":["Consider the following statements:","I. The Western Ghats are continuous and can be crossed only through passes.","II. The Eastern Ghats are continuous and are not cut by any major river.","III. Anai Mudi (2,695 m) is the highest peak of peninsular India.","IV. The Palghat Gap lies between the Nilgiri and Anaimalai hills.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. పశ్చిమ కనుమలు నిరంతరంగా ఉంటాయి; కనుమల గుండానే దాటగలం.","II. తూర్పు కనుమలు నిరంతరం; ప్రధాన నదులేవీ వాటిని కోయవు.","III. ఆనైముడి (2,695 మీ.) ద్వీపకల్ప భారతంలోనే ఎత్తైన శిఖరం.","IV. పాలఘాట్ కనుమ నీలగిరి, ఆనైమలై కొండల మధ్య ఉంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and III","I మరియు III"],["I, III and IV","I, III మరియు IV"],["I and IV","I మరియు IV"],["III and IV","III మరియు IV"]],"a":1,"xe":"The Eastern Ghats are discontinuous, cut by the Godavari, Mahanadi, Krishna and Kaveri.","xt":"తూర్పు కనుమలు విచ్ఛిన్నం; గోదావరి, మహానది, కృష్ణా, కావేరి వాటిని కోస్తాయి."},{"n":50,"en":["Arrange the following peaks in descending order of height:"],"te":["ఈ శిఖరాలను ఎత్తు తగ్గే క్రమంలో అమర్చండి:"],"o":[["Kanchenjunga – Nanda Devi – Kamet – Anai Mudi","కాంచనగంగ – నందాదేవి – కామెట్ – ఆనైముడి"],["Kanchenjunga – Kamet – Nanda Devi – Anai Mudi","కాంచనగంగ – కామెట్ – నందాదేవి – ఆనైముడి"],["Nanda Devi – Kanchenjunga – Kamet – Anai Mudi","నందాదేవి – కాంచనగంగ – కామెట్ – ఆనైముడి"],["Kanchenjunga – Nanda Devi – Anai Mudi – Kamet","కాంచనగంగ – నందాదేవి – ఆనైముడి – కామెట్"]],"a":0,"xe":"Kanchenjunga 8,586 m > Nanda Devi 7,816 m > Kamet 7,756 m > Anai Mudi 2,695 m.","xt":"కాంచనగంగ 8,586 మీ. > నందాదేవి 7,816 > కామెట్ 7,756 > ఆనైముడి 2,695."}]},"3":{"q":[{"n":1,"en":["Match the minerals with their areas:","List-I (Mineral)","A. Barytes","B. Bauxite","C. Mica","D. Diamond","List-II (Area)","I. Anantapur (Wajrakarur)","II. Kadapa (Mangampeta)","III. Nellore","IV. Visakhapatnam hills","Choose the correct answer using the codes given below:"],"te":["ఖనిజాలను వాటి ప్రాంతాలతో జతపరచండి:","జాబితా-I (ఖనిజం)","A. బరైటీస్","B. బాక్సైట్","C. మైకా","D. వజ్రం","జాబితా-II (ప్రాంతం)","I. అనంతపురం (వజ్రకరూర్)","II. కడప (మంగంపేట)","III. నెల్లూరు","IV. విశాఖపట్నం కొండలు","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–IV, B–II, C–III, D–I","A–IV, B–II, C–III, D–I"],["A–II, B–IV, C–III, D–I","A–II, B–IV, C–III, D–I"],["A–II, B–IV, C–I, D–III","A–II, B–IV, C–I, D–III"],["A–III, B–IV, C–II, D–I","A–III, B–IV, C–II, D–I"]],"a":1,"xe":"Barytes–Kadapa; Bauxite–Visakhapatnam; Mica–Nellore; Diamond–Anantapur.","xt":"బరైటీస్–కడప; బాక్సైట్–విశాఖపట్నం; మైకా–నెల్లూరు; వజ్రం–అనంతపురం."},{"n":2,"en":["Consider the following Assertion (A) and Reason (R) and choose the correct code:","Assertion (A): Visakhapatnam has a natural harbour.","Reason (R): Visakhapatnam port is located on the western coast of India."],"te":["కింది ధృవీకరణ (A), కారణం (R) లను పరిగణించి సరైన కోడ్‌ను ఎంచుకోండి:","ధృవీకరణ (A): విశాఖపట్నానికి సహజ నౌకాశ్రయం ఉంది.","కారణం (R): విశాఖపట్నం ఓడరేవు భారతదేశ పశ్చిమ తీరంలో ఉంది."],"o":[["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A), (R) రెండూ నిజం, (R) అనేది (A)కు సరైన వివరణ"],["Both (A) and (R) are true but (R) is not the correct explanation of (A)","(A), (R) రెండూ నిజం, కానీ (R) అనేది (A)కు సరైన వివరణ కాదు"],["(A) is true but (R) is false","(A) నిజం, కానీ (R) తప్పు"],["(A) is false but (R) is true","(A) తప్పు, కానీ (R) నిజం"]],"a":2,"xe":"(A) true: a harbour sheltered by headlands (Dolphin's Nose); (R) false: east coast.","xt":"(A) నిజం: అంతరాయ గిరి శిఖరాల (డాల్ఫిన్స్ నోస్) రక్షణ ఉన్న నౌకాశ్రయం; (R) తప్పు: తూర్పు తీరం."},{"n":3,"en":["Arrange these ports from north to south:"],"te":["ఈ ఓడరేవులను ఉత్తరం నుండి దక్షిణానికి అమర్చండి:"],"o":[["Kakinada – Visakhapatnam – Machilipatnam – Krishnapatnam","కాకినాడ – విశాఖపట్నం – మచిలీపట్నం – కృష్ణపట్నం"],["Visakhapatnam – Machilipatnam – Kakinada – Krishnapatnam","విశాఖపట్నం – మచిలీపట్నం – కాకినాడ – కృష్ణపట్నం"],["Visakhapatnam – Kakinada – Krishnapatnam – Machilipatnam","విశాఖపట్నం – కాకినాడ – కృష్ణపట్నం – మచిలీపట్నం"],["Visakhapatnam – Kakinada – Machilipatnam – Krishnapatnam","విశాఖపట్నం – కాకినాడ – మచిలీపట్నం – కృష్ణపట్నం"]],"a":3,"xe":"North to south: Visakhapatnam, Kakinada, Machilipatnam, Krishnapatnam.","xt":"ఉత్తరం నుండి దక్షిణం: విశాఖపట్నం, కాకినాడ, మచిలీపట్నం, కృష్ణపట్నం."},{"n":4,"en":["Consider the following statements:","I. Visakhapatnam is a major port of India.","II. Krishnapatnam is a non-major deep-water port in Nellore district.","III. Kakinada has a deep-water port.","IV. Gangavaram is a major port under the Union Government.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. విశాఖపట్నం భారతదేశ ప్రధాన ఓడరేవుల్లో ఒకటి.","II. కృష్ణపట్నం నెల్లూరు జిల్లాలోని నాన్-మేజర్ లోతైన జలాల ఓడరేవు.","III. కాకినాడలో లోతైన జలాల ఓడరేవు ఉంది.","IV. గంగవరం కేంద్ర ప్రభుత్వ పరిధిలోని మేజర్ పోర్ట్.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and II","I మరియు II"],["I and III","I మరియు III"],["I, II and III","I, II మరియు III"],["II and III","II మరియు III"]],"a":2,"xe":"Gangavaram is a private non-major port.","xt":"గంగవరం ప్రైవేటు నాన్-మేజర్ పోర్ట్."},{"n":5,"en":["Match the ports with their features:","List-I (Port)","A. Visakhapatnam","B. Krishnapatnam","C. Kakinada","D. Machilipatnam","List-II (Feature)","I. Old Masulipatnam, Krishna district","II. Deep-water port in Nellore district","III. Port in East Godavari region","IV. The major port of Andhra Pradesh","Choose the correct answer using the codes given below:"],"te":["ఓడరేవులను వాటి లక్షణాలతో జతపరచండి:","జాబితా-I (ఓడరేవు)","A. విశాఖపట్నం","B. కృష్ణపట్నం","C. కాకినాడ","D. మచిలీపట్నం","జాబితా-II (లక్షణం)","I. పాత మసులీపట్నం, కృష్ణా జిల్లా","II. నెల్లూరు జిల్లాలోని లోతైన జలాల ఓడరేవు","III. తూర్పు గోదావరి ప్రాంతంలోని ఓడరేవు","IV. ఆంధ్రప్రదేశ్ ప్రధాన (మేజర్) ఓడరేవు","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–I, B–II, C–III, D–IV","A–I, B–II, C–III, D–IV"],["A–IV, B–II, C–III, D–I","A–IV, B–II, C–III, D–I"],["A–IV, B–III, C–II, D–I","A–IV, B–III, C–II, D–I"],["A–II, B–IV, C–III, D–I","A–II, B–IV, C–III, D–I"]],"a":1,"xe":"Visakhapatnam–major port; Krishnapatnam–Nellore; Kakinada–East Godavari; Machilipatnam–old Masulipatnam.","xt":"విశాఖపట్నం–మేజర్ పోర్ట్; కృష్ణపట్నం–నెల్లూరు; కాకినాడ–తూర్పు గోదావరి; మచిలీపట్నం–పాత మసులీపట్నం."},{"n":6,"en":["Consider the following statements:","I. North coastal Andhra gets most of its rainfall from the south-west monsoon.","II. South coastal Andhra gets substantial rainfall from the north-east monsoon.","III. Rayalaseema lies in the rain shadow of the Western Ghats.","IV. Anantapur is the wettest district of Rayalaseema.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. ఉత్తర కోస్తాంధ్రకు ఎక్కువ వర్షం నైరుతి రుతుపవనాల నుండి వస్తుంది.","II. దక్షిణ కోస్తాంధ్రకు ఈశాన్య రుతుపవనాల నుండి గణనీయమైన వర్షం వస్తుంది.","III. రాయలసీమ పశ్చిమ కనుమల వర్షచ్ఛాయ ప్రాంతంలో ఉంది.","IV. రాయలసీమలో అత్యంత తడి జిల్లా అనంతపురం.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["Only IV","IV మాత్రమే"],["III and IV","III మరియు IV"],["I and IV","I మరియు IV"],["II and IV","II మరియు IV"]],"a":0,"xe":"Anantapur is among the driest districts of India.","xt":"అనంతపురం భారతదేశంలోని అత్యంత పొడి జిల్లాల్లో ఒకటి."},{"n":7,"en":["Consider the following statements:","I. NH-16 runs along the Andhra coast linking Chennai and Kolkata.","II. NH-44 passes through Kurnool and Anantapur districts.","III. The South Coast Railway zone has its headquarters at Visakhapatnam.","IV. Vijayawada is the headquarters of the South Coast Railway zone.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. NH-16 ఆంధ్ర తీరం వెంట చెన్నై, కోల్‌కతాను కలుపుతుంది.","II. NH-44 కర్నూలు, అనంతపురం జిల్లాల గుండా వెళ్తుంది.","III. సౌత్ కోస్ట్ రైల్వే జోన్ ప్రధాన కార్యాలయం విశాఖపట్నంలో ఉంది.","IV. సౌత్ కోస్ట్ రైల్వే జోన్ ప్రధాన కార్యాలయం విజయవాడలో ఉంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and II","I మరియు II"],["I and III","I మరియు III"],["II and III","II మరియు III"],["I, II and III","I, II మరియు III"]],"a":3,"xe":"The zone HQ is Visakhapatnam; Vijayawada is a division HQ.","xt":"జోన్ ప్రధాన కార్యాలయం విశాఖపట్నం; విజయవాడ డివిజన్ కేంద్రం."},{"n":8,"en":["Consider the following statements:","I. The Cuddapah basin is a Proterozoic sedimentary basin.","II. Gondwana rocks occur in the Godavari valley.","III. Dharwar rocks occur in parts of Anantapur and Chittoor.","IV. The Eastern Ghats in Andhra are mostly of recent volcanic origin.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. కడప బేసిన్ ప్రొటెరోజోయిక్ అవక్షేప బేసిన్.","II. గోండ్వానా శిలలు గోదావరి లోయలో ఉన్నాయి.","III. ధార్వాడ్ శిలలు అనంతపురం, చిత్తూరు ప్రాంతాల్లో ఉన్నాయి.","IV. ఆంధ్రలోని తూర్పు కనుమలు ఎక్కువగా ఇటీవలి అగ్నిపర్వత మూలం.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and III","I మరియు III"],["II and III","II మరియు III"],["I, II and III","I, II మరియు III"],["I and II","I మరియు II"]],"a":2,"xe":"They are ancient Precambrian metamorphic rocks (charnockite, khondalite).","xt":"అవి పురాతన ప్రీకేంబ్రియన్ రూపాంతర శిలలు (చార్నకైట్, ఖొండలైట్)."},{"n":9,"en":["Consider the following statements:","I. The Pennar flows through Anantapur, Kadapa and Nellore districts.","II. The Vamsadhara flows through Srikakulam district.","III. The Nagavali flows through Vizianagaram and Srikakulam districts.","IV. The Pennar flows through Prakasam and Guntur districts.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. పెన్నా నది అనంతపురం, కడప, నెల్లూరు జిల్లాల గుండా ప్రవహిస్తుంది.","II. వంశధార శ్రీకాకుళం జిల్లా గుండా ప్రవహిస్తుంది.","III. నాగావళి విజయనగరం, శ్రీకాకుళం జిల్లాల గుండా ప్రవహిస్తుంది.","IV. పెన్నా నది ప్రకాశం, గుంటూరు జిల్లాల గుండా ప్రవహిస్తుంది.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["III and IV","III మరియు IV"],["Only IV","IV మాత్రమే"],["I and IV","I మరియు IV"],["II and IV","II మరియు IV"]],"a":1,"xe":"The Pennar does not flow through Guntur.","xt":"పెన్నా గుంటూరు గుండా ప్రవహించదు."},{"n":10,"en":["Consider the following statements:","I. The Telugu Ganga project carries Krishna water to Chennai.","II. The Handri–Neeva project lifts Godavari water to Rayalaseema.","III. The Galeru–Nagari project is a Rayalaseema irrigation scheme.","IV. The Polavaram right canal links the Godavari with the Krishna.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. తెలుగు గంగ ప్రాజెక్టు కృష్ణా నీటిని చెన్నైకి తరలిస్తుంది.","II. హంద్రీ–నీవా ప్రాజెక్టు గోదావరి నీటిని రాయలసీమకు ఎత్తిపోస్తుంది.","III. గాలేరు–నగరి రాయలసీమ సాగునీటి పథకం.","IV. పోలవరం కుడి కాలువ గోదావరిని కృష్ణాతో కలుపుతుంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I, III and IV","I, III మరియు IV"],["I and III","I మరియు III"],["I and IV","I మరియు IV"],["III and IV","III మరియు IV"]],"a":0,"xe":"Handri–Neeva lifts Krishna water from Srisailam backwaters.","xt":"హంద్రీ–నీవా శ్రీశైలం వెనుక జలాల నుండి కృష్ణా నీటిని ఎత్తిపోస్తుంది."},{"n":11,"en":["Consider the following statements:","I. The Vijayawada Thermal Power Station is in Nellore district.","II. The Krishnapatnam thermal power station is in Nellore district.","III. The Kurnool Ultra Mega Solar Park is near Orvakal–Panyam.","IV. The Kadapa Ultra Mega Solar Park is in Mylavaram.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. విజయవాడ ఉష్ణ విద్యుత్ కేంద్రం నెల్లూరు జిల్లాలో ఉంది.","II. కృష్ణపట్నం ఉష్ణ విద్యుత్ కేంద్రం నెల్లూరు జిల్లాలో ఉంది.","III. కర్నూలు అల్ట్రా మెగా సోలార్ పార్క్ ఓర్వకల్లు–పాణ్యం వద్ద ఉంది.","IV. కడప అల్ట్రా మెగా సోలార్ పార్క్ మైలవరంలో ఉంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["II and IV","II మరియు IV"],["III and IV","III మరియు IV"],["II and III","II మరియు III"],["II, III and IV","II, III మరియు IV"]],"a":3,"xe":"Vijayawada TPS is at Ibrahimpatnam near Vijayawada (NTR district).","xt":"విజయవాడ TPS విజయవాడ సమీప ఇబ్రహీంపట్నంలో (NTR జిల్లా) ఉంది."},{"n":12,"en":["Consider the following Assertion (A) and Reason (R) and choose the correct code:","Assertion (A): The red soils of Andhra Pradesh are very rich in nitrogen and humus.","Reason (R): Red soils derive their colour from iron oxide."],"te":["కింది ధృవీకరణ (A), కారణం (R) లను పరిగణించి సరైన కోడ్‌ను ఎంచుకోండి:","ధృవీకరణ (A): ఆంధ్రప్రదేశ్ ఎర్ర నేలలు నత్రజని, హ్యూమస్‌తో అత్యంత సమృద్ధిగా ఉంటాయి.","కారణం (R): ఎర్ర నేలలకు రంగు ఐరన్ ఆక్సైడ్ వల్ల వస్తుంది."],"o":[["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A), (R) రెండూ నిజం, (R) అనేది (A)కు సరైన వివరణ"],["Both (A) and (R) are true but (R) is not the correct explanation of (A)","(A), (R) రెండూ నిజం, కానీ (R) అనేది (A)కు సరైన వివరణ కాదు"],["(A) is true but (R) is false","(A) నిజం, కానీ (R) తప్పు"],["(A) is false but (R) is true","(A) తప్పు, కానీ (R) నిజం"]],"a":3,"xe":"(A) false: red soils are poor in N, P and humus; (R) true.","xt":"(A) తప్పు: ఎర్ర నేలల్లో నత్రజని, భాస్వరం, హ్యూమస్ తక్కువ; (R) నిజం."},{"n":13,"en":["Consider the following Assertion (A) and Reason (R) and choose the correct code:","Assertion (A): Rayalaseema, especially Anantapur, receives low annual rainfall.","Reason (R): It lies in the rain shadow of the Western Ghats, far from the monsoon's main moisture sources."],"te":["కింది ధృవీకరణ (A), కారణం (R) లను పరిగణించి సరైన కోడ్‌ను ఎంచుకోండి:","ధృవీకరణ (A): రాయలసీమ, ముఖ్యంగా అనంతపురం, తక్కువ వార్షిక వర్షం పొందుతుంది.","కారణం (R): అది పశ్చిమ కనుమల వర్షచ్ఛాయలో, రుతుపవనాల ప్రధాన తేమ మూలాలకు దూరంగా ఉంది."],"o":[["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A), (R) రెండూ నిజం, (R) అనేది (A)కు సరైన వివరణ"],["Both (A) and (R) are true but (R) is not the correct explanation of (A)","(A), (R) రెండూ నిజం, కానీ (R) అనేది (A)కు సరైన వివరణ కాదు"],["(A) is true but (R) is false","(A) నిజం, కానీ (R) తప్పు"],["(A) is false but (R) is true","(A) తప్పు, కానీ (R) నిజం"]],"a":0,"xe":"R explains A.","xt":"R, Aను వివరిస్తుంది."},{"n":14,"en":["Consider the following statements:","I. Mangampeta in Kadapa has very large barytes deposits.","II. Nellore district is known for its mica belt.","III. Tummalapalle in Kadapa has significant uranium reserves.","IV. Black Galaxy granite comes mainly from Visakhapatnam.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. కడపలోని మంగంపేటలో భారీ బరైటీస్ నిక్షేపాలు ఉన్నాయి.","II. నెల్లూరు జిల్లా మైకా పట్టీకి ప్రసిద్ధి.","III. కడపలోని తుమ్మలపల్లెలో గణనీయమైన యురేనియం నిల్వలు ఉన్నాయి.","IV. బ్లాక్ గెలాక్సీ గ్రానైట్ ప్రధానంగా విశాఖపట్నం నుండి వస్తుంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I, II and III","I, II మరియు III"],["I and III","I మరియు III"],["II and III","II మరియు III"],["I and II","I మరియు II"]],"a":0,"xe":"Black Galaxy granite is quarried in Prakasam district.","xt":"బ్లాక్ గెలాక్సీ గ్రానైట్ ప్రకాశం జిల్లాలో తవ్వబడుతుంది."},{"n":15,"en":["Consider the following statements:","I. Chenchus live mainly in the Nallamala forests.","II. Savaras live mainly in Srikakulam and neighbouring hill areas.","III. Yanadis are found mainly in the Nellore region.","IV. Khonds live mainly in Rayalaseema.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. చెంచులు ప్రధానంగా నల్లమల అడవుల్లో నివసిస్తారు.","II. సవరలు ప్రధానంగా శ్రీకాకుళం, సమీప కొండ ప్రాంతాల్లో నివసిస్తారు.","III. యానాదులు ప్రధానంగా నెల్లూరు ప్రాంతంలో కనిపిస్తారు.","IV. ఖోండులు ప్రధానంగా రాయలసీమలో నివసిస్తారు.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["II and III","II మరియు III"],["I and II","I మరియు II"],["I and III","I మరియు III"],["I, II and III","I, II మరియు III"]],"a":3,"xe":"Khonds live in the northern Eastern Ghats (Visakhapatnam–Odisha border).","xt":"ఖోండులు ఉత్తర తూర్పు కనుమల్లో (విశాఖ–ఒడిశా సరిహద్దు) నివసిస్తారు."},{"n":16,"en":["Match the sanctuaries with their features:","List-I (Sanctuary)","A. Coringa","B. Rollapadu","C. Kolleru","D. Papikonda","List-II (Feature)","I. Great Indian Bustard","II. Mangroves of the Godavari estuary","III. Godavari gorge forests","IV. Freshwater lake, migratory birds","Choose the correct answer using the codes given below:"],"te":["అభయారణ్యాలను వాటి లక్షణాలతో జతపరచండి:","జాబితా-I (అభయారణ్యం)","A. కోరంగి","B. రోళ్లపాడు","C. కొల్లేరు","D. పాపికొండ","జాబితా-II (లక్షణం)","I. గ్రేట్ ఇండియన్ బస్టర్డ్","II. గోదావరి ముఖద్వార మడ అడవులు","III. గోదావరి లోయ అడవులు","IV. మంచినీటి సరస్సు, వలస పక్షులు","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–II, B–III, C–IV, D–I","A–II, B–III, C–IV, D–I"],["A–III, B–I, C–IV, D–II","A–III, B–I, C–IV, D–II"],["A–II, B–I, C–IV, D–III","A–II, B–I, C–IV, D–III"],["A–II, B–IV, C–I, D–III","A–II, B–IV, C–I, D–III"]],"a":2,"xe":"Coringa–mangroves; Rollapadu–bustard; Kolleru–freshwater lake birds; Papikonda–Godavari gorge.","xt":"కోరంగి–మడ అడవులు; రోళ్లపాడు–బస్టర్డ్; కొల్లేరు–మంచినీటి సరస్సు పక్షులు; పాపికొండ–గోదావరి లోయ."},{"n":17,"en":["Consider the following statements:","I. The Dowleswaram Barrage was built in the 1850s.","II. The Prakasam Barrage is at Vijayawada on the Krishna.","III. Nagarjuna Sagar is built on the Krishna.","IV. The Tungabhadra Dam is located in Andhra Pradesh.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. ధవళేశ్వరం బ్యారేజీ 1850లలో నిర్మించబడింది.","II. ప్రకాశం బ్యారేజీ కృష్ణా నదిపై విజయవాడ వద్ద ఉంది.","III. నాగార్జున సాగర్ కృష్ణా నదిపై నిర్మించబడింది.","IV. తుంగభద్ర ఆనకట్ట ఆంధ్రప్రదేశ్‌లో ఉంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and III","I మరియు III"],["I, II and III","I, II మరియు III"],["II and III","II మరియు III"],["I and II","I మరియు II"]],"a":1,"xe":"The Tungabhadra Dam is at Hosapete in Karnataka.","xt":"తుంగభద్ర ఆనకట్ట కర్ణాటకలోని హోసపేటలో ఉంది."},{"n":18,"en":["Consider the following statements:","I. Red soils cover the largest area in Andhra Pradesh.","II. Black cotton soils occur in parts of Kurnool, Guntur and Krishna.","III. Deltaic alluvial soils are found mainly in Rayalaseema.","IV. Saline and coastal sandy soils occur along the coast.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. ఆంధ్రప్రదేశ్‌లో అత్యధిక విస్తీర్ణంలో ఎర్ర నేలలు ఉన్నాయి.","II. నల్లరేగడి నేలలు కర్నూలు, గుంటూరు, కృష్ణా ప్రాంతాల్లో ఉన్నాయి.","III. డెల్టా ఒండ్రు నేలలు ప్రధానంగా రాయలసీమలో ఉన్నాయి.","IV. లవణ, తీర ఇసుక నేలలు తీరం వెంబడి ఉన్నాయి.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I, II and IV","I, II మరియు IV"],["II and IV","II మరియు IV"],["I and II","I మరియు II"],["I and IV","I మరియు IV"]],"a":0,"xe":"Deltaic alluvium is in the Godavari and Krishna deltas.","xt":"డెల్టా ఒండ్రు నేలలు గోదావరి, కృష్ణా డెల్టాల్లో ఉన్నాయి."},{"n":19,"en":["Consider the following Assertion (A) and Reason (R) and choose the correct code:","Assertion (A): The Srisailam reservoir stores Krishna water.","Reason (R): The Krishna cuts through the Nallamala hills at Srisailam."],"te":["కింది ధృవీకరణ (A), కారణం (R) లను పరిగణించి సరైన కోడ్‌ను ఎంచుకోండి:","ధృవీకరణ (A): శ్రీశైలం జలాశయం కృష్ణా నీటిని నిల్వ చేస్తుంది.","కారణం (R): కృష్ణా నది శ్రీశైలం వద్ద నల్లమల కొండలను చీల్చుకుంటూ ప్రవహిస్తుంది."],"o":[["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A), (R) రెండూ నిజం, (R) అనేది (A)కు సరైన వివరణ"],["Both (A) and (R) are true but (R) is not the correct explanation of (A)","(A), (R) రెండూ నిజం, కానీ (R) అనేది (A)కు సరైన వివరణ కాదు"],["(A) is true but (R) is false","(A) నిజం, కానీ (R) తప్పు"],["(A) is false but (R) is true","(A) తప్పు, కానీ (R) నిజం"]],"a":1,"xe":"Both true; the gorge is the dam site but does not by itself explain storage.","xt":"రెండూ నిజం; లోయ ఆనకట్ట స్థలం, కానీ నిల్వను మాత్రమే వివరించదు."},{"n":20,"en":["Consider the following statements:","I. Papikonda National Park lies along the Godavari gorge.","II. Rollapadu Wildlife Sanctuary in Kurnool protects the Great Indian Bustard.","III. Coringa Wildlife Sanctuary has mangroves in the Godavari estuary.","IV. Sri Venkateswara National Park is in Visakhapatnam.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. పాపికొండ జాతీయ ఉద్యానవనం గోదావరి లోయ వెంబడి ఉంది.","II. కర్నూలులోని రోళ్లపాడు అభయారణ్యం గ్రేట్ ఇండియన్ బస్టర్డ్‌ను రక్షిస్తుంది.","III. కోరంగి అభయారణ్యంలో గోదావరి ముఖద్వారంలో మడ అడవులు ఉన్నాయి.","IV. శ్రీ వెంకటేశ్వర జాతీయ ఉద్యానవనం విశాఖపట్నంలో ఉంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and III","I మరియు III"],["II and III","II మరియు III"],["I, II and III","I, II మరియు III"],["I and II","I మరియు II"]],"a":2,"xe":"It is in the Seshachalam hills near Tirupati.","xt":"ఇది తిరుపతి సమీప శేషాచలం కొండల్లో ఉంది."},{"n":21,"en":["Match the products with their areas:","List-I (Product)","A. Araku coffee","B. Banganapalli mango","C. Guntur Mirchi","D. Konaseema coconut","List-II (Area)","I. Chilli","II. Kurnool–Nandyal region","III. Hill tracts of Alluri Sitharama Raju district","IV. Godavari delta","Choose the correct answer using the codes given below:"],"te":["ఉత్పత్తులను వాటి ప్రాంతాలతో జతపరచండి:","జాబితా-I (ఉత్పత్తి)","A. అరకు కాఫీ","B. బంగినపల్లి మామిడి","C. గుంటూరు మిర్చి","D. కోనసీమ కొబ్బరి","జాబితా-II (ప్రాంతం)","I. మిరప","II. కర్నూలు–నంద్యాల ప్రాంతం","III. అల్లూరి సీతారామరాజు జిల్లా కొండ ప్రాంతాలు","IV. గోదావరి డెల్టా","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–I, B–II, C–III, D–IV","A–I, B–II, C–III, D–IV"],["A–III, B–II, C–I, D–IV","A–III, B–II, C–I, D–IV"],["A–III, B–IV, C–I, D–II","A–III, B–IV, C–I, D–II"],["A–IV, B–II, C–I, D–III","A–IV, B–II, C–I, D–III"]],"a":1,"xe":"Araku–ASR hills; Banganapalli–Nandyal; Guntur–chilli; Konaseema–Godavari delta.","xt":"అరకు–ASR కొండలు; బంగినపల్లి–నంద్యాల; గుంటూరు–మిరప; కోనసీమ–గోదావరి డెల్టా."},{"n":22,"en":["Consider the following statements:","I. Andhra Pradesh lies roughly between 12°41′N and 19°07′N latitudes.","II. Andhra Pradesh has the second-longest coastline among Indian states.","III. Andhra Pradesh shares a land boundary with Kerala.","IV. Sriharikota is a barrier island between Pulicat Lake and the Bay of Bengal.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. ఆంధ్రప్రదేశ్ సుమారు 12°41′N నుండి 19°07′N అక్షాంశాల మధ్య ఉంది.","II. భారత రాష్ట్రాల్లో ఆంధ్రప్రదేశ్‌కు రెండవ అత్యంత పొడవైన తీరం ఉంది.","III. ఆంధ్రప్రదేశ్ కేరళతో భూ సరిహద్దు పంచుకుంటుంది.","IV. శ్రీహరికోట పులికాట్ సరస్సు, బంగాళాఖాతం మధ్య ఉన్న అవరోధ దీవి.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I, II and IV","I, II మరియు IV"],["I and II","I మరియు II"],["I and IV","I మరియు IV"],["II and IV","II మరియు IV"]],"a":0,"xe":"AP borders Telangana, Karnataka, Tamil Nadu, Odisha and Chhattisgarh, not Kerala.","xt":"ఏపీ సరిహద్దులు: తెలంగాణ, కర్ణాటక, తమిళనాడు, ఒడిశా, ఛత్తీస్‌గఢ్; కేరళ కాదు."},{"n":23,"en":["Which one of the following is NOT located in Rayalaseema?"],"te":["కింది వాటిలో రాయలసీమలో లేనిది ఏది?"],"o":[["Gandikota","గండికోట"],["Belum Caves","బెలూం గుహలు"],["Horsley Hills","హార్స్లీ హిల్స్"],["Borra Caves","బొర్రా గుహలు"]],"a":3,"xe":"Borra Caves are near Araku in the Visakhapatnam/ASR hills.","xt":"బొర్రా గుహలు అరకు సమీపంలో (విశాఖ/ASR కొండల్లో) ఉన్నాయి."},{"n":24,"en":["Consider the following statements:","I. Guntur is a leading chilli-producing and trading centre.","II. Konaseema in the Godavari delta is known for coconut.","III. Andhra Pradesh is the leading oil-palm growing state of India.","IV. Araku coffee is grown in Rayalaseema.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. గుంటూరు ప్రముఖ మిరప ఉత్పత్తి, వ్యాపార కేంద్రం.","II. గోదావరి డెల్టాలోని కోనసీమ కొబ్బరికి ప్రసిద్ధి.","III. భారతదేశంలో ఆయిల్ పామ్ సాగులో ఆంధ్రప్రదేశ్ అగ్రగామి.","IV. అరకు కాఫీ రాయలసీమలో పండుతుంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["II and III","II మరియు III"],["I and II","I మరియు II"],["I, II and III","I, II మరియు III"],["I and III","I మరియు III"]],"a":2,"xe":"Araku coffee is grown in the Eastern Ghats of Visakhapatnam/ASR hills.","xt":"అరకు కాఫీ విశాఖపట్నం/అల్లూరి సీతారామరాజు ప్రాంత తూర్పు కనుమల్లో పండుతుంది."},{"n":25,"en":["Arrange these irrigation projects in order of completion (earliest first):"],"te":["ఈ సాగునీటి ప్రాజెక్టులను పూర్తయిన క్రమంలో (ముందుది మొదట) అమర్చండి:"],"o":[["Prakasam Barrage – Dowleswaram Barrage – Nagarjuna Sagar – Srisailam","ప్రకాశం బ్యారేజీ – ధవళేశ్వరం – నాగార్జున సాగర్ – శ్రీశైలం"],["Dowleswaram Barrage – Prakasam Barrage – Nagarjuna Sagar – Srisailam","ధవళేశ్వరం – ప్రకాశం బ్యారేజీ – నాగార్జున సాగర్ – శ్రీశైలం"],["Dowleswaram Barrage – Nagarjuna Sagar – Prakasam Barrage – Srisailam","ధవళేశ్వరం – నాగార్జున సాగర్ – ప్రకాశం బ్యారేజీ – శ్రీశైలం"],["Dowleswaram Barrage – Prakasam Barrage – Srisailam – Nagarjuna Sagar","ధవళేశ్వరం – ప్రకాశం బ్యారేజీ – శ్రీశైలం – నాగార్జున సాగర్"]],"a":1,"xe":"Approx.: Dowleswaram 1852, Prakasam Barrage 1957, Nagarjuna Sagar 1967, Srisailam 1981.","xt":"సుమారు: ధవళేశ్వరం 1852, ప్రకాశం బ్యారేజీ 1957, నాగార్జున సాగర్ 1967, శ్రీశైలం 1981."},{"n":26,"en":["Consider the following statements:","I. The Godavari divides at Dowleswaram into the Gautami and Vasishta branches.","II. The Pennar rises in the Nandi Hills of Karnataka.","III. The Vamsadhara and Nagavali originate in Odisha.","IV. The Tungabhadra joins the Krishna at Srisailam.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. గోదావరి ధవళేశ్వరం వద్ద గౌతమి, వశిష్ఠ పాయలుగా చీలుతుంది.","II. పెన్నా నది కర్ణాటకలోని నంది కొండల్లో పుడుతుంది.","III. వంశధార, నాగావళి ఒడిశాలో పుడతాయి.","IV. తుంగభద్ర శ్రీశైలం వద్ద కృష్ణాలో కలుస్తుంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I, II and III","I, II మరియు III"],["I and III","I మరియు III"],["II and III","II మరియు III"],["I and II","I మరియు II"]],"a":0,"xe":"The Tungabhadra joins the Krishna near Sangameswaram (Kurnool–Alampur), upstream of Srisailam.","xt":"తుంగభద్ర శ్రీశైలానికి ఎగువన సంగమేశ్వరం (కర్నూలు–ఆలంపూర్) వద్ద కృష్ణాలో కలుస్తుంది."},{"n":27,"en":["Consider the following statements:","I. Visakhapatnam Steel Plant is operated by RINL.","II. HPCL has a refinery at Visakhapatnam.","III. Hindustan Shipyard is located at Visakhapatnam.","IV. Sri City SEZ is located in Guntur district.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. విశాఖ ఉక్కు కర్మాగారాన్ని RINL నిర్వహిస్తుంది.","II. HPCLకు విశాఖపట్నంలో రిఫైనరీ ఉంది.","III. హిందుస్థాన్ షిప్‌యార్డ్ విశాఖపట్నంలో ఉంది.","IV. శ్రీ సిటీ SEZ గుంటూరు జిల్లాలో ఉంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["II and III","II మరియు III"],["I and II","I మరియు II"],["I and III","I మరియు III"],["I, II and III","I, II మరియు III"]],"a":3,"xe":"Sri City lies in the Tirupati district (Chittoor–Nellore border area).","xt":"శ్రీ సిటీ తిరుపతి జిల్లాలో (చిత్తూరు–నెల్లూరు సరిహద్దు) ఉంది."},{"n":28,"en":["Arrange these rivers from north to south in Andhra Pradesh:"],"te":["ఆంధ్రప్రదేశ్‌లోని ఈ నదులను ఉత్తరం నుండి దక్షిణానికి అమర్చండి:"],"o":[["Godavari – Vamsadhara – Krishna – Pennar","గోదావరి – వంశధార – కృష్ణా – పెన్నా"],["Vamsadhara – Krishna – Godavari – Pennar","వంశధార – కృష్ణా – గోదావరి – పెన్నా"],["Vamsadhara – Godavari – Krishna – Pennar","వంశధార – గోదావరి – కృష్ణా – పెన్నా"],["Vamsadhara – Godavari – Pennar – Krishna","వంశధార – గోదావరి – పెన్నా – కృష్ణా"]],"a":2,"xe":"Order of river mouths: Vamsadhara (Srikakulam), Godavari, Krishna, Pennar (Nellore).","xt":"ముఖద్వార క్రమం: వంశధార (శ్రీకాకుళం), గోదావరి, కృష్ణా, పెన్నా (నెల్లూరు)."},{"n":29,"en":["Consider the following statements:","I. Uttarandhra comprises the north coastal districts such as Srikakulam, Vizianagaram and Visakhapatnam.","II. Rayalaseema traditionally includes Kurnool, Anantapur, Kadapa and Chittoor.","III. The Godavari districts form part of Coastal Andhra.","IV. Prakasam district belongs to Uttarandhra.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. ఉత్తరాంధ్రలో శ్రీకాకుళం, విజయనగరం, విశాఖపట్నం వంటి ఉత్తర కోస్తా జిల్లాలు ఉన్నాయి.","II. రాయలసీమలో సంప్రదాయంగా కర్నూలు, అనంతపురం, కడప, చిత్తూరు ఉన్నాయి.","III. గోదావరి జిల్లాలు కోస్తాంధ్రలో భాగం.","IV. ప్రకాశం జిల్లా ఉత్తరాంధ్రకు చెందింది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and III","I మరియు III"],["I, II and III","I, II మరియు III"],["II and III","II మరియు III"],["I and II","I మరియు II"]],"a":1,"xe":"Prakasam is in south Coastal Andhra.","xt":"ప్రకాశం దక్షిణ కోస్తాంధ్రలో ఉంది."},{"n":30,"en":["Consider the following Assertion (A) and Reason (R) and choose the correct code:","Assertion (A): Kolleru is a saltwater lake.","Reason (R): Kolleru is a freshwater lake lying between the Godavari and Krishna deltas."],"te":["కింది ధృవీకరణ (A), కారణం (R) లను పరిగణించి సరైన కోడ్‌ను ఎంచుకోండి:","ధృవీకరణ (A): కొల్లేరు ఉప్పునీటి సరస్సు.","కారణం (R): కొల్లేరు గోదావరి, కృష్ణా డెల్టాల మధ్య ఉన్న మంచినీటి సరస్సు."],"o":[["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A), (R) రెండూ నిజం, (R) అనేది (A)కు సరైన వివరణ"],["Both (A) and (R) are true but (R) is not the correct explanation of (A)","(A), (R) రెండూ నిజం, కానీ (R) అనేది (A)కు సరైన వివరణ కాదు"],["(A) is true but (R) is false","(A) నిజం, కానీ (R) తప్పు"],["(A) is false but (R) is true","(A) తప్పు, కానీ (R) నిజం"]],"a":3,"xe":"(A) false; (R) true.","xt":"(A) తప్పు; (R) నిజం."},{"n":31,"en":["Consider the following statements:","I. Bauxite occurs in the Visakhapatnam hill region.","II. Asbestos occurs in Kadapa district.","III. Diamond-bearing kimberlite pipes occur at Wajrakarur in Anantapur.","IV. Andhra Pradesh has the largest coal reserves in India.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. బాక్సైట్ విశాఖపట్నం కొండ ప్రాంతంలో ఉంది.","II. ఆస్బెస్టాస్ కడప జిల్లాలో లభిస్తుంది.","III. అనంతపురంలోని వజ్రకరూర్ వద్ద వజ్రాలు గల కింబర్లైట్ గొట్టాలు ఉన్నాయి.","IV. భారతదేశంలో అతిపెద్ద బొగ్గు నిల్వలు ఆంధ్రప్రదేశ్‌లో ఉన్నాయి.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["I and IV","I మరియు IV"],["II and IV","II మరియు IV"],["III and IV","III మరియు IV"],["Only IV","IV మాత్రమే"]],"a":3,"xe":"AP has little coal; Odisha, Jharkhand and Chhattisgarh lead.","xt":"ఏపీలో బొగ్గు తక్కువ; ఒడిశా, జార్ఖండ్, ఛత్తీస్‌గఢ్ ముందున్నాయి."},{"n":32,"en":["Consider the following statements:","I. Belum Caves are limestone caves in Rayalaseema.","II. Borra Caves are near Araku Valley.","III. The Gosthani river flows through the Borra Caves area.","IV. Borra Caves are formed in granite rock.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. బెలూం గుహలు రాయలసీమలోని సున్నపురాయి గుహలు.","II. బొర్రా గుహలు అరకు లోయ సమీపంలో ఉన్నాయి.","III. బొర్రా గుహల ప్రాంతం గుండా గోస్తనీ నది ప్రవహిస్తుంది.","IV. బొర్రా గుహలు గ్రానైట్ శిలలో ఏర్పడ్డాయి.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["II and IV","II మరియు IV"],["III and IV","III మరియు IV"],["Only IV","IV మాత్రమే"],["I and IV","I మరియు IV"]],"a":2,"xe":"Borra Caves are karstic limestone caves with stalactites and stalagmites.","xt":"బొర్రా గుహలు స్టాలక్టైట్లు, స్టాలగ్మైట్లు గల కార్స్ట్ సున్నపురాయి గుహలు."},{"n":33,"en":["Consider the following statements:","I. Virginia tobacco is grown in Prakasam and Guntur regions.","II. Anantapur is a major groundnut-growing district.","III. Banganapalli mango is associated with the Kurnool–Nandyal region.","IV. Sugarcane is the main crop of dry Anantapur.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. వర్జీనియా పొగాకు ప్రకాశం, గుంటూరు ప్రాంతాల్లో పండుతుంది.","II. అనంతపురం ప్రధాన వేరుశనగ సాగు జిల్లా.","III. బంగినపల్లి మామిడి కర్నూలు–నంద్యాల ప్రాంతంతో ముడిపడి ఉంది.","IV. పొడి అనంతపురం ప్రధాన పంట చెరకు.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["III and IV","III మరియు IV"],["Only IV","IV మాత్రమే"],["I and IV","I మరియు IV"],["II and IV","II మరియు IV"]],"a":1,"xe":"Anantapur's main crop is groundnut; sugarcane is in the north coastal belt and other irrigated areas.","xt":"అనంతపురం ప్రధాన పంట వేరుశనగ; చెరకు ఉత్తర కోస్తా, నీటి వసతి ప్రాంతాల్లో."},{"n":34,"en":["Arrange these districts from north to south along the coast:"],"te":["ఈ జిల్లాలను తీరం వెంట ఉత్తరం నుండి దక్షిణానికి అమర్చండి:"],"o":[["Srikakulam – Visakhapatnam – Krishna – Prakasam","శ్రీకాకుళం – విశాఖపట్నం – కృష్ణా – ప్రకాశం"],["Visakhapatnam – Srikakulam – Krishna – Prakasam","విశాఖపట్నం – శ్రీకాకుళం – కృష్ణా – ప్రకాశం"],["Srikakulam – Visakhapatnam – Prakasam – Krishna","శ్రీకాకుళం – విశాఖపట్నం – ప్రకాశం – కృష్ణా"],["Srikakulam – Krishna – Visakhapatnam – Prakasam","శ్రీకాకుళం – కృష్ణా – విశాఖపట్నం – ప్రకాశం"]],"a":0,"xe":"North to south: Srikakulam, Visakhapatnam, Krishna, Prakasam.","xt":"ఉత్తరం నుండి దక్షిణం: శ్రీకాకుళం, విశాఖపట్నం, కృష్ణా, ప్రకాశం."},{"n":35,"en":["Consider the following statements:","I. Cyclone Hudhud (2014) made landfall at Visakhapatnam.","II. Cyclone Michaung (2023) crossed the coast near Bapatla.","III. Cyclone Phailin (2013) made landfall in Andhra Pradesh.","IV. The Andhra coast is most cyclone-prone in October–November.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. హుద్‌హుద్ తుపాను (2014) విశాఖపట్నం వద్ద తీరం దాటింది.","II. మిచౌంగ్ తుపాను (2023) బాపట్ల సమీపంలో తీరం దాటింది.","III. ఫైలిన్ తుపాను (2013) ఆంధ్రప్రదేశ్‌లో తీరం దాటింది.","IV. ఆంధ్ర తీరం అక్టోబర్–నవంబర్‌లో ఎక్కువ తుపాను ప్రమాదంలో ఉంటుంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and IV","I మరియు IV"],["II and IV","II మరియు IV"],["I and II","I మరియు II"],["I, II and IV","I, II మరియు IV"]],"a":3,"xe":"Phailin crossed near Gopalpur in Odisha.","xt":"ఫైలిన్ ఒడిశాలోని గోపాల్‌పూర్ వద్ద తీరం దాటింది."},{"n":36,"en":["Match the places with their attributes:","List-I (Place)","A. Belum Caves","B. Borra Caves","C. Gandikota","D. Talakona","List-II (Attribute)","I. Limestone caves in Kurnool region","II. Highest waterfall in Andhra Pradesh","III. Caves on the Gosthani river","IV. Gorge of the Pennar","Choose the correct answer using the codes given below:"],"te":["ప్రదేశాలను వాటి ప్రత్యేకతలతో జతపరచండి:","జాబితా-I (ప్రదేశం)","A. బెలూం గుహలు","B. బొర్రా గుహలు","C. గండికోట","D. తలకోన","జాబితా-II (ప్రత్యేకత)","I. కర్నూలు ప్రాంతంలోని సున్నపురాయి గుహలు","II. ఆంధ్రప్రదేశ్‌లో ఎత్తైన జలపాతం","III. గోస్తనీ నది వద్ద గుహలు","IV. పెన్నా నది లోయ","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–I, B–IV, C–III, D–II","A–I, B–IV, C–III, D–II"],["A–III, B–I, C–IV, D–II","A–III, B–I, C–IV, D–II"],["A–I, B–III, C–IV, D–II","A–I, B–III, C–IV, D–II"],["A–I, B–III, C–II, D–IV","A–I, B–III, C–II, D–IV"]],"a":2,"xe":"Belum–limestone caves; Borra–Gosthani; Gandikota–Pennar gorge; Talakona–highest waterfall.","xt":"బెలూం–సున్నపురాయి గుహలు; బొర్రా–గోస్తనీ; గండికోట–పెన్నా లోయ; తలకోన–ఎత్తైన జలపాతం."},{"n":37,"en":["Consider the following statements:","I. The Simhadri thermal power station is at Kakinada.","II. The Srisailam project has hydroelectric power stations.","III. The Ananthapuramu Ultra Mega Solar Park is in Anantapur district.","IV. The Rayalaseema Thermal Power Project is in Kadapa district.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. సింహాద్రి ఉష్ణ విద్యుత్ కేంద్రం కాకినాడలో ఉంది.","II. శ్రీశైలం ప్రాజెక్టులో జల విద్యుత్ కేంద్రాలు ఉన్నాయి.","III. అనంతపురం అల్ట్రా మెగా సోలార్ పార్క్ అనంతపురం జిల్లాలో ఉంది.","IV. రాయలసీమ ఉష్ణ విద్యుత్ ప్రాజెక్టు కడప జిల్లాలో ఉంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["II and III","II మరియు III"],["II, III and IV","II, III మరియు IV"],["II and IV","II మరియు IV"],["III and IV","III మరియు IV"]],"a":1,"xe":"Simhadri (NTPC) is near Visakhapatnam.","xt":"సింహాద్రి (NTPC) విశాఖపట్నం సమీపంలో ఉంది."},{"n":38,"en":["Match the tribes with their regions:","List-I (Tribe)","A. Chenchu","B. Savara","C. Yanadi","D. Konda Reddi","List-II (Region)","I. Godavari hill tracts","II. Nallamala forests","III. Srikakulam hills","IV. Nellore region","Choose the correct answer using the codes given below:"],"te":["గిరిజన తెగలను వారి ప్రాంతాలతో జతపరచండి:","జాబితా-I (తెగ)","A. చెంచు","B. సవర","C. యానాది","D. కొండరెడ్డి","జాబితా-II (ప్రాంతం)","I. గోదావరి కొండ ప్రాంతాలు","II. నల్లమల అడవులు","III. శ్రీకాకుళం కొండలు","IV. నెల్లూరు ప్రాంతం","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–II, B–III, C–IV, D–I","A–II, B–III, C–IV, D–I"],["A–II, B–III, C–I, D–IV","A–II, B–III, C–I, D–IV"],["A–IV, B–III, C–II, D–I","A–IV, B–III, C–II, D–I"],["A–II, B–I, C–IV, D–III","A–II, B–I, C–IV, D–III"]],"a":0,"xe":"Chenchu–Nallamala; Savara–Srikakulam; Yanadi–Nellore; Konda Reddi–Godavari hills.","xt":"చెంచు–నల్లమల; సవర–శ్రీకాకుళం; యానాది–నెల్లూరు; కొండరెడ్డి–గోదావరి కొండలు."},{"n":39,"en":["Consider the following statements:","I. Andhra Pradesh is the leading producer of farmed shrimp in India.","II. Aquaculture is concentrated in the Godavari–Krishna delta region.","III. Kakinada is an important fishing and port town.","IV. Andhra Pradesh has the shortest coastline among coastal states.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. భారతదేశంలో పెంపకం రొయ్యల ఉత్పత్తిలో ఆంధ్రప్రదేశ్ అగ్రస్థానంలో ఉంది.","II. ఆక్వాకల్చర్ గోదావరి–కృష్ణా డెల్టా ప్రాంతంలో కేంద్రీకృతమైంది.","III. కాకినాడ ముఖ్యమైన చేపల వేట, ఓడరేవు పట్టణం.","IV. తీర రాష్ట్రాల్లో ఆంధ్రప్రదేశ్ తీరం అతి తక్కువ పొడవు కలది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["II and III","II మరియు III"],["I and II","I మరియు II"],["I and III","I మరియు III"],["I, II and III","I, II మరియు III"]],"a":3,"xe":"AP's coast (~974 km) is the second longest.","xt":"ఏపీ తీరం (~974 కి.మీ.) రెండవ పొడవైనది."},{"n":40,"en":["Consider the following statements:","I. Andhra Pradesh has 28 districts after the December 2025 reorganisation.","II. Amaravati has been given statutory status as the capital of Andhra Pradesh.","III. Andhra State was formed on 1 October 1953 with Kurnool as its capital.","IV. Andhra Pradesh was bifurcated into Andhra Pradesh and Telangana in 2018.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. 2025 డిసెంబర్ పునర్వ్యవస్థీకరణ తర్వాత ఆంధ్రప్రదేశ్‌లో 28 జిల్లాలు ఉన్నాయి.","II. అమరావతికి ఆంధ్రప్రదేశ్ రాజధానిగా చట్టబద్ధ హోదా ఇవ్వబడింది.","III. ఆంధ్ర రాష్ట్రం 1953 అక్టోబర్ 1న కర్నూలు రాజధానిగా ఏర్పడింది.","IV. ఆంధ్రప్రదేశ్ 2018లో ఆంధ్రప్రదేశ్, తెలంగాణగా విభజించబడింది.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["I and IV","I మరియు IV"],["II and IV","II మరియు IV"],["Only IV","IV మాత్రమే"],["III and IV","III మరియు IV"]],"a":2,"xe":"The bifurcation took effect on 2 June 2014.","xt":"విభజన 2014 జూన్ 2న అమలులోకి వచ్చింది."},{"n":41,"en":["Consider the following statements:","I. The Seshachalam hills in Rayalaseema contain the Tirumala hills.","II. The Krishna cuts through the Nallamala hills at Srisailam.","III. Araku Valley lies in the Eastern Ghats region of Visakhapatnam.","IV. Horsley Hills lie in Prakasam district.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. రాయలసీమలోని శేషాచలం కొండల్లో తిరుమల కొండలు ఉన్నాయి.","II. కృష్ణా నది శ్రీశైలం వద్ద నల్లమల కొండలను చీల్చి ప్రవహిస్తుంది.","III. అరకు లోయ విశాఖపట్నం ప్రాంత తూర్పు కనుమల్లో ఉంది.","IV. హార్స్లీ హిల్స్ ప్రకాశం జిల్లాలో ఉన్నాయి.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and III","I మరియు III"],["I, II and III","I, II మరియు III"],["II and III","II మరియు III"],["I and II","I మరియు II"]],"a":1,"xe":"Horsley Hills are in the Annamayya (earlier Chittoor) district.","xt":"హార్స్లీ హిల్స్ అన్నమయ్య (గతంలో చిత్తూరు) జిల్లాలో ఉన్నాయి."},{"n":42,"en":["Consider the following statements:","I. Kolleru Lake lies between the Godavari and Krishna deltas.","II. Kolleru is a saline lake.","III. Pulicat is a brackish-water lagoon shared with Tamil Nadu.","IV. Kolleru is a Ramsar wetland.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. కొల్లేరు సరస్సు గోదావరి, కృష్ణా డెల్టాల మధ్య ఉంది.","II. కొల్లేరు ఒక లవణ సరస్సు.","III. పులికాట్ తమిళనాడుతో పంచుకునే ఉప్పు–మంచి నీటి మడుగు.","IV. కొల్లేరు ఒక రామ్‌సర్ చిత్తడి నేల.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["Only II","II మాత్రమే"],["II and IV","II మరియు IV"],["I and II","I మరియు II"],["II and III","II మరియు III"]],"a":0,"xe":"Kolleru is a large freshwater lake and an important bird habitat.","xt":"కొల్లేరు పెద్ద మంచినీటి సరస్సు, ముఖ్యమైన పక్షి ఆవాసం."},{"n":43,"en":["Consider the following statements:","I. The Seshachalam Biosphere Reserve was designated in 2010.","II. Red sanders (Pterocarpus santalinus) is endemic to a limited belt of the Eastern Ghats in south Andhra Pradesh.","III. Kambalakonda Wildlife Sanctuary is near Visakhapatnam.","IV. Red sanders occurs naturally in the Western Ghats.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. శేషాచలం జీవావరణ రిజర్వ్ 2010లో ప్రకటించబడింది.","II. ఎర్రచందనం (టెరోకార్పస్ శాంటాలినస్) దక్షిణ ఆంధ్ర తూర్పు కనుమల పరిమిత పట్టీకి స్థానికం.","III. కంబాలకొండ అభయారణ్యం విశాఖపట్నం సమీపంలో ఉంది.","IV. ఎర్రచందనం సహజంగా పశ్చిమ కనుమల్లో పెరుగుతుంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and II","I మరియు II"],["I and III","I మరియు III"],["II and III","II మరియు III"],["I, II and III","I, II మరియు III"]],"a":3,"xe":"Red sanders is native only to a small area of the Eastern Ghats.","xt":"ఎర్రచందనం తూర్పు కనుమల చిన్న ప్రాంతానికే పరిమితం."},{"n":44,"en":["Consider the following statements:","I. Visakhapatnam is the most populous city of Andhra Pradesh.","II. Vijayawada lies on the bank of the Krishna.","III. Tirupati lies in the Rayalaseema region.","IV. Amaravati lies on the bank of the Godavari.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. ఆంధ్రప్రదేశ్‌లో అత్యధిక జనాభా కలిగిన నగరం విశాఖపట్నం.","II. విజయవాడ కృష్ణా నది ఒడ్డున ఉంది.","III. తిరుపతి రాయలసీమ ప్రాంతంలో ఉంది.","IV. అమరావతి గోదావరి ఒడ్డున ఉంది.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["II and IV","II మరియు IV"],["III and IV","III మరియు IV"],["Only IV","IV మాత్రమే"],["I and IV","I మరియు IV"]],"a":2,"xe":"Amaravati lies on the Krishna.","xt":"అమరావతి కృష్ణా నది ఒడ్డున ఉంది."},{"n":45,"en":["Consider the following statements:","I. The Prakasam Barrage is built across the Godavari at Rajahmundry.","II. The Dowleswaram Barrage on the Godavari was built under Sir Arthur Cotton.","III. Somasila Reservoir is on the Pennar.","IV. Gandikota is a gorge of the Pennar in Kadapa.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. ప్రకాశం బ్యారేజీ రాజమహేంద్రవరం వద్ద గోదావరిపై నిర్మించబడింది.","II. గోదావరిపై ధవళేశ్వరం బ్యారేజీ సర్ ఆర్థర్ కాటన్ ఆధ్వర్యంలో నిర్మించబడింది.","III. సోమశిల జలాశయం పెన్నా నదిపై ఉంది.","IV. గండికోట కడపలో పెన్నా నది ఏర్పరచిన లోయ.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["III and IV","III మరియు IV"],["II, III and IV","II, III మరియు IV"],["II and III","II మరియు III"],["II and IV","II మరియు IV"]],"a":1,"xe":"The Prakasam Barrage is across the Krishna at Vijayawada.","xt":"ప్రకాశం బ్యారేజీ విజయవాడ వద్ద కృష్ణా నదిపై ఉంది."},{"n":46,"en":["Consider the following statements:","I. The Coringa mangroves lie in the Godavari estuary.","II. The Krishna Wildlife Sanctuary protects mangroves in the Krishna delta.","III. Mangroves are extensive in the Rayalaseema plateau.","IV. Major mangrove cover of Andhra Pradesh is in the Godavari and Krishna estuaries.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. కోరంగి మడ అడవులు గోదావరి ముఖద్వారంలో ఉన్నాయి.","II. కృష్ణా అభయారణ్యం కృష్ణా డెల్టాలోని మడ అడవులను రక్షిస్తుంది.","III. రాయలసీమ పీఠభూమిలో మడ అడవులు విస్తారం.","IV. ఆంధ్రప్రదేశ్ మడ అడవుల్లో ప్రధాన భాగం గోదావరి, కృష్ణా ముఖద్వారాల్లో ఉంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I, II and IV","I, II మరియు IV"],["I and II","I మరియు II"],["I and IV","I మరియు IV"],["II and IV","II మరియు IV"]],"a":0,"xe":"Mangroves need tidal, saline, muddy coasts; Rayalaseema is inland.","xt":"మడ అడవులకు పోటు, లవణ, బురద తీరాలు కావాలి; రాయలసీమ లోతట్టు."},{"n":47,"en":["Consider the following statements:","I. The Andhra coast forms part of the Coromandel and Northern Circars coasts.","II. The Krishna–Godavari basin is known for hydrocarbons.","III. Konaseema is a part of the Godavari delta.","IV. The Andhra coast is rocky throughout its length.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. ఆంధ్ర తీరం కోరమండల్, ఉత్తర సర్కారుల తీరాల్లో భాగం.","II. కృష్ణా–గోదావరి బేసిన్ హైడ్రోకార్బన్లకు ప్రసిద్ధి.","III. కోనసీమ గోదావరి డెల్టాలో భాగం.","IV. ఆంధ్ర తీరం మొత్తం రాతి తీరం.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and III","I మరియు III"],["II and III","II మరియు III"],["I and II","I మరియు II"],["I, II and III","I, II మరియు III"]],"a":3,"xe":"The coast is largely a low-lying depositional plain with deltas and lagoons.","xt":"తీరం ఎక్కువగా డెల్టాలు, మడుగులతో కూడిన తక్కువ ఎత్తు నిక్షేప మైదానం."},{"n":48,"en":["Consider the following Assertion (A) and Reason (R) and choose the correct code:","Assertion (A): Sriharikota is used for India's satellite launches.","Reason (R): Its low-latitude east-coast location gives an eastward boost from Earth's rotation and open sea for safety."],"te":["కింది ధృవీకరణ (A), కారణం (R) లను పరిగణించి సరైన కోడ్‌ను ఎంచుకోండి:","ధృవీకరణ (A): శ్రీహరికోట భారత ఉపగ్రహ ప్రయోగాలకు ఉపయోగిస్తారు.","కారణం (R): తక్కువ అక్షాంశం, తూర్పు తీర స్థానం వల్ల భూభ్రమణ ఊతం, భద్రత కోసం బహిరంగ సముద్రం లభిస్తాయి."],"o":[["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A), (R) రెండూ నిజం, (R) అనేది (A)కు సరైన వివరణ"],["Both (A) and (R) are true but (R) is not the correct explanation of (A)","(A), (R) రెండూ నిజం, కానీ (R) అనేది (A)కు సరైన వివరణ కాదు"],["(A) is true but (R) is false","(A) నిజం, కానీ (R) తప్పు"],["(A) is false but (R) is true","(A) తప్పు, కానీ (R) నిజం"]],"a":0,"xe":"R explains A.","xt":"R, Aను వివరిస్తుంది."},{"n":49,"en":["Match the dams/barrages with their rivers:","List-I (Project)","A. Polavaram","B. Srisailam","C. Somasila","D. Gotta Barrage","List-II (River)","I. Pennar","II. Vamsadhara","III. Godavari","IV. Krishna","Choose the correct answer using the codes given below:"],"te":["ఆనకట్టలు/బ్యారేజీలను వాటి నదులతో జతపరచండి:","జాబితా-I (ప్రాజెక్టు)","A. పోలవరం","B. శ్రీశైలం","C. సోమశిల","D. గొట్టా బ్యారేజీ","జాబితా-II (నది)","I. పెన్నా","II. వంశధార","III. గోదావరి","IV. కృష్ణా","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–IV, B–III, C–I, D–II","A–IV, B–III, C–I, D–II"],["A–III, B–IV, C–I, D–II","A–III, B–IV, C–I, D–II"],["A–III, B–IV, C–II, D–I","A–III, B–IV, C–II, D–I"],["A–I, B–IV, C–III, D–II","A–I, B–IV, C–III, D–II"]],"a":1,"xe":"Polavaram–Godavari; Srisailam–Krishna; Somasila–Pennar; Gotta–Vamsadhara.","xt":"పోలవరం–గోదావరి; శ్రీశైలం–కృష్ణా; సోమశిల–పెన్నా; గొట్టా–వంశధార."},{"n":50,"en":["Match the industrial units with their descriptions:","List-I (Unit)","A. Sri City","B. AMTZ","C. Visakhapatnam Steel Plant","D. Hindustan Shipyard","List-II (Description)","I. Medical devices manufacturing zone","II. Integrated steel plant (RINL)","III. Multi-product SEZ in Tirupati district","IV. Shipbuilding","Choose the correct answer using the codes given below:"],"te":["పారిశ్రామిక యూనిట్లను వాటి వివరణలతో జతపరచండి:","జాబితా-I (యూనిట్)","A. శ్రీ సిటీ","B. AMTZ","C. విశాఖ ఉక్కు కర్మాగారం","D. హిందుస్థాన్ షిప్‌యార్డ్","జాబితా-II (వివరణ)","I. వైద్య పరికరాల తయారీ జోన్","II. సమీకృత ఉక్కు కర్మాగారం (RINL)","III. తిరుపతి జిల్లాలోని బహుళ ఉత్పత్తి SEZ","IV. నౌకా నిర్మాణం","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–III, B–I, C–II, D–IV","A–III, B–I, C–II, D–IV"],["A–III, B–I, C–IV, D–II","A–III, B–I, C–IV, D–II"],["A–II, B–I, C–III, D–IV","A–II, B–I, C–III, D–IV"],["A–III, B–IV, C–II, D–I","A–III, B–IV, C–II, D–I"]],"a":0,"xe":"Sri City–multi-product SEZ; AMTZ–me       tab:function(n){return"టెస్ట్ "+n},info:"<p><b>50 ప్రశ్నలు · 50 నిమిషాలు · సరైన జవాబుకు +1, తప్పుకు −⅓</b> (APPSC విధానం).</p><p>జవాబు కోసం ఒక ఆప్షన్‌ను నొక్కండి. చివర్లో <b>సబ్మిట్</b> నొక్కితే మీ మార్కులు, ప్రతి ప్రశ్న వివరణ కనిపిస్తాయి. కనీసం రెండు ఆప్షన్లను తొలగించలేకపోతే ఆ ప్రశ్నను వదిలేయండి.</p>",
      instant:"ప్రాక్టీస్ మోడ్: ప్రతి జవాబు నొక్కగానే సరైనదో కాదో చూపించు",cnt:function(a){return a+" / 50 జవాబులు"},submit:"సబ్మిట్",submitted:"సబ్మిట్ అయింది",reset:"మళ్లీ మొదలుపెట్టండి",pdf:"ప్రింట్ PDF",
      res:"మీ ఫలితం",c:"సరైనవి",w:"తప్పులు",s:"వదిలినవి",m:"మార్కులు",guide:"మార్కులు = సరైనవి − (తప్పులు ÷ 3)",v:[["40+ — బలంగా ఉన్నారు. తర్వాతి సంపుటికి వెళ్లండి.",40],["30–39 — మంచిది. తప్పిన ప్రశ్నలను ఒకసారి చదవండి.",30],["30 లోపు — ఈ సంపుటిని మళ్లీ చదివి, టెస్ట్ మళ్లీ రాయండి.",-99]],
      ans:"జవాబు",skip:"జవాబు ఇవ్వలేదు. జవాబు",time:"సమయం ముగిసింది — టెస్ట్ సబ్మిట్ అయింది.",confirm:function(u){return u+" ప్రశ్నలకు జవాబు ఇవ్వలేదు. అయినా సబ్మిట్ చేయాలా?"},back:"← గ్రూప్ 1కి వెనక్కి",foot:"సులభం — ఏపీ అభ్యర్థులకు ఉచిత ప్రాక్టీస్ టెస్టులు. ముందు సంపుటి చదివి, తర్వాత దాని టెస్ట్ రాయండి."}
  };
  var CFG={"en": "Geography Mock Test", "te": "భూగోళశాస్త్రం మాక్ టెస్ట్", "key": "sul_geomock_t", "lab": "1234", "pdf": {"1": "Geography_MockTest1_ExamPattern.pdf", "2": "Geography_MockTest2_ExamPattern.pdf", "3": "Geography_MockTest3_ExamPattern.pdf"}, "note": {"en": "Exam pattern, modelled on APPSC Group 1 Prelims 2024: statement-based, match-the-list, assertion–reason and sequence questions.", "te": "పరీక్షా విధానం — APPSC గ్రూప్ 1 ప్రిలిమ్స్ 2024 నమూనా: ప్రకటనలు, జతపరచడం, ధృవీకరణ–కారణం, క్రమం ప్రశ్నలు."}};var PDFS=CFG.pdf;
  function $(i){return document.getElementById(i)}
  function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
  var P=new URLSearchParams(location.search);
  var med=P.get("m")||ls("sul_med")||ls("sul_lang")||"en"; if(med!=="te")med="en";
  var tn=+(P.get("t")||1); if(!DATA[tn])tn=1;
  var from=P.get("from")||"group1";
  var st,timerId,left;
  function key(){return CFG.key+tn}
  function load(){var s=null;try{s=JSON.parse(ls(key())||"null")}catch(e){}st=s||{a:{},done:false,left:3000,inst:false}}
  function save(){ls(key(),JSON.stringify(st))}
  function L(){return T[med]}
  function drawHead(){
    var l=L();document.documentElement.lang=med;
    document.title=l.title(tn)+" · Sulabham";
    $("title").textContent=l.title(tn);$("sub").textContent=l.vol[tn-1];
    $("info").innerHTML=l.info+(CFG.note?"<p><b>"+esc(CFG.note[med])+"</b></p>":"")+'<label class="chk"><input type="checkbox" id="inst"'+(st.inst?" checked":"")+'> '+esc(l.instant)+'</label>';
    $("inst").onchange=function(e){st.inst=e.target.checked;save();drawQs()};
    document.querySelectorAll("[data-m]").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.m===med)});
    $("tsel").innerHTML=[1,2,3].map(function(n){return'<button type="button" data-t="'+n+'" aria-pressed="'+(n===tn)+'">'+esc(l.tab(n))+'</button>'}).join("");
    $("reset").textContent=l.reset;$("pdf").textContent=l.pdf;$("pdf").href=PDFS[tn];
    var bk={group1:["index.html#group1",l.back],group2:["index.html#group2",l.back.replace("1","2")],si:["index.html#si",med==="te"?"← SIకి వెనక్కి":"← Back to SI"],pc:["index.html#pc",med==="te"?"← కానిస్టేబుల్‌కి వెనక్కి":"← Back to Constable"]}[from]||["index.html#group1",l.back];
    $("back").href=bk[0];$("back").textContent=bk[1];$("foot").textContent=l.foot;
  }
  function qText(q){var x=med==="te"?q.te:q.en;if(typeof x==="string")return esc(x);
    return x.map(function(l,i){var c=i===0?"l0":(/^(List|జాబితా)/.test(l)?"lh":(/^(Assertion|Reason|ధృవీకరణ|కారణం)/.test(l)?"la":(/^([IVX]+|[A-D])\.\s/.test(l)?"li":"lc")));return'<span class="'+c+'">'+esc(l)+'</span>'}).join("")}
  function oText(o){return med==="te"?o[1]:o[0]}
  function drawQs(){
    var l=L(),qs=DATA[tn].q,h="";
    qs.forEach(function(q,i){
      var a=st.a[i],show=st.done||(st.inst&&a!==undefined);
      h+='<li class="q" id="q'+(i+1)+'"><div class="qt"><span class="qn">'+(i+1)+'.</span>'+qText(q)+'</div><div class="opts">';
      q.o.forEach(function(o,j){
        var cls="";if(show){if(j===q.a)cls="right";else if(j===a)cls="wrong"}
        h+='<button type="button" data-i="'+i+'" data-j="'+j+'" aria-pressed="'+(a===j)+'"'+(cls?' class="'+cls+'"':"")+(show?" disabled":"")+'><b>'+(CFG.lab||"ABCD")[j]+'</b><span>'+esc(oText(o))+'</span></button>';
      });
      h+='</div>';
      if(show){var x=med==="te"?q.xt:q.xe,ans=(CFG.lab?"("+CFG.lab[q.a]+") ":"ABCD"[q.a]+") ")+""+oText(q.o[q.a]);
        if(a===undefined)h+='<p class="why skip"><b>'+esc(l.skip)+': '+esc(ans)+'.</b> '+esc(x)+'</p>';
        else h+='<p class="why'+(a===q.a?"":" no")+'"><b>'+esc(l.ans)+': '+esc(ans)+'.</b> '+esc(x)+'</p>'}
      h+='</li>';
    });
    $("qs").innerHTML=h;drawBar();
  }
  function counts(){var c=0,w=0,qs=DATA[tn].q;qs.forEach(function(q,i){var a=st.a[i];if(a===undefined)return;if(a===q.a)c++;else w++});return{c:c,w:w,s:qs.length-c-w,m:Math.round((c-w/3)*100)/100}}
  function drawBar(){
    var l=L(),n=Object.keys(st.a).length;$("cnt").textContent=l.cnt(n);$("meter").style.width=(n*2)+"%";
    var k=counts();$("mk").textContent=(st.done||st.inst)?(l.m+": "+k.m+" / 50"):"";
    [$("submit"),$("submit2")].forEach(function(b){b.textContent=st.done?l.submitted:l.submit;b.disabled=st.done});
    drawTimer();
  }
  function drawTimer(){var t=Math.max(0,st.left),m=Math.floor(t/60),s=t%60;$("timer").textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;$("timer").classList.toggle("low",t<300)}
  function tick(){if(st.done)return;st.left--;if(st.left%10===0)save();drawTimer();if(st.left<=0){finish(true)}}
  function startTimer(){clearInterval(timerId);if(!st.done)timerId=setInterval(tick,1000)}
  function finish(auto){
    var l=L();if(!auto){var u=50-Object.keys(st.a).length;if(u>0&&!confirm(l.confirm(u)))return}
    st.done=true;clearInterval(timerId);save();drawQs();drawResult(auto);$("result").scrollIntoView({behavior:"smooth"})
  }
  function drawResult(auto){
    var l=L(),k=counts(),r=$("result");if(!st.done){r.hidden=true;return}
    var v=l.v.filter(function(x){return k.m>=x[1]})[0][0];
    r.hidden=false;r.innerHTML='<h2>'+esc(l.res)+' · '+esc(l.title(tn))+'</h2>'+(auto?'<p>'+esc(l.time)+'</p>':'')+
      '<div class="stats"><div><b>'+k.m+'</b><small>'+l.m+' / 50</small></div><div><b>'+k.c+'</b><small>'+l.c+'</small></div><div><b>'+k.w+'</b><small>'+l.w+'</small></div><div><b>'+k.s+'</b><small>'+l.s+'</small></div></div>'+
      '<p class="verdict">'+esc(v)+'</p><p><small>'+esc(l.guide)+'</small></p>';
  }
  document.addEventListener("click",function(e){
    var b=e.target.closest(".opts button");
    if(b&&!st.done){var i=+b.dataset.i,j=+b.dataset.j;if(st.inst&&st.a[i]!==undefined)return;if(st.a[i]===j)delete st.a[i];else st.a[i]=j;save();
      if(st.inst){drawQs()}else{b.parentNode.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x===b&&st.a[i]===j)});drawBar()}return}
    var m=e.target.closest("[data-m]");if(m){med=m.dataset.m;ls("sul_med",med);drawAll();return}
    var t=e.target.closest("[data-t]");if(t){tn=+t.dataset.t;history.replaceState(null,"","?t="+tn+"&from="+from);drawAll(true);return}
  });
  $("submit").onclick=$("submit2").onclick=function(){finish(false)};
  $("reset").onclick=function(){st={a:{},done:false,left:3000,inst:st.inst};save();drawAll(true);window.scrollTo(0,0)};
  function drawAll(reload){if(reload!==false&&reload)load();drawHead();drawQs();drawResult();startTimer()}
  load();drawAll(false);
})();
</script>
