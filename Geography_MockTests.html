<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geography Mock Tests · Sulabham</title>
<meta name="description" content="Free APPSC Group 1 / Group 2 Geography practice tests in English and Telugu medium, 50 questions each, APPSC marking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Telugu:wght@600;800&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans:wght@400;600&display=swap">
<style>
:root{--ink:#16324a;--paper:#f6f8f9;--card:#fff;--line:#d6dfe5;--muted:#52677a;--pasupu:#e3a400;--pasupu-soft:#fff3cf;--leaf:#1f7a55;--leaf-soft:#e3f3ea;--kumkum:#b3322b;--kumkum-soft:#fbe9e7;--chain:#2c6e8f;
--f-display:"Anek Telugu","Noto Sans Telugu","Noto Sans",sans-serif;--f-body:"Noto Sans","Noto Sans Telugu",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6eef4;--paper:#0f1a23;--card:#16242f;--line:#29404f;--muted:#9fb3c2;--pasupu:#f2bd2f;--pasupu-soft:#3a2f0e;--leaf:#4cc28c;--leaf-soft:#123326;--kumkum:#ef7a72;--kumkum-soft:#3a1d1b;--chain:#7cc3e0;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e6eef4;--paper:#0f1a23;--card:#16242f;--line:#29404f;--muted:#9fb3c2;--pasupu:#f2bd2f;--pasupu-soft:#3a2f0e;--leaf:#4cc28c;--leaf-soft:#123326;--kumkum:#ef7a72;--kumkum-soft:#3a1d1b;--chain:#7cc3e0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--f-body)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header{background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;text-decoration:none;color:var(--ink)}
.brand span{color:var(--pasupu)}
.back{margin-left:auto;font-size:.88rem;color:var(--muted)}
h1{font-family:var(--f-display);font-size:1.6rem;line-height:1.25;margin:20px 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:.9rem;font-weight:600;padding:7px 14px;border:0;background:transparent;color:var(--ink);cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.info{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:.92rem}
.info b{font-weight:600}
.info p{margin:4px 0}
label.chk{display:flex;gap:8px;align-items:center;font-size:.92rem;cursor:pointer}
label.chk input{width:18px;height:18px}
.bar{position:sticky;top:0;z-index:4;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:8px}
.prog{flex:1;min-width:0}
.prog small{display:block;color:var(--muted);font-size:.8rem}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--pasupu);width:0}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:.95rem;white-space:nowrap}
.timer.low{color:var(--kumkum)}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:9px 16px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;min-height:42px;text-decoration:none;display:inline-flex;align-items:center}
.btn.primary{background:var(--pasupu);border-color:var(--pasupu);color:#1b1300}
ol.qs{list-style:none;margin:16px 0;padding:0;display:grid;gap:12px}
.q{scroll-margin-top:90px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.q .qt{margin:0 0 10px}
.q .qt>span.qn{color:var(--muted);margin-right:6px}
.q .qt .l0{font-weight:600;display:inline!important}.q .qt span:not(.qn){display:block}
.q .qt .li,.q .qt .la,.q .qt .lh,.q .qt .lc{font-weight:400;margin-top:4px}
.q .qt .li{padding-left:10px}.q .qt .lh{font-weight:600;margin-top:8px;color:var(--chain)}
.q .qt .la{padding:6px 10px;background:var(--paper);border-radius:8px}
.q .qt .lc{font-weight:600;margin-top:8px}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opts button{font:inherit;text-align:left;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:44px;display:flex;gap:8px}
.opts button b{flex:none;font-weight:600;color:var(--muted)}
.opts button[aria-pressed="true"]{border-color:var(--ink);background:var(--pasupu-soft)}
.opts button.right{border-color:var(--leaf);background:var(--leaf-soft)}
.opts button.wrong{border-color:var(--kumkum);background:var(--kumkum-soft)}
.opts button:disabled{cursor:default}
.why{margin:10px 0 0;padding:8px 12px;border-left:4px solid var(--leaf);background:var(--leaf-soft);border-radius:6px;font-size:.92rem}
.why.no{border-color:var(--kumkum);background:var(--kumkum-soft)}
.why.skip{border-color:var(--muted);background:var(--paper)}
.result{scroll-margin-top:90px;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:16px;margin:16px 0}
.result h2{font-family:var(--f-display);margin:0 0 8px;font-size:1.3rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
.stats div{background:var(--paper);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:1.4rem;font-family:var(--f-display)}
.stats small{color:var(--muted);font-size:.8rem}
.verdict{font-weight:600;margin:6px 0}
footer{color:var(--muted);font-size:.85rem;padding:24px 0 40px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="index.html">Sula<span>bham</span></a><a class="back" id="back" href="index.html#group1">← Back to Group 1</a></div></header>
<main class="wrap">
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="row">
    <div class="seg" role="group" aria-label="Medium"><button type="button" data-m="en">English medium</button><button type="button" data-m="te">తెలుగు మీడియం</button></div>
  </div>
  <div class="row"><div class="seg" role="group" aria-label="Test" id="tsel"></div></div>
  <div class="info" id="info"></div>
</main>
<div class="bar"><div class="wrap">
  <div class="prog"><span id="cnt"></span><small id="mk"></small><div class="meter"><i id="meter"></i></div></div>
  <span class="timer" id="timer">50:00</span>
  <button class="btn primary" type="button" id="submit"></button>
</div></div>
<main class="wrap">
  <div class="result" id="result" hidden></div>
  <ol class="qs" id="qs"></ol>
  <div class="row"><button class="btn primary" type="button" id="submit2"></button><button class="btn" type="button" id="reset"></button><a class="btn" id="pdf" href="#" target="_blank" rel="noopener"></a></div>
  <footer id="foot"></footer>
</main>
<script>
var DATA={"1":{"q":[{"n":1,"en":["Consider the following statements:","I. The Doldrums are marked by strong, steady winds.","II. The 'Roaring Forties' are strong westerlies of the Southern Hemisphere.","III. Horse latitudes are subtropical high-pressure belts with calm descending air.","IV. Westerlies are stronger in the Northern Hemisphere than in the Southern.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. డోల్‌డ్రమ్స్ బలమైన స్థిర పవనాలతో ఉంటాయి.","II. 'రోరింగ్ ఫార్టీస్' దక్షిణార్ధగోళపు బలమైన పశ్చిమ పవనాలు.","III. హార్స్ అక్షాంశాలు అవరోహణ ప్రశాంత గాలితో ఉండే ఉపఉష్ణమండల అధిక పీడన పట్టీలు.","IV. పశ్చిమ పవనాలు ఉత్తరార్ధగోళంలో దక్షిణార్ధగోళం కంటే బలమైనవి.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I, II and III","I, II మరియు III"],["II and III","II మరియు III"],["Only II","II మాత్రమే"],["II, III and IV","II, III మరియు IV"]],"a":1,"xe":"Doldrums are calm; southern westerlies are stronger due to few landmasses.","xt":"డోల్‌డ్రమ్స్ ప్రశాంతంగా ఉంటాయి; దక్షిణంలో భూభాగాలు తక్కువ కాబట్టి పశ్చిమ పవనాలు బలమైనవి."},{"n":2,"en":["Consider the following statements:","I. Fresh snow has a higher albedo than a forest.","II. Convection is vertical and advection is horizontal transfer of heat in the atmosphere.","III. Terrestrial radiation is short-wave radiation.","IV. Temperature inversion is favoured by long clear winter nights with calm air.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. తాజా మంచు ఆల్బెడో అడవి కంటే ఎక్కువ.","II. సంవహనం నిలువుగా, అభివాహం అడ్డంగా వాతావరణంలో ఉష్ణ బదిలీ.","III. భూవికిరణం హ్రస్వ తరంగ వికిరణం.","IV. పొడవైన నిర్మలమైన శీతాకాల రాత్రులు, ప్రశాంత గాలి ఉష్ణోగ్రత విలోమానికి అనుకూలం.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I, II and IV","I, II మరియు IV"],["I and IV","I మరియు IV"],["II and IV","II మరియు IV"],["I and II","I మరియు II"]],"a":0,"xe":"Solar radiation is short-wave; terrestrial radiation is long-wave.","xt":"సౌర వికిరణం హ్రస్వ తరంగం; భూ వికిరణం దీర్ఘ తరంగం."},{"n":3,"en":["Consider the following statements:","I. Laterite soil is formed by intense leaching in hot, humid tropics.","II. Chernozem (black earth) is typical of the humid tropics.","III. Podzols are found under coniferous forests in cool, humid regions.","IV. Terra rossa is a red soil of the Mediterranean limestone regions.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. లేటరైట్ నేల వేడి, తేమ ఉష్ణమండలంలో తీవ్ర వాహనం (లీచింగ్) వల్ల ఏర్పడుతుంది.","II. చెర్నోజెమ్ (నల్లమట్టి) తేమ ఉష్ణమండలానికి విలక్షణం.","III. పాడ్జోల్స్ చల్లని, తేమ ప్రాంతాల్లో శంఖాకార అడవుల కింద ఉంటాయి.","IV. టెర్రా రోస్సా మధ్యధరా సున్నపురాయి ప్రాంతాల ఎర్ర నేల.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["III and IV","III మరియు IV"],["I and III","I మరియు III"],["I and IV","I మరియు IV"],["I, III and IV","I, III మరియు IV"]],"a":3,"xe":"Chernozem is a temperate-grassland (steppe) soil, e.g. Ukraine.","xt":"చెర్నోజెమ్ సమశీతోష్ణ గడ్డి మైదానాల (స్టెప్పీ) నేల, ఉదా: ఉక్రెయిన్."},{"n":4,"en":["Consider the following Assertion (A) and Reason (R) and choose the correct code:","Assertion (A): Antarctica is the driest continent.","Reason (R): More than 98 per cent of Antarctica is covered by an ice sheet."],"te":["కింది ధృవీకరణ (A), కారణం (R) లను పరిగణించి సరైన కోడ్‌ను ఎంచుకోండి:","ధృవీకరణ (A): అంటార్కిటికా అత్యంత పొడి ఖండం.","కారణం (R): అంటార్కిటికాలో 98 శాతానికి పైగా మంచు పలకతో కప్పబడి ఉంది."],"o":[["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A), (R) రెండూ నిజం, (R) అనేది (A)కు సరైన వివరణ"],["Both (A) and (R) are true but (R) is not the correct explanation of (A)","(A), (R) రెండూ నిజం, కానీ (R) అనేది (A)కు సరైన వివరణ కాదు"],["(A) is true but (R) is false","(A) నిజం, కానీ (R) తప్పు"],["(A) is false but (R) is true","(A) తప్పు, కానీ (R) నిజం"]],"a":1,"xe":"Both are true, but ice cover does not explain the dryness (it is a polar desert with very low precipitation).","xt":"రెండూ నిజం; కానీ మంచు కప్పడం పొడితనానికి కారణం కాదు (అక్కడ అతి తక్కువ అవపాతం)."},{"n":5,"en":["Consider the following statements:","I. Barchans are crescent-shaped sand dunes.","II. Loess is wind-blown silt deposited in places such as northern China.","III. Mushroom rocks are shaped by wind abrasion.","IV. Inselbergs are formed by the deposition of sand by wind.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. బార్కాన్లు అర్ధచంద్రాకార ఇసుక దిబ్బలు.","II. లోయెస్ గాలి మోసుకొచ్చిన సన్నని మట్టి; ఉత్తర చైనా వంటి చోట్ల నిక్షేపమవుతుంది.","III. పుట్టగొడుగు రాళ్లు గాలి రాపిడితో ఏర్పడతాయి.","IV. ఇన్సెల్‌బర్గ్‌లు గాలి ఇసుక నిక్షేపణ వల్ల ఏర్పడతాయి.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and III","I మరియు III"],["I, II and III","I, II మరియు III"],["II and III","II మరియు III"],["I and II","I మరియు II"]],"a":1,"xe":"Inselbergs are residual hills left after erosion, not wind deposits.","xt":"ఇన్సెల్‌బర్గ్‌లు క్రమక్షయం తర్వాత మిగిలిన అవశేష కొండలు."},{"n":6,"en":["Consider the following statements:","I. The Gulf Stream is a warm ocean current.","II. The meeting of the Labrador and Gulf Stream currents near Newfoundland creates fog and rich fishing grounds.","III. The Humboldt (Peru) current is a warm current.","IV. El Niño is the abnormal warming of the eastern equatorial Pacific.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. గల్ఫ్ స్ట్రీమ్ ఒక వెచ్చని సముద్ర ప్రవాహం.","II. లాబ్రడార్, గల్ఫ్ స్ట్రీమ్ కలిసే న్యూఫౌండ్‌ల్యాండ్ వద్ద పొగమంచు, గొప్ప చేపల వేట ప్రాంతాలు ఏర్పడతాయి.","III. హంబోల్ట్ (పెరూ) ప్రవాహం వెచ్చని ప్రవాహం.","IV. ఎల్‌నినో తూర్పు భూమధ్యరేఖా పసిఫిక్ అసాధారణంగా వేడెక్కడం.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["Only III","III మాత్రమే"],["III and IV","III మరియు IV"],["I and III","I మరియు III"],["II and III","II మరియు III"]],"a":0,"xe":"The Humboldt current is cold.","xt":"హంబోల్ట్ ప్రవాహం చల్లనిది."},{"n":7,"en":["Match the straits with the water bodies they connect:","List-I (Strait)","A. Gibraltar","B. Bosphorus","C. Malacca","D. Hormuz","List-II (Connects)","I. Black Sea and Sea of Marmara","II. Persian Gulf and Gulf of Oman","III. Atlantic Ocean and Mediterranean Sea","IV. Andaman Sea and South China Sea","Choose the correct answer using the codes given below:"],"te":["జలసంధులను అవి కలిపే జలాశయాలతో జతపరచండి:","జాబితా-I (జలసంధి)","A. జిబ్రాల్టర్","B. బాస్ఫరస్","C. మలక్కా","D. హోర్ముజ్","జాబితా-II (కలిపేవి)","I. నల్ల సముద్రం, మార్మరా సముద్రం","II. పర్షియన్ గల్ఫ్, ఒమన్ గల్ఫ్","III. అట్లాంటిక్, మధ్యధరా సముద్రం","IV. అండమాన్ సముద్రం, దక్షిణ చైనా సముద్రం","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–I, B–III, C–IV, D–II","A–I, B–III, C–IV, D–II"],["A–III, B–I, C–II, D–IV","A–III, B–I, C–II, D–IV"],["A–IV, B–I, C–III, D–II","A–IV, B–I, C–III, D–II"],["A–III, B–I, C–IV, D–II","A–III, B–I, C–IV, D–II"]],"a":3,"xe":"Gibraltar–Atlantic/Med; Bosphorus–Black/Marmara; Malacca–Andaman/SCS; Hormuz–Persian Gulf/Oman.","xt":"జిబ్రాల్టర్–అట్లాంటిక్/మధ్యధరా; బాస్ఫరస్–నల్ల/మార్మరా; మలక్కా–అండమాన్/దక్షిణ చైనా; హోర్ముజ్–పర్షియన్/ఒమన్."},{"n":8,"en":["Consider the following Assertion (A) and Reason (R) and choose the correct code:","Assertion (A): Winds in the Northern Hemisphere are deflected to their right.","Reason (R): The Coriolis force, caused by the Earth's rotation, acts at right angles to the direction of motion."],"te":["కింది ధృవీకరణ (A), కారణం (R) లను పరిగణించి సరైన కోడ్‌ను ఎంచుకోండి:","ధృవీకరణ (A): ఉత్తరార్ధగోళంలో పవనాలు తమ కుడివైపుకు మళ్లుతాయి.","కారణం (R): భూభ్రమణం వల్ల కలిగే కోరియోలిస్ బలం చలన దిశకు లంబంగా పనిచేస్తుంది."],"o":[["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A), (R) రెండూ నిజం, (R) అనేది (A)కు సరైన వివరణ"],["Both (A) and (R) are true but (R) is not the correct explanation of (A)","(A), (R) రెండూ నిజం, కానీ (R) అనేది (A)కు సరైన వివరణ కాదు"],["(A) is true but (R) is false","(A) నిజం, కానీ (R) తప్పు"],["(A) is false but (R) is true","(A) తప్పు, కానీ (R) నిజం"]],"a":0,"xe":"Both true; Coriolis force explains the deflection.","xt":"రెండూ నిజం; కోరియోలిస్ బలమే మళ్లింపును వివరిస్తుంది."},{"n":9,"en":["Arrange the oceans in descending order of area:"],"te":["మహాసముద్రాలను విస్తీర్ణం తగ్గే క్రమంలో అమర్చండి:"],"o":[["Pacific – Indian – Atlantic – Southern","పసిఫిక్ – హిందూ – అట్లాంటిక్ – దక్షిణ"],["Pacific – Atlantic – Indian – Southern","పసిఫిక్ – అట్లాంటిక్ – హిందూ – దక్షిణ"],["Atlantic – Pacific – Indian – Southern","అట్లాంటిక్ – పసిఫిక్ – హిందూ – దక్షిణ"],["Pacific – Atlantic – Southern – Indian","పసిఫిక్ – అట్లాంటిక్ – దక్షిణ – హిందూ"]],"a":1,"xe":"Pacific (~165 m sq km) > Atlantic (~106) > Indian (~70) > Southern (~20) > Arctic.","xt":"పసిఫిక్ > అట్లాంటిక్ > హిందూ > దక్షిణ > ఆర్కిటిక్."},{"n":10,"en":["Consider the following statements:","I. The continental shelf is a gently sloping submerged margin of the continent.","II. The continental slope is gentler than the continental shelf.","III. Ocean trenches are the deepest parts of the ocean.","IV. Guyots are sharp-peaked submarine mountains.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. ఖండతిన్నె ఖండం యొక్క మెల్లగా వాలుగా మునిగిన అంచు.","II. ఖండ వాలు ఖండతిన్నె కంటే సున్నితమైనది.","III. సముద్ర కందకాలు సముద్రంలో అత్యంత లోతైన భాగాలు.","IV. గయోట్లు మొనదేలిన సముద్రగర్భ పర్వతాలు.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["II and IV","II మరియు IV"],["Only II","II మాత్రమే"],["II, III and IV","II, III మరియు IV"],["Only IV","IV మాత్రమే"]],"a":0,"xe":"The slope is steeper than the shelf; guyots are flat-topped seamounts.","xt":"వాలు తిన్నె కంటే నిటారైనది; గయోట్లు చదునైన శిఖరం గల సముద్రగిరులు."},{"n":11,"en":["Consider the following Assertion (A) and Reason (R) and choose the correct code:","Assertion (A): Tropical cyclones form frequently right on the equator.","Reason (R): The Coriolis force is zero at the equator."],"te":["కింది ధృవీకరణ (A), కారణం (R) లను పరిగణించి సరైన కోడ్‌ను ఎంచుకోండి:","ధృవీకరణ (A): ఉష్ణమండల తుపానులు భూమధ్యరేఖ వద్దే తరచుగా ఏర్పడతాయి.","కారణం (R): భూమధ్యరేఖ వద్ద కోరియోలిస్ బలం సున్నా."],"o":[["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A), (R) రెండూ నిజం, (R) అనేది (A)కు సరైన వివరణ"],["Both (A) and (R) are true but (R) is not the correct explanation of (A)","(A), (R) రెండూ నిజం, కానీ (R) అనేది (A)కు సరైన వివరణ కాదు"],["(A) is true but (R) is false","(A) నిజం, కానీ (R) తప్పు"],["(A) is false but (R) is true","(A) తప్పు, కానీ (R) నిజం"]],"a":3,"xe":"(A) false: cyclones rarely form within 5° of the equator because there is no Coriolis spin. (R) true.","xt":"(A) తప్పు: కోరియోలిస్ బలం లేనందున 5° లోపల తుపానులు అరుదు. (R) నిజం."},{"n":12,"en":["Consider the following statements:","I. The Prairies are temperate grasslands of North America.","II. The Pampas are the grasslands of Argentina and Uruguay.","III. The Downs are temperate grasslands of Australia.","IV. The Veld is the temperate grassland of Brazil.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. ప్రేరీలు ఉత్తర అమెరికా సమశీతోష్ణ గడ్డి మైదానాలు.","II. పంపాస్ అర్జెంటీనా, ఉరుగ్వేల గడ్డి మైదానాలు.","III. డౌన్స్ ఆస్ట్రేలియా సమశీతోష్ణ గడ్డి మైదానాలు.","IV. వెల్డ్ బ్రెజిల్ సమశీతోష్ణ గడ్డి మైదానం.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["II and III","II మరియు III"],["I and II","I మరియు II"],["I, II and III","I, II మరియు III"],["I and III","I మరియు III"]],"a":2,"xe":"The Veld is in South Africa; Brazil's tropical grassland is the Campos.","xt":"వెల్డ్ దక్షిణాఫ్రికాలో ఉంది; బ్రెజిల్ గడ్డి మైదానం కాంపోస్."},{"n":13,"en":["Consider the following statements:","I. The ozone layer absorbs harmful ultraviolet radiation.","II. The Montreal Protocol (1987) aims to phase out ozone-depleting substances.","III. CFCs are natural gases released mainly by volcanoes.","IV. Ozone thickness is measured in Dobson Units.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. ఓజోన్ పొర హానికర అతినీలలోహిత కిరణాలను గ్రహిస్తుంది.","II. మాంట్రియల్ ప్రోటోకాల్ (1987) ఓజోన్‌ను క్షీణింపజేసే పదార్థాలను తొలగించడం లక్ష్యంగా కలది.","III. CFCలు ప్రధానంగా అగ్నిపర్వతాలు విడుదల చేసే సహజ వాయువులు.","IV. ఓజోన్ మందాన్ని డాబ్సన్ యూనిట్లలో కొలుస్తారు.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and II","I మరియు II"],["I, II and IV","I, II మరియు IV"],["I and IV","I మరియు IV"],["II and IV","II మరియు IV"]],"a":1,"xe":"CFCs are man-made (refrigerants, aerosols).","xt":"CFCలు మానవ తయారీ (ఫ్రిజ్‌లు, ఏరోసోల్స్)."},{"n":14,"en":["Consider the following statements:","I. Granite is an intrusive igneous rock.","II. Basalt is an extrusive igneous rock.","III. Marble is a sedimentary rock formed from limestone.","IV. Fossils are commonly found in sedimentary rocks.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. గ్రానైట్ అంతర్వేధక అగ్నిశిల.","II. బసాల్ట్ బహిర్వేధక అగ్నిశిల.","III. పాలరాయి (మార్బుల్) సున్నపురాయి నుండి ఏర్పడిన అవక్షేప శిల.","IV. శిలాజాలు సాధారణంగా అవక్షేప శిలల్లో లభిస్తాయి.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["Only III","III మాత్రమే"],["II and III","II మరియు III"],["III and IV","III మరియు IV"],["I and III","I మరియు III"]],"a":0,"xe":"Marble is metamorphic (limestone altered by heat and pressure).","xt":"మార్బుల్ రూపాంతర శిల (సున్నపురాయి వేడి, పీడనంతో మారినది)."},{"n":15,"en":["Match the volcanic mountains with their countries:","List-I (Mountain)","A. Mt Kilimanjaro","B. Mt Fuji","C. Cotopaxi","D. Mt Vesuvius","List-II (Country)","I. Italy","II. Japan","III. Tanzania","IV. Ecuador","Choose the correct answer using the codes given below:"],"te":["అగ్నిపర్వతాలను వాటి దేశాలతో జతపరచండి:","జాబితా-I (పర్వతం)","A. కిలిమంజారో","B. ఫుజి","C. కొటోపాక్సీ","D. వెసూవియస్","జాబితా-II (దేశం)","I. ఇటలీ","II. జపాన్","III. టాంజానియా","IV. ఈక్వెడార్","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–IV, B–II, C–III, D–I","A–IV, B–II, C–III, D–I"],["A–III, B–I, C–IV, D–II","A–III, B–I, C–IV, D–II"],["A–I, B–II, C–IV, D–III","A–I, B–II, C–IV, D–III"],["A–III, B–II, C–IV, D–I","A–III, B–II, C–IV, D–I"]],"a":3,"xe":"Kilimanjaro–Tanzania, Fuji–Japan, Cotopaxi–Ecuador, Vesuvius–Italy.","xt":"కిలిమంజారో–టాంజానియా, ఫుజి–జపాన్, కొటోపాక్సీ–ఈక్వెడార్, వెసూవియస్–ఇటలీ."},{"n":16,"en":["Match the climate types with their descriptions:","List-I (Climate type)","A. Af (Köppen)","B. Aw (Köppen)","C. Cs (Köppen)","D. BWh (Köppen)","List-II (Description)","I. Dry-summer subtropical","II. Tropical wet (rainforest)","III. Hot arid desert","IV. Tropical wet and dry (savanna)","Choose the correct answer using the codes given below:"],"te":["వాతావరణ రకాలను వాటి వివరణలతో జతపరచండి:","జాబితా-I (వాతావరణ రకం)","A. Af (కొప్పెన్)","B. Aw (కొప్పెన్)","C. Cs (కొప్పెన్)","D. BWh (కొప్పెన్)","జాబితా-II (వివరణ)","I. పొడి వేసవి ఉపఉష్ణమండలం","II. ఉష్ణమండల తడి (వర్షారణ్యం)","III. వేడి శుష్క ఎడారి","IV. ఉష్ణమండల తడి–పొడి (సవన్నా)","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–II, B–III, C–I, D–IV","A–II, B–III, C–I, D–IV"],["A–III, B–IV, C–I, D–II","A–III, B–IV, C–I, D–II"],["A–II, B–IV, C–I, D–III","A–II, B–IV, C–I, D–III"],["A–II, B–I, C–IV, D–III","A–II, B–I, C–IV, D–III"]],"a":2,"xe":"Af–rainforest; Aw–savanna; Cs–Mediterranean; BWh–hot desert.","xt":"Af–వర్షారణ్యం; Aw–సవన్నా; Cs–మధ్యధరా; BWh–వేడి ఎడారి."},{"n":17,"en":["Consider the following statements:","I. Meanders develop on gentle gradients in the mature stage of a river.","II. An oxbow lake forms when a meander loop is cut off.","III. V-shaped valleys are characteristic of the old stage of a river.","IV. The Mississippi has a bird's-foot delta.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. నది పరిణత దశలో మెల్లని వాలుపై మెలికలు ఏర్పడతాయి.","II. మెలిక వంపు వేరుపడినప్పుడు గిట్టవంటి (ఆక్స్‌బో) సరస్సు ఏర్పడుతుంది.","III. V-ఆకారపు లోయలు నది వృద్ధ దశ లక్షణం.","IV. మిసిసిపీ నది పక్షి పాద ఆకార డెల్టా కలిగి ఉంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and IV","I మరియు IV"],["I, II and IV","I, II మరియు IV"],["II and IV","II మరియు IV"],["I and II","I మరియు II"]],"a":1,"xe":"V-shaped valleys belong to the youthful (upper) stage.","xt":"V-లోయలు నది యవ్వన (ఎగువ) దశ లక్షణం."},{"n":18,"en":["Consider the following statements:","I. The jigsaw fit of continental coastlines supported continental drift.","II. Glossopteris fossils occur in India, Africa, South America and Australia.","III. Wegener explained drift by sea-floor spreading.","IV. Tillite (glacial) deposits occur in India and southern continents.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. ఖండ తీరరేఖల జిగ్సా అమరిక ఖండ చలనానికి మద్దతు.","II. గ్లాసోప్టెరిస్ శిలాజాలు భారత్, ఆఫ్రికా, దక్షిణ అమెరికా, ఆస్ట్రేలియాల్లో ఉన్నాయి.","III. వెజెనర్ ఖండచలనాన్ని సముద్రతల వ్యాప్తితో వివరించాడు.","IV. టిల్లైట్ (హిమానీ) నిక్షేపాలు భారత్, దక్షిణ ఖండాల్లో ఉన్నాయి.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["Only III","III మాత్రమే"],["III and IV","III మరియు IV"],["I and III","I మరియు III"],["II and III","II మరియు III"]],"a":0,"xe":"Sea-floor spreading was proposed by Harry Hess in the 1960s.","xt":"సముద్రతల వ్యాప్తిని 1960లలో హ్యారీ హెస్ ప్రతిపాదించాడు."},{"n":19,"en":["Consider the following statements:","I. The Alps and the Himalayas are young fold mountains.","II. The Ural Mountains are young fold mountains.","III. The Andes form the longest continental mountain chain.","IV. Mount Kilimanjaro is a volcanic mountain.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. ఆల్ప్స్, హిమాలయాలు యువ ముడత పర్వతాలు.","II. ఊరల్ పర్వతాలు యువ ముడత పర్వతాలు.","III. ఆండీస్ అత్యంత పొడవైన ఖండ పర్వత శ్రేణి.","IV. కిలిమంజారో ఒక అగ్నిపర్వతం.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and III","I మరియు III"],["I and IV","I మరియు IV"],["III and IV","III మరియు IV"],["I, III and IV","I, III మరియు IV"]],"a":3,"xe":"The Urals are very old, worn-down fold mountains.","xt":"ఊరల్ చాలా పురాతన, అరిగిన ముడత పర్వతాలు."},{"n":20,"en":["Match the lakes with their distinction:","List-I (Lake)","A. Baikal","B. Superior","C. Dead Sea","D. Titicaca","List-II (Distinction)","I. Highest large navigable lake","II. Deepest lake in the world, in Russia","III. Lowest land surface on Earth","IV. Largest of the Great Lakes by area","Choose the correct answer using the codes given below:"],"te":["సరస్సులను వాటి ప్రత్యేకతతో జతపరచండి:","జాబితా-I (సరస్సు)","A. బైకాల్","B. సుపీరియర్","C. మృత సముద్రం","D. టిటికాకా","జాబితా-II (ప్రత్యేకత)","I. అత్యంత ఎత్తైన పెద్ద నౌకాయాన సరస్సు","II. ప్రపంచంలో అత్యంత లోతైన సరస్సు, రష్యాలో","III. భూమిపై అత్యంత లోతైన భూ ఉపరితలం","IV. గ్రేట్ లేక్స్‌లో విస్తీర్ణంలో అతిపెద్దది","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–II, B–IV, C–I, D–III","A–II, B–IV, C–I, D–III"],["A–III, B–IV, C–II, D–I","A–III, B–IV, C–II, D–I"],["A–II, B–IV, C–III, D–I","A–II, B–IV, C–III, D–I"],["A–II, B–I, C–III, D–IV","A–II, B–I, C–III, D–IV"]],"a":2,"xe":"Baikal–deepest; Superior–largest Great Lake; Dead Sea–lowest; Titicaca–highest navigable.","xt":"బైకాల్–లోతైనది; సుపీరియర్–పెద్దది; మృత సముద్రం–అత్యంత లోతట్టు; టిటికాకా–ఎత్తైన నౌకాయాన."},{"n":21,"en":["Consider the following statements:","I. Convectional rain is typical of the equatorial region in the afternoons.","II. Orographic rainfall is heavy on the windward side of mountains.","III. Cyclonic rainfall is associated with fronts and low-pressure systems.","IV. Relief rainfall is heaviest on the leeward side of mountains.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. సంవహన వర్షం భూమధ్యరేఖా ప్రాంతంలో మధ్యాహ్నం సాధారణం.","II. పర్వతాల పవనాభిముఖ వైపు ఓరోగ్రాఫిక్ వర్షం ఎక్కువ.","III. చక్రవాత వర్షం ఫ్రంట్‌లు, అల్పపీడన వ్యవస్థలతో ముడిపడి ఉంటుంది.","IV. భూస్వరూప వర్షం పర్వతాల పవనవిముఖ వైపు ఎక్కువ.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["II and III","II మరియు III"],["I, II and III","I, II మరియు III"],["I and II","I మరియు II"],["I and III","I మరియు III"]],"a":1,"xe":"The leeward side lies in the rain shadow and gets little rain.","xt":"పవనవిముఖ వైపు వర్షచ్ఛాయా ప్రాంతం, వర్షం తక్కువ."},{"n":22,"en":["Which one of the following is NOT a cold ocean current?"],"te":["కింది వాటిలో చల్లని సముద్ర ప్రవాహం కానిది ఏది?"],"o":[["Agulhas","అగుల్హాస్"],["Canary","కానరీ"],["Labrador","లాబ్రడార్"],["Benguela","బెంగ్యులా"]],"a":0,"xe":"The Agulhas is a warm current off south-east Africa.","xt":"అగుల్హాస్ ఆగ్నేయ ఆఫ్రికా తీరంలోని వెచ్చని ప్రవాహం."},{"n":23,"en":["Consider the following statements:","I. The Suez Canal connects the Mediterranean Sea with the Red Sea.","II. The Panama Canal was opened in 1869.","III. The Kiel Canal links the North Sea and the Baltic Sea.","IV. The Strait of Malacca lies between the Malay Peninsula and Sumatra.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. సూయజ్ కాలువ మధ్యధరా సముద్రాన్ని ఎర్ర సముద్రంతో కలుపుతుంది.","II. పనామా కాలువ 1869లో ప్రారంభమైంది.","III. కీల్ కాలువ ఉత్తర సముద్రం, బాల్టిక్ సముద్రాలను కలుపుతుంది.","IV. మలక్కా జలసంధి మలయ్ ద్వీపకల్పం, సుమత్రా మధ్య ఉంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and IV","I మరియు IV"],["III and IV","III మరియు IV"],["I and III","I మరియు III"],["I, III and IV","I, III మరియు IV"]],"a":3,"xe":"Suez opened in 1869; Panama opened in 1914.","xt":"సూయజ్ 1869లో, పనామా 1914లో ప్రారంభమయ్యాయి."},{"n":24,"en":["Match the rocks with their types or origin:","List-I (Rock)","A. Granite","B. Marble","C. Slate","D. Sandstone","List-II (Type / origin)","I. Metamorphic, from limestone","II. Metamorphic, from shale","III. Intrusive igneous","IV. Clastic sedimentary","Choose the correct answer using the codes given below:"],"te":["శిలలను వాటి రకం/ఏర్పాటుతో జతపరచండి:","జాబితా-I (శిల)","A. గ్రానైట్","B. పాలరాయి","C. స్లేట్","D. ఇసుకరాయి","జాబితా-II (రకం / ఏర్పాటు)","I. రూపాంతర శిల, సున్నపురాయి నుండి","II. రూపాంతర శిల, షేల్ నుండి","III. అంతర్వేధక అగ్నిశిల","IV. ఖండిత అవక్షేప శిల","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–III, B–II, C–I, D–IV","A–III, B–II, C–I, D–IV"],["A–I, B–III, C–II, D–IV","A–I, B–III, C–II, D–IV"],["A–III, B–I, C–II, D–IV","A–III, B–I, C–II, D–IV"],["A–III, B–I, C–IV, D–II","A–III, B–I, C–IV, D–II"]],"a":2,"xe":"Granite–intrusive igneous; Marble–from limestone; Slate–from shale; Sandstone–sedimentary.","xt":"గ్రానైట్–అంతర్వేధక; మార్బుల్–సున్నపురాయి నుండి; స్లేట్–షేల్ నుండి; ఇసుకరాయి–అవక్షేప."},{"n":25,"en":["Consider the following statements:","I. Nitrogen and oxygen together make up about 99 per cent of dry air.","II. Most of the atmospheric ozone is concentrated in the troposphere.","III. Water vapour decreases from the equator towards the poles.","IV. The ionosphere, which reflects radio waves, lies in the troposphere.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. పొడి గాలిలో నైట్రోజన్, ఆక్సిజన్ కలిసి సుమారు 99 శాతం ఉంటాయి.","II. వాతావరణ ఓజోన్‌లో అధికభాగం ట్రోపోస్ఫియర్‌లో ఉంది.","III. నీటి ఆవిరి భూమధ్యరేఖ నుండి ధ్రువాల వైపు తగ్గుతుంది.","IV. రేడియో తరంగాలను పరావర్తనం చేసే అయనోస్ఫియర్ ట్రోపోస్ఫియర్‌లో ఉంది.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["I, II and IV","I, II మరియు IV"],["II and IV","II మరియు IV"],["Only II","II మాత్రమే"],["II, III and IV","II, III మరియు IV"]],"a":1,"xe":"Ozone is concentrated in the stratosphere; the ionosphere lies within the mesosphere–thermosphere.","xt":"ఓజోన్ స్ట్రాటోస్ఫియర్‌లో ఉంటుంది; అయనోస్ఫియర్ మీసోస్ఫియర్–థర్మోస్ఫియర్‌లో ఉంటుంది."},{"n":26,"en":["Consider the following statements:","I. Karst topography develops mainly on limestone.","II. Stalactites hang from cave roofs while stalagmites rise from cave floors.","III. Sinkholes are depressions caused by solution of rock.","IV. Karst topography is characteristic of granite regions.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. కార్స్ట్ భూస్వరూపం ప్రధానంగా సున్నపురాయిపై ఏర్పడుతుంది.","II. స్టాలక్టైట్లు గుహ పైకప్పు నుండి వేలాడతాయి, స్టాలగ్మైట్లు నేల నుండి పైకి పెరుగుతాయి.","III. సింక్‌హోళ్లు శిల కరగడం వల్ల ఏర్పడిన గుంతలు.","IV. కార్స్ట్ భూస్వరూపం గ్రానైట్ ప్రాంతాల లక్షణం.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["Only IV","IV మాత్రమే"],["II and IV","II మరియు IV"],["III and IV","III మరియు IV"],["I and IV","I మరియు IV"]],"a":0,"xe":"Karst forms where soluble limestone dissolves; Belum Caves in AP are an example.","xt":"కరిగే సున్నపురాయి ఉన్నచోట కార్స్ట్ ఏర్పడుతుంది; ఏపీలో బెలూం గుహలు ఉదాహరణ."},{"n":27,"en":["Arrange the layers of the atmosphere in ascending order from the Earth's surface:"],"te":["భూ ఉపరితలం నుండి పైకి వాతావరణ పొరలను వరుసగా అమర్చండి:"],"o":[["Troposphere – Mesosphere – Stratosphere – Thermosphere","ట్రోపోస్ఫియర్ – మీసోస్ఫియర్ – స్ట్రాటోస్ఫియర్ – థర్మోస్ఫియర్"],["Stratosphere – Troposphere – Mesosphere – Thermosphere","స్ట్రాటోస్ఫియర్ – ట్రోపోస్ఫియర్ – మీసోస్ఫియర్ – థర్మోస్ఫియర్"],["Troposphere – Stratosphere – Thermosphere – Mesosphere","ట్రోపోస్ఫియర్ – స్ట్రాటోస్ఫియర్ – థర్మోస్ఫియర్ – మీసోస్ఫియర్"],["Troposphere – Stratosphere – Mesosphere – Thermosphere","ట్రోపోస్ఫియర్ – స్ట్రాటోస్ఫియర్ – మీసోస్ఫియర్ – థర్మోస్ఫియర్"]],"a":3,"xe":"Order: Troposphere, Stratosphere, Mesosphere, Thermosphere (then Exosphere).","xt":"క్రమం: ట్రోపోస్ఫియర్, స్ట్రాటోస్ఫియర్, మీసోస్ఫియర్, థర్మోస్ఫియర్ (తర్వాత ఎక్సోస్ఫియర్)."},{"n":28,"en":["Consider the following Assertion (A) and Reason (R) and choose the correct code:","Assertion (A): Hot deserts are mostly located on the western margins of continents in the tropics.","Reason (R): Cold currents along the western coasts stabilise the air and reduce rainfall."],"te":["కింది ధృవీకరణ (A), కారణం (R) లను పరిగణించి సరైన కోడ్‌ను ఎంచుకోండి:","ధృవీకరణ (A): ఉష్ణమండలంలో వేడి ఎడారులు ఎక్కువగా ఖండాల పశ్చిమ అంచుల్లో ఉంటాయి.","కారణం (R): పశ్చిమ తీరాల చల్లని ప్రవాహాలు గాలిని స్థిరపరిచి వర్షాన్ని తగ్గిస్తాయి."],"o":[["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A), (R) రెండూ నిజం, (R) అనేది (A)కు సరైన వివరణ"],["Both (A) and (R) are true but (R) is not the correct explanation of (A)","(A), (R) రెండూ నిజం, కానీ (R) అనేది (A)కు సరైన వివరణ కాదు"],["(A) is true but (R) is false","(A) నిజం, కానీ (R) తప్పు"],["(A) is false but (R) is true","(A) తప్పు, కానీ (R) నిజం"]],"a":0,"xe":"Both true; Atacama (Humboldt) and Namib (Benguela) illustrate it.","xt":"రెండూ నిజం; అటకామా (హంబోల్ట్), నమీబ్ (బెంగ్యులా) ఉదాహరణలు."},{"n":29,"en":["Match the deserts with their locations:","List-I (Desert)","A. Atacama","B. Kalahari","C. Gobi","D. Thar","List-II (Location)","I. Mongolia–China","II. Chile","III. India–Pakistan","IV. Southern Africa","Choose the correct answer using the codes given below:"],"te":["ఎడారులను వాటి ప్రాంతాలతో జతపరచండి:","జాబితా-I (ఎడారి)","A. అటకామా","B. కలహరి","C. గోబీ","D. థార్","జాబితా-II (ప్రాంతం)","I. మంగోలియా–చైనా","II. చిలీ","III. భారత్–పాకిస్తాన్","IV. దక్షిణాఫ్రికా ప్రాంతం","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–III, B–IV, C–I, D–II","A–III, B–IV, C–I, D–II"],["A–II, B–IV, C–I, D–III","A–II, B–IV, C–I, D–III"],["A–II, B–I, C–IV, D–III","A–II, B–I, C–IV, D–III"],["A–IV, B–II, C–I, D–III","A–IV, B–II, C–I, D–III"]],"a":1,"xe":"Atacama–Chile; Kalahari–southern Africa; Gobi–Mongolia/China; Thar–India/Pakistan.","xt":"అటకామా–చిలీ; కలహరి–దక్షిణాఫ్రికా; గోబీ–మంగోలియా/చైనా; థార్–భారత్/పాక్."},{"n":30,"en":["Consider the following statements:","I. The Mediterranean climate has hot dry summers and mild rainy winters.","II. The taiga (coniferous forest) belt lies mostly between 50°N and 70°N.","III. Tundra regions have extensive tall trees.","IV. Savanna climate has distinct wet and dry seasons.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. మధ్యధరా వాతావరణంలో వేసవి వేడిగా పొడిగా, శీతాకాలం తేలికగా వర్షంతో ఉంటుంది.","II. టైగా (శంఖాకార అడవి) పట్టీ ఎక్కువగా 50°N–70°N మధ్య ఉంటుంది.","III. టండ్రా ప్రాంతాల్లో విస్తారంగా ఎత్తైన చెట్లు ఉంటాయి.","IV. సవన్నా వాతావరణంలో స్పష్టమైన తడి, పొడి కాలాలు ఉంటాయి.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I, II and IV","I, II మరియు IV"],["II and IV","II మరియు IV"],["I and II","I మరియు II"],["I and IV","I మరియు IV"]],"a":0,"xe":"Tundra has mosses, lichens and dwarf shrubs, no tall trees.","xt":"టండ్రాలో నాచులు, లైకెన్లు, పొట్టి పొదలు ఉంటాయి; ఎత్తైన చెట్లు ఉండవు."},{"n":31,"en":["Consider the following statements:","I. Average ocean salinity is about 35 parts per thousand.","II. Open-ocean salinity is highest around 20°–30° latitude.","III. The Baltic Sea has low salinity due to heavy river inflow and low evaporation.","IV. The Red Sea has low salinity because of heavy rainfall.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. సముద్ర సగటు లవణీయత వెయ్యికి సుమారు 35 భాగాలు.","II. బహిరంగ సముద్ర లవణీయత 20°–30° అక్షాంశాల వద్ద అత్యధికం.","III. నదుల నీరు అధికంగా చేరడం, తక్కువ బాష్పీభవనం వల్ల బాల్టిక్ సముద్రంలో లవణీయత తక్కువ.","IV. భారీ వర్షాల వల్ల ఎర్ర సముద్రంలో లవణీయత తక్కువ.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and II","I మరియు II"],["I and III","I మరియు III"],["II and III","II మరియు III"],["I, II and III","I, II మరియు III"]],"a":3,"xe":"The Red Sea is very salty (arid surroundings, high evaporation, few rivers).","xt":"ఎర్ర సముద్రం చాలా ఉప్పగా ఉంటుంది (శుష్క పరిసరాలు, అధిక బాష్పీభవనం, నదులు లేవు)."},{"n":32,"en":["Consider the following statements:","I. Cirques are formed by river erosion in deserts.","II. Fjords are glacial troughs submerged by the sea.","III. Eskers are ridges deposited by wind.","IV. A terminal moraine marks the farthest advance of a glacier.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. సర్కులు ఎడారుల్లో నది క్రమక్షయం వల్ల ఏర్పడతాయి.","II. ఫియార్డులు సముద్రంలో మునిగిన హిమానీ గర్తాలు.","III. ఎస్కర్లు గాలి నిక్షేపించిన గట్లు.","IV. అంత్య మొరైన్ హిమానీనదం చేరుకున్న చివరి హద్దును సూచిస్తుంది.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["Only III","III మాత్రమే"],["Only I","I మాత్రమే"],["I and III","I మరియు III"],["I, II and III","I, II మరియు III"]],"a":2,"xe":"Cirques are glacial hollows; eskers are laid down by meltwater streams under ice.","xt":"సర్కులు హిమానీ గుంతలు; ఎస్కర్లు మంచు కింద కరిగిన నీటి ప్రవాహాలు నిక్షేపించినవి."},{"n":33,"en":["Consider the following statements:","I. The Mohorovičić discontinuity separates the crust and the mantle.","II. The Gutenberg discontinuity separates the mantle and the outer core.","III. S-waves travel through the liquid outer core.","IV. The Lehmann discontinuity lies between the outer core and the inner core.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. మొహోరోవిచిచ్ విచ్ఛిన్నత భూపటలం, మాంటిల్ మధ్య ఉంటుంది.","II. గుటెన్‌బర్గ్ విచ్ఛిన్నత మాంటిల్, బాహ్య కేంద్రమండలం మధ్య ఉంటుంది.","III. S-తరంగాలు ద్రవ రూపంలోని బాహ్య కేంద్రమండలం గుండా ప్రయాణిస్తాయి.","IV. లేమాన్ విచ్ఛిన్నత బాహ్య, అంతర కేంద్రమండలాల మధ్య ఉంటుంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["II and IV","II మరియు IV"],["I, II and IV","I, II మరియు IV"],["I and II","I మరియు II"],["I and IV","I మరియు IV"]],"a":1,"xe":"S-waves cannot pass through liquids, which is the proof that the outer core is liquid.","xt":"S-తరంగాలు ద్రవాల గుండా వెళ్లలేవు; దీనివల్లే బాహ్య కేంద్రమండలం ద్రవమని తెలుస్తుంది."},{"n":34,"en":["Arrange the continents in descending order of area:"],"te":["ఖండాలను విస్తీర్ణం తగ్గే క్రమంలో అమర్చండి:"],"o":[["Asia – Africa – North America – South America","ఆసియా – ఆఫ్రికా – ఉత్తర అమెరికా – దక్షిణ అమెరికా"],["Asia – Africa – South America – North America","ఆసియా – ఆఫ్రికా – దక్షిణ అమెరికా – ఉత్తర అమెరికా"],["Asia – North America – Africa – South America","ఆసియా – ఉత్తర అమెరికా – ఆఫ్రికా – దక్షిణ అమెరికా"],["Africa – Asia – North America – South America","ఆఫ్రికా – ఆసియా – ఉత్తర అమెరికా – దక్షిణ అమెరికా"]],"a":0,"xe":"Asia 44.6, Africa 30.4, North America 24.7, South America 17.8 million sq km.","xt":"ఆసియా 44.6, ఆఫ్రికా 30.4, ఉత్తర అమెరికా 24.7, దక్షిణ అమెరికా 17.8 మిలియన్ చ.కి.మీ."},{"n":35,"en":["Consider the following statements:","I. The Earth's axis makes an angle of 66½° with the plane of its orbit.","II. Perihelion occurs around 3 January when the Earth is nearest to the Sun.","III. Aphelion occurs around 4 July when the Earth is farthest from the Sun.","IV. The Earth rotates from east to west.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. భూ అక్షం కక్ష్యా తలంతో 66½° కోణం చేస్తుంది.","II. భూమి సూర్యునికి అత్యంత సమీపంలో ఉండే పరిహేళి స్థితి సుమారు జనవరి 3న ఏర్పడుతుంది.","III. భూమి సూర్యునికి అత్యంత దూరంలో ఉండే అపహేళి స్థితి సుమారు జులై 4న ఏర్పడుతుంది.","IV. భూమి తూర్పు నుండి పడమరకు భ్రమణం చేస్తుంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and III","I మరియు III"],["II and III","II మరియు III"],["I and II","I మరియు II"],["I, II and III","I, II మరియు III"]],"a":3,"xe":"Rotation is west to east. Seasons arise from the tilt plus revolution; perihelion (3 Jan) and aphelion (4 Jul) are correct.","xt":"భ్రమణం పడమర నుండి తూర్పుకు. పరిహేళి (జనవరి 3), అపహేళి (జులై 4) సరైనవి; IV తప్పు."},{"n":36,"en":["Consider the following statements:","I. Shield volcanoes are steep-sided and highly explosive.","II. Composite volcanoes erupt alternate layers of lava and ash.","III. Calderas are formed when a volcano collapses after a violent eruption.","IV. The Deccan Traps were formed by fissure eruptions of basaltic lava.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. షీల్డ్ అగ్నిపర్వతాలు నిటారు వాలులు కలిగి అత్యంత పేలుడు స్వభావం కలవి.","II. సంయుక్త అగ్నిపర్వతాలు లావా, బూడిద పొరలను ప్రత్యామ్నాయంగా వెదజల్లుతాయి.","III. తీవ్ర విస్ఫోటనం తర్వాత అగ్నిపర్వతం కూలిపోవడం వల్ల కాల్డెరాలు ఏర్పడతాయి.","IV. దక్కన్ ట్రాప్స్ బసాల్ట్ లావా పగుళ్ల విస్ఫోటనాల వల్ల ఏర్పడ్డాయి.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["III and IV","III మరియు IV"],["II and III","II మరియు III"],["II, III and IV","II, III మరియు IV"],["II and IV","II మరియు IV"]],"a":2,"xe":"Shield volcanoes (Mauna Loa) have gentle slopes and quiet basaltic flows.","xt":"షీల్డ్ అగ్నిపర్వతాలు (మౌనా లోవా) సున్నిత వాలులతో నిశ్శబ్దంగా లావా వెదజల్లుతాయి."},{"n":37,"en":["Consider the following statements:","I. Coral polyps thrive in clear, warm, shallow waters.","II. The Great Barrier Reef lies off the coast of Queensland.","III. An atoll is a ring-shaped coral reef enclosing a lagoon.","IV. Corals grow best in muddy, low-salinity waters.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. పగడపు పాలిప్‌లు స్వచ్ఛమైన, వెచ్చని, లోతు తక్కువ నీటిలో వృద్ధి చెందుతాయి.","II. గ్రేట్ బారియర్ రీఫ్ క్వీన్స్‌ల్యాండ్ తీరంలో ఉంది.","III. అటోల్ అనేది మడుగును ఆవరించిన వలయాకార పగడపు దిబ్బ.","IV. పగడాలు బురద, తక్కువ లవణీయత నీటిలో బాగా పెరుగుతాయి.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and II","I మరియు II"],["I, II and III","I, II మరియు III"],["I and III","I మరియు III"],["II and III","II మరియు III"]],"a":1,"xe":"Mud and fresh water kill corals; they need clear saline water.","xt":"బురద, మంచినీరు పగడాలను చంపుతాయి; స్వచ్ఛమైన ఉప్పునీరు కావాలి."},{"n":38,"en":["Consider the following statements:","I. In a cold front, cold air pushes under warm air, giving short, heavy showers.","II. A warm front has a gentle slope and gives prolonged drizzle.","III. Temperate cyclones generally move from east to west.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. శీతల ఫ్రంట్‌లో చల్లని గాలి వెచ్చని గాలి కిందకు చొచ్చుకుపోయి స్వల్ప, భారీ వర్షాన్ని ఇస్తుంది.","II. వెచ్చని ఫ్రంట్ సున్నిత వాలుతో దీర్ఘకాల చినుకులు ఇస్తుంది.","III. సమశీతోష్ణ తుపానులు సాధారణంగా తూర్పు నుండి పడమరకు కదులుతాయి.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["Only III","III మాత్రమే"],["II and III","II మరియు III"],["I and III","I మరియు III"],["Only II","II మాత్రమే"]],"a":0,"xe":"Temperate cyclones move west to east with the westerlies.","xt":"సమశీతోష్ణ తుపానులు పశ్చిమ పవనాలతో పడమర నుండి తూర్పుకు కదులుతాయి."},{"n":39,"en":["Consider the following Assertion (A) and Reason (R) and choose the correct code:","Assertion (A): The Pacific Ocean contains the deepest point of the oceans.","Reason (R): The Mariana Trench lies in the Atlantic Ocean."],"te":["కింది ధృవీకరణ (A), కారణం (R) లను పరిగణించి సరైన కోడ్‌ను ఎంచుకోండి:","ధృవీకరణ (A): సముద్రాల్లో అత్యంత లోతైన బిందువు పసిఫిక్ మహాసముద్రంలో ఉంది.","కారణం (R): మారియానా కందకం అట్లాంటిక్ మహాసముద్రంలో ఉంది."],"o":[["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A), (R) రెండూ నిజం, (R) అనేది (A)కు సరైన వివరణ"],["Both (A) and (R) are true but (R) is not the correct explanation of (A)","(A), (R) రెండూ నిజం, కానీ (R) అనేది (A)కు సరైన వివరణ కాదు"],["(A) is true but (R) is false","(A) నిజం, కానీ (R) తప్పు"],["(A) is false but (R) is true","(A) తప్పు, కానీ (R) నిజం"]],"a":2,"xe":"(A) true: Challenger Deep in the Mariana Trench (Pacific). (R) false.","xt":"(A) నిజం: మారియానా కందకంలోని ఛాలెంజర్ డీప్ (పసిఫిక్). (R) తప్పు."},{"n":40,"en":["Match the ocean currents with their descriptions:","List-I (Current)","A. Humboldt","B. Gulf Stream","C. Benguela","D. Kuroshio","List-II (Description)","I. Warm current of the Pacific off Japan","II. Cold current off Peru and Chile","III. Cold current off Namibia and Angola","IV. Warm Atlantic current from the Florida Strait","Choose the correct answer using the codes given below:"],"te":["సముద్ర ప్రవాహాలను వాటి వివరణలతో జతపరచండి:","జాబితా-I (ప్రవాహం)","A. హంబోల్ట్","B. గల్ఫ్ స్ట్రీమ్","C. బెంగ్యులా","D. కురోషియో","జాబితా-II (వివరణ)","I. జపాన్ తీరంలోని పసిఫిక్ వెచ్చని ప్రవాహం","II. పెరూ, చిలీ తీరంలోని చల్లని ప్రవాహం","III. నమీబియా, అంగోలా తీరంలోని చల్లని ప్రవాహం","IV. ఫ్లోరిడా జలసంధి నుండి వచ్చే వెచ్చని అట్లాంటిక్ ప్రవాహం","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–II, B–I, C–III, D–IV","A–II, B–I, C–III, D–IV"],["A–I, B–IV, C–III, D–II","A–I, B–IV, C–III, D–II"],["A–II, B–IV, C–III, D–I","A–II, B–IV, C–III, D–I"],["A–II, B–III, C–IV, D–I","A–II, B–III, C–IV, D–I"]],"a":2,"xe":"Humboldt–Peru/Chile cold; Gulf Stream–Florida warm; Benguela–SW Africa cold; Kuroshio–Japan warm.","xt":"హంబోల్ట్–పెరూ/చిలీ చల్లని; గల్ఫ్ స్ట్రీమ్–ఫ్లోరిడా వెచ్చని; బెంగ్యులా–నైరుతి ఆఫ్రికా చల్లని; కురోషియో–జపాన్ వెచ్చని."},{"n":41,"en":["Consider the following statements:","I. The Prime Meridian passes through Greenwich.","II. Indian Standard Time is 5 hours 30 minutes ahead of GMT.","III. The International Date Line follows the 180° meridian exactly without any deviation.","IV. All parallels of latitude are equal in length.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. ప్రధాన రేఖాంశం గ్రీన్‌విచ్ గుండా వెళ్తుంది.","II. భారత ప్రామాణిక కాలం GMT కంటే 5 గంటల 30 నిమిషాలు ముందు ఉంటుంది.","III. అంతర్జాతీయ తేదీ రేఖ ఎలాంటి వంపులు లేకుండా సరిగ్గా 180° రేఖాంశం వెంట ఉంటుంది.","IV. అన్ని అక్షాంశాలు సమాన పొడవు కలిగి ఉంటాయి.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["I, III and IV","I, III మరియు IV"],["III and IV","III మరియు IV"],["II, III and IV","II, III మరియు IV"],["Only III","III మాత్రమే"]],"a":1,"xe":"IDL bends around Chukotka, Aleutians, Fiji, etc.; parallels shrink toward poles (Equator is the longest).","xt":"IDL తూర్పు రష్యా, ఫిజీ వంటి చోట్ల వంగుతుంది; అక్షాంశాలు ధ్రువాల వైపు చిన్నవవుతాయి (భూమధ్యరేఖ పొడవైనది)."},{"n":42,"en":["Consider the following statements:","I. Tropical cyclones need sea-surface temperature above about 26–27 °C.","II. The eye of a cyclone is the region of the most violent winds.","III. In the Southern Hemisphere cyclones circulate clockwise.","IV. Tropical cyclones of north-western Australia are called Willy-Willies.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. ఉష్ణమండల తుపానులకు సముద్ర ఉపరితల ఉష్ణోగ్రత సుమారు 26–27 °C కంటే ఎక్కువ ఉండాలి.","II. తుపాను కన్ను అత్యంత తీవ్ర పవనాల ప్రాంతం.","III. దక్షిణార్ధగోళంలో తుపానులు సవ్యదిశలో తిరుగుతాయి.","IV. వాయవ్య ఆస్ట్రేలియా ఉష్ణమండల తుపానులను విల్లీ–విల్లీలు అంటారు.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I, III and IV","I, III మరియు IV"],["III and IV","III మరియు IV"],["I and III","I మరియు III"],["I and IV","I మరియు IV"]],"a":0,"xe":"The eye is calm and clear; the eye wall has the fiercest winds.","xt":"కన్ను ప్రశాంతం, నిర్మలం; తీవ్ర పవనాలు కన్ను చుట్టూ ఉన్న గోడలో ఉంటాయి."},{"n":43,"en":["Arrange the following rivers in descending order of length:"],"te":["ఈ నదులను పొడవు తగ్గే క్రమంలో అమర్చండి:"],"o":[["Amazon – Nile – Yangtze – Mississippi–Missouri","అమెజాన్ – నైలు – యాంగ్జీ – మిసిసిపీ–మిస్సోరీ"],["Nile – Yangtze – Amazon – Mississippi–Missouri","నైలు – యాంగ్జీ – అమెజాన్ – మిసిసిపీ–మిస్సోరీ"],["Nile – Amazon – Mississippi–Missouri – Yangtze","నైలు – అమెజాన్ – మిసిసిపీ–మిస్సోరీ – యాంగ్జీ"],["Nile – Amazon – Yangtze – Mississippi–Missouri","నైలు – అమెజాన్ – యాంగ్జీ – మిసిసిపీ–మిస్సోరీ"]],"a":3,"xe":"Standard figures: Nile ~6,650 km, Amazon ~6,400, Yangtze ~6,300, Mississippi–Missouri ~6,275.","xt":"సాధారణ గణాంకాలు: నైలు ~6,650 కి.మీ., అమెజాన్ ~6,400, యాంగ్జీ ~6,300, మిసిసిపీ–మిస్సోరీ ~6,275."},{"n":44,"en":["Consider the following statements:","I. Spring tides occur at new moon and full moon.","II. Neap tides occur at new moon.","III. The Bay of Fundy is famous for the highest tidal range.","IV. Tides are higher when the Moon is at perigee.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. అమావాస్య, పౌర్ణమి రోజుల్లో బృహత్ (స్ప్రింగ్) పోటులు వస్తాయి.","II. అమావాస్య రోజున అల్ప (నీప్) పోటులు వస్తాయి.","III. బే ఆఫ్ ఫండీ అత్యధిక పోటు పరిధికి ప్రసిద్ధి.","IV. చంద్రుడు భూమికి దగ్గరగా (పెరిజీ) ఉన్నప్పుడు పోటులు ఎక్కువ.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and IV","I మరియు IV"],["III and IV","III మరియు IV"],["I, III and IV","I, III మరియు IV"],["I and III","I మరియు III"]],"a":2,"xe":"Neap tides occur at the quarter phases of the Moon.","xt":"అల్ప పోటులు చంద్రుని పాదకళల (క్వార్టర్) సమయంలో వస్తాయి."},{"n":45,"en":["Consider the following statements:","I. The epicentre lies on the surface directly above the focus.","II. The Richter scale is logarithmic.","III. Surface waves travel faster than P-waves.","IV. S-waves travel more slowly than P-waves and cannot pass through liquids.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. అధికేంద్రం కేంద్ర బిందువుకు నేరుగా పైన భూ ఉపరితలంపై ఉంటుంది.","II. రిక్టర్ స్కేలు లాగరిథమిక్.","III. ఉపరితల తరంగాలు P-తరంగాల కంటే వేగంగా ప్రయాణిస్తాయి.","IV. S-తరంగాలు P-తరంగాల కంటే నెమ్మదిగా ప్రయాణిస్తాయి, ద్రవాల గుండా వెళ్లలేవు.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["II and IV","II మరియు IV"],["I, II and IV","I, II మరియు IV"],["I and II","I మరియు II"],["I and IV","I మరియు IV"]],"a":1,"xe":"P-waves are the fastest and arrive first.","xt":"P-తరంగాలు వేగవంతమైనవి, మొదట చేరతాయి."},{"n":46,"en":["Match the local winds with their features:","List-I (Wind)","A. Loo","B. Chinook","C. Mistral","D. Harmattan","List-II (Feature)","I. Cold wind of the Rhône valley, France","II. Hot dry wind of the north Indian plains","III. Warm dry wind on the eastern slopes of the Rockies","IV. Dry dusty wind from the Sahara to the Gulf of Guinea","Choose the correct answer using the codes given below:"],"te":["స్థానిక పవనాలను వాటి లక్షణాలతో జతపరచండి:","జాబితా-I (పవనం)","A. లూ","B. చినూక్","C. మిస్ట్రాల్","D. హర్మట్టన్","జాబితా-II (లక్షణం)","I. ఫ్రాన్స్ రోన్ లోయ చల్లని పవనం","II. ఉత్తర భారత మైదానాల వేడి పొడి పవనం","III. రాకీల తూర్పు వాలులపై వెచ్చని పొడి పవనం","IV. సహారా నుండి గినియా సింధుశాఖ వైపు వీచే పొడి ధూళి పవనం","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–II, B–III, C–I, D–IV","A–II, B–III, C–I, D–IV"],["A–II, B–IV, C–I, D–III","A–II, B–IV, C–I, D–III"],["A–IV, B–III, C–I, D–II","A–IV, B–III, C–I, D–II"],["A–II, B–I, C–III, D–IV","A–II, B–I, C–III, D–IV"]],"a":0,"xe":"Loo–hot dry; Chinook–Rockies; Mistral–Rhône; Harmattan–Sahara to Guinea.","xt":"లూ–వేడి పొడి; చినూక్–రాకీలు; మిస్ట్రాల్–రోన్; హర్మట్టన్–సహారా నుండి గినియా."},{"n":47,"en":["Consider the following statements:","I. Jet streams are narrow bands of fast westerly winds in the upper troposphere.","II. The Tropical Easterly Jet is linked with the Indian summer monsoon.","III. Jet streams blow at an altitude of about 2–3 km.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. జెట్ స్ట్రీమ్‌లు ఎగువ ట్రోపోస్ఫియర్‌లోని వేగవంతమైన పశ్చిమ పవన పట్టీలు.","II. ఉష్ణమండల తూర్పు జెట్ భారత నైరుతి రుతుపవనాలతో ముడిపడి ఉంది.","III. జెట్ స్ట్రీమ్‌లు సుమారు 2–3 కి.మీ. ఎత్తులో వీస్తాయి.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["I and III","I మరియు III"],["II and III","II మరియు III"],["Only II","II మాత్రమే"],["Only III","III మాత్రమే"]],"a":3,"xe":"Jet streams occur at roughly 9–14 km.","xt":"జెట్ స్ట్రీమ్‌లు సుమారు 9–14 కి.మీ. ఎత్తులో ఉంటాయి."},{"n":48,"en":["Consider the following Assertion (A) and Reason (R) and choose the correct code:","Assertion (A): Most weather phenomena occur in the stratosphere.","Reason (R): The ozone layer is found in the stratosphere."],"te":["కింది ధృవీకరణ (A), కారణం (R) లను పరిగణించి సరైన కోడ్‌ను ఎంచుకోండి:","ధృవీకరణ (A): చాలా వాతావరణ విశేషాలు స్ట్రాటోస్ఫియర్‌లో జరుగుతాయి.","కారణం (R): ఓజోన్ పొర స్ట్రాటోస్ఫియర్‌లో ఉంది."],"o":[["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A), (R) రెండూ నిజం, (R) అనేది (A)కు సరైన వివరణ"],["Both (A) and (R) are true but (R) is not the correct explanation of (A)","(A), (R) రెండూ నిజం, కానీ (R) అనేది (A)కు సరైన వివరణ కాదు"],["(A) is true but (R) is false","(A) నిజం, కానీ (R) తప్పు"],["(A) is false but (R) is true","(A) తప్పు, కానీ (R) నిజం"]],"a":3,"xe":"(A) false: weather occurs in the troposphere. (R) true.","xt":"(A) తప్పు: వాతావరణం ట్రోపోస్ఫియర్‌లో. (R) నిజం."},{"n":49,"en":["Consider the following statements:","I. The Nile flows northwards into the Mediterranean Sea.","II. The Amazon carries the largest volume of water of any river.","III. The Volga flows into the Black Sea.","IV. The Rhine flows into the North Sea.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. నైలు నది ఉత్తరం వైపు ప్రవహించి మధ్యధరా సముద్రంలో కలుస్తుంది.","II. ప్రపంచ నదులన్నింటిలో అమెజాన్ అత్యధిక నీటి పరిమాణం తీసుకెళ్తుంది.","III. వోల్గా నది నల్ల సముద్రంలో కలుస్తుంది.","IV. రైన్ నది ఉత్తర సముద్రంలో కలుస్తుంది.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["I and III","I మరియు III"],["Only III","III మాత్రమే"],["II and III","II మరియు III"],["III and IV","III మరియు IV"]],"a":1,"xe":"The Volga empties into the Caspian Sea.","xt":"వోల్గా కాస్పియన్ సముద్రంలో కలుస్తుంది."},{"n":50,"en":["Consider the following statements:","I. The Mid-Atlantic Ridge is a convergent plate boundary.","II. The Himalayas are the result of continent–continent collision.","III. Japanese island arcs are associated with oceanic–oceanic convergence.","IV. The San Andreas Fault is a transform boundary.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. మధ్య అట్లాంటిక్ శ్రేణి ఒక అభిసరణ పలక సరిహద్దు.","II. హిమాలయాలు ఖండ–ఖండ ఢీకొనడం వల్ల ఏర్పడ్డాయి.","III. జపాన్ ద్వీప చాపాలు సముద్ర–సముద్ర అభిసరణతో ముడిపడి ఉన్నాయి.","IV. శాన్ ఆండ్రియాస్ చీలిక ఒక పరివర్తన (ట్రాన్స్‌ఫార్మ్) సరిహద్దు.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["II, III and IV","II, III మరియు IV"],["II and IV","II మరియు IV"],["III and IV","III మరియు IV"],["II and III","II మరియు III"]],"a":0,"xe":"The Mid-Atlantic Ridge is divergent (new crust forms).","xt":"మధ్య అట్లాంటిక్ శ్రేణి అపసరణ సరిహద్దు (కొత్త భూపటలం ఏర్పడుతుంది)."}]},"2":{"q":[{"n":1,"en":["Consider the following statements:","I. Madhya Pradesh has the largest forest area among Indian states.","II. The Sundarbans mangroves are located in the Mahanadi delta.","III. Sal is a characteristic tree of moist deciduous forests.","IV. Tropical thorn forests occur in low-rainfall regions such as Rajasthan and Gujarat.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. భారత రాష్ట్రాల్లో అత్యధిక అటవీ విస్తీర్ణం మధ్యప్రదేశ్‌కు ఉంది.","II. సుందర్‌బన్స్ మడ అడవులు మహానది డెల్టాలో ఉన్నాయి.","III. సాల్ తేమతో కూడిన ఆకురాల్చు అడవుల విలక్షణ వృక్షం.","IV. ఉష్ణమండల ముళ్ల అడవులు రాజస్థాన్, గుజరాత్ వంటి తక్కువ వర్ష ప్రాంతాల్లో ఉంటాయి.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and III","I మరియు III"],["I, III and IV","I, III మరియు IV"],["I and IV","I మరియు IV"],["III and IV","III మరియు IV"]],"a":1,"xe":"The Sundarbans lie in the Ganga–Brahmaputra delta (West Bengal and Bangladesh).","xt":"సుందర్‌బన్స్ గంగా–బ్రహ్మపుత్ర డెల్టాలో (పశ్చిమ బెంగాల్, బంగ్లాదేశ్) ఉన్నాయి."},{"n":2,"en":["Consider the following statements:","I. The Aravalli is among the oldest fold mountains of the world.","II. Guru Shikhar on Mount Abu is the highest peak of the Aravalli.","III. The Vindhyas lie to the south of the Narmada and Tapti rivers.","IV. Dhupgarh near Pachmarhi is the highest peak of the Satpura range.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. ఆరావళి ప్రపంచంలోని అతి పురాతన ముడత పర్వతాల్లో ఒకటి.","II. మౌంట్ అబూలోని గురుశిఖర్ ఆరావళిలో ఎత్తైన శిఖరం.","III. వింధ్య పర్వతాలు నర్మద, తపతి నదులకు దక్షిణాన ఉన్నాయి.","IV. పచ్‌మడి సమీపంలోని ధూప్‌గఢ్ సాత్పురా శ్రేణిలో ఎత్తైన శిఖరం.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I, II and IV","I, II మరియు IV"],["I and IV","I మరియు IV"],["II and IV","II మరియు IV"],["I and II","I మరియు II"]],"a":0,"xe":"The Vindhyas lie north of the Narmada; the Satpuras lie between the Narmada and Tapti.","xt":"వింధ్యాలు నర్మదకు ఉత్తరాన; సాత్పురాలు నర్మద, తపతి మధ్య ఉన్నాయి."},{"n":3,"en":["Match the peaks with their locations:","List-I (Peak)","A. Kanchenjunga","B. Nanda Devi","C. Anai Mudi","D. Doddabetta","List-II (Location)","I. Nilgiris, Tamil Nadu","II. Sikkim","III. Kerala (Anaimalai)","IV. Uttarakhand","Choose the correct answer using the codes given below:"],"te":["శిఖరాలను వాటి ప్రాంతాలతో జతపరచండి:","జాబితా-I (శిఖరం)","A. కాంచనగంగ","B. నందాదేవి","C. ఆనైముడి","D. దొడ్డబెట్ట","జాబితా-II (ప్రాంతం)","I. నీలగిరులు, తమిళనాడు","II. సిక్కిం","III. కేరళ (ఆనైమలై)","IV. ఉత్తరాఖండ్","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–III, B–IV, C–II, D–I","A–III, B–IV, C–II, D–I"],["A–II, B–I, C–III, D–IV","A–II, B–I, C–III, D–IV"],["A–I, B–IV, C–III, D–II","A–I, B–IV, C–III, D–II"],["A–II, B–IV, C–III, D–I","A–II, B–IV, C–III, D–I"]],"a":3,"xe":"Kanchenjunga–Sikkim; Nanda Devi–Uttarakhand; Anai Mudi–Kerala; Doddabetta–Nilgiris.","xt":"కాంచనగంగ–సిక్కిం; నందాదేవి–ఉత్తరాఖండ్; ఆనైముడి–కేరళ; దొడ్డబెట్ట–నీలగిరులు."},{"n":4,"en":["Consider the following statements:","I. The Disaster Management Act was enacted in 1995.","II. Seismic Zone V is the most earthquake-prone zone of India.","III. INCOIS, Hyderabad, issues tsunami warnings for the Indian Ocean.","IV. The Bay of Bengal experiences more cyclones than the Arabian Sea.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. విపత్తు నిర్వహణ చట్టం 1995లో చేయబడింది.","II. భూకంప జోన్ V భారతదేశంలో అత్యంత భూకంప ప్రమాద ప్రాంతం.","III. హైదరాబాద్‌లోని INCOIS హిందూ మహాసముద్రానికి సునామీ హెచ్చరికలు ఇస్తుంది.","IV. అరేబియా సముద్రం కంటే బంగాళాఖాతంలో ఎక్కువ తుపానులు ఏర్పడతాయి.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["II and III","II మరియు III"],["II and IV","II మరియు IV"],["II, III and IV","II, III మరియు IV"],["III and IV","III మరియు IV"]],"a":2,"xe":"The Disaster Management Act was enacted in 2005 (NDMA, chaired by the Prime Minister).","xt":"విపత్తు నిర్వహణ చట్టం 2005లో వచ్చింది (NDMA, ప్రధాని అధ్యక్షుడు)."},{"n":5,"en":["Consider the following statements:","I. The Godavari rises near Trimbakeshwar in Nashik district.","II. The Krishna rises near Mahabaleshwar.","III. The Kaveri rises at Talakaveri in the Brahmagiri range in Karnataka.","IV. The Tapti rises at Amarkantak.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. గోదావరి నాసిక్ జిల్లాలోని త్రయంబకేశ్వర్ సమీపంలో పుడుతుంది.","II. కృష్ణా నది మహాబలేశ్వర్ సమీపంలో పుడుతుంది.","III. కావేరి కర్ణాటకలోని బ్రహ్మగిరి శ్రేణిలో తలకావేరి వద్ద పుడుతుంది.","IV. తపతి అమర్‌కంటక్ వద్ద పుడుతుంది.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["II and IV","II మరియు IV"],["Only IV","IV మాత్రమే"],["III and IV","III మరియు IV"],["I and IV","I మరియు IV"]],"a":1,"xe":"The Tapti rises near Multai in Betul district; the Narmada rises at Amarkantak.","xt":"తపతి బేతుల్ జిల్లా ముల్తాయ్ వద్ద; నర్మద అమర్‌కంటక్ వద్ద పుడతాయి."},{"n":6,"en":["Match the rivers with their places of origin:","List-I (River)","A. Godavari","B. Krishna","C. Kaveri","D. Narmada","List-II (Origin)","I. Amarkantak","II. Mahabaleshwar","III. Talakaveri (Kodagu)","IV. Trimbakeshwar","Choose the correct answer using the codes given below:"],"te":["నదులను వాటి జన్మస్థలాలతో జతపరచండి:","జాబితా-I (నది)","A. గోదావరి","B. కృష్ణా","C. కావేరి","D. నర్మద","జాబితా-II (జన్మస్థలం)","I. అమర్‌కంటక్","II. మహాబలేశ్వర్","III. తలకావేరి (కొడగు)","IV. త్రయంబకేశ్వర్","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–IV, B–II, C–III, D–I","A–IV, B–II, C–III, D–I"],["A–IV, B–III, C–II, D–I","A–IV, B–III, C–II, D–I"],["A–II, B–IV, C–III, D–I","A–II, B–IV, C–III, D–I"],["A–IV, B–II, C–I, D–III","A–IV, B–II, C–I, D–III"]],"a":0,"xe":"Godavari–Trimbakeshwar; Krishna–Mahabaleshwar; Kaveri–Talakaveri; Narmada–Amarkantak.","xt":"గోదావరి–త్రయంబకేశ్వర్; కృష్ణా–మహాబలేశ్వర్; కావేరి–తలకావేరి; నర్మద–అమర్‌కంటక్."},{"n":7,"en":["Consider the following statements:","I. The Himadri is the northernmost, continuous Himalayan range with an average height of about 6,000 m.","II. The Himachal (Lesser Himalaya) lies north of the Himadri.","III. Duns such as Dehradun lie between the Lesser Himalaya and the Shiwaliks.","IV. Kanchenjunga, in Sikkim, is the highest peak lying entirely within India.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. హిమాద్రి ఉత్తరం వైపు నిరంతర హిమాలయ శ్రేణి, సగటు ఎత్తు సుమారు 6,000 మీ.","II. హిమాచల్ (లఘు హిమాలయాలు) హిమాద్రికి ఉత్తరాన ఉంది.","III. డెహ్రాడూన్ వంటి దూన్‌లు లఘు హిమాలయాలు, శివాలిక్‌ల మధ్య ఉన్నాయి.","IV. సిక్కింలోని కాంచనగంగ భారత్ పరిధిలో పూర్తిగా ఉన్న ఎత్తైన శిఖరం.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and III","I మరియు III"],["I and IV","I మరియు IV"],["III and IV","III మరియు IV"],["I, III and IV","I, III మరియు IV"]],"a":3,"xe":"The Himachal range lies south of the Himadri.","xt":"హిమాచల్ శ్రేణి హిమాద్రికి దక్షిణాన ఉంది."},{"n":8,"en":["Consider the following Assertion (A) and Reason (R) and choose the correct code:","Assertion (A): The windward slopes of the Western Ghats receive very heavy rainfall.","Reason (R): Moisture-laden south-west monsoon winds are forced to rise by the Ghats."],"te":["కింది ధృవీకరణ (A), కారణం (R) లను పరిగణించి సరైన కోడ్‌ను ఎంచుకోండి:","ధృవీకరణ (A): పశ్చిమ కనుమల పవనాభిముఖ వాలులు అత్యంత భారీ వర్షం పొందుతాయి.","కారణం (R): తేమ నిండిన నైరుతి రుతుపవనాలు కనుమల వల్ల పైకి ఎగబాకవలసి వస్తుంది."],"o":[["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A), (R) రెండూ నిజం, (R) అనేది (A)కు సరైన వివరణ"],["Both (A) and (R) are true but (R) is not the correct explanation of (A)","(A), (R) రెండూ నిజం, కానీ (R) అనేది (A)కు సరైన వివరణ కాదు"],["(A) is true but (R) is false","(A) నిజం, కానీ (R) తప్పు"],["(A) is false but (R) is true","(A) తప్పు, కానీ (R) నిజం"]],"a":0,"xe":"Orographic rainfall: R explains A.","xt":"ఓరోగ్రాఫిక్ వర్షం: R, Aను వివరిస్తుంది."},{"n":9,"en":["Consider the following statements:","I. Mawsynram in Meghalaya receives the highest average annual rainfall in India.","II. Western Rajasthan receives very low annual rainfall.","III. The leeward side of the Western Ghats lies in a rain shadow.","IV. The Aravalli range lies across the Arabian Sea branch and causes heavy rain in Rajasthan.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. మేఘాలయలోని మాసిన్‌రామ్ భారత్‌లో అత్యధిక సగటు వార్షిక వర్షం పొందుతుంది.","II. పశ్చిమ రాజస్థాన్‌లో వార్షిక వర్షం చాలా తక్కువ.","III. పశ్చిమ కనుమల పవనవిముఖ వైపు వర్షచ్ఛాయ ప్రాంతం.","IV. ఆరావళి అరేబియా సముద్ర శాఖకు అడ్డంగా ఉండి రాజస్థాన్‌లో భారీ వర్షం కలిగిస్తుంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["II and III","II మరియు III"],["I, II and III","I, II మరియు III"],["I and II","I మరియు II"],["I and III","I మరియు III"]],"a":1,"xe":"The Aravalli lies parallel to the Arabian Sea branch, so it does not block it; Rajasthan stays dry.","xt":"ఆరావళి అరేబియా శాఖకు సమాంతరంగా ఉండటంతో వర్షం ఇవ్వదు; రాజస్థాన్ పొడిగా ఉంటుంది."},{"n":10,"en":["Match the straits/channels with what they separate:","List-I (Strait / channel)","A. Palk Strait","B. Ten Degree Channel","C. Nine Degree Channel","D. Duncan Passage","List-II (Separates)","I. South Andaman and Little Andaman","II. India and Sri Lanka","III. Andaman and Nicobar","IV. Minicoy and the main Lakshadweep group","Choose the correct answer using the codes given below:"],"te":["జలసంధులు/ఛానళ్లను అవి వేరుచేసే వాటితో జతపరచండి:","జాబితా-I (జలసంధి / ఛానల్)","A. పాక్ జలసంధి","B. టెన్ డిగ్రీ ఛానల్","C. నైన్ డిగ్రీ ఛానల్","D. డంకన్ పాసేజ్","జాబితా-II (వేరుచేసేవి)","I. సౌత్ అండమాన్, లిటిల్ అండమాన్","II. భారత్, శ్రీలంక","III. అండమాన్, నికోబార్","IV. మినికాయ్, లక్షద్వీప్ ప్రధాన సమూహం","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–II, B–III, C–IV, D–I","A–II, B–III, C–IV, D–I"],["A–II, B–I, C–IV, D–III","A–II, B–I, C–IV, D–III"],["A–I, B–III, C–IV, D–II","A–I, B–III, C–IV, D–II"],["A–II, B–IV, C–III, D–I","A–II, B–IV, C–III, D–I"]],"a":0,"xe":"Palk–India/Sri Lanka; Ten Degree–Andaman/Nicobar; Nine Degree–Minicoy; Duncan–South/Little Andaman.","xt":"పాక్–భారత్/శ్రీలంక; టెన్ డిగ్రీ–అండమాన్/నికోబార్; నైన్ డిగ్రీ–మినికాయ్; డంకన్–సౌత్/లిటిల్ అండమాన్."},{"n":11,"en":["Consider the following statements:","I. Himalayan rivers are perennial.","II. Peninsular rivers are largely seasonal and rain-fed.","III. Peninsular rivers have broad, shallow valleys in mature stage.","IV. Peninsular rivers are in a youthful stage with long courses.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. హిమాలయ నదులు నిత్యవాహినులు.","II. ద్వీపకల్ప నదులు ఎక్కువగా వర్షాధార, రుతు సంబంధం.","III. ద్వీపకల్ప నదులు విశాలమైన, లోతు తక్కువ పరిణత లోయలు కలిగి ఉన్నాయి.","IV. ద్వీపకల్ప నదులు యవ్వన దశలో పొడవైన ప్రవాహాలు కలిగి ఉన్నాయి.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and III","I మరియు III"],["II and III","II మరియు III"],["I and II","I మరియు II"],["I, II and III","I, II మరియు III"]],"a":3,"xe":"Peninsular rivers are older, shorter, and in a mature stage.","xt":"ద్వీపకల్ప నదులు పాతవి, చిన్నవి, పరిణత దశలో ఉన్నాయి."},{"n":12,"en":["Consider the following statements:","I. The dendritic pattern is tree-like and forms on uniform rocks.","II. The trellis pattern forms in areas of folded rocks with parallel ridges.","III. In the radial pattern, rivers flow outward from a central high area, as around Amarkantak.","IV. The dendritic pattern develops where rivers radiate from a central dome.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. డెన్డ్రిటిక్ నమూనా చెట్టు కొమ్మల వలె ఉండి ఏకరూప శిలలపై ఏర్పడుతుంది.","II. ట్రెల్లిస్ నమూనా సమాంతర గట్లుగల ముడత శిలా ప్రాంతాల్లో ఏర్పడుతుంది.","III. రేడియల్ నమూనాలో నదులు కేంద్ర ఎత్తైన ప్రాంతం నుండి బయటకు ప్రవహిస్తాయి, ఉదా: అమర్‌కంటక్.","IV. కేంద్ర గుమ్మటం నుండి నదులు వ్యాపించే చోట డెన్డ్రిటిక్ నమూనా ఏర్పడుతుంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["II and III","II మరియు III"],["I and II","I మరియు II"],["I, II and III","I, II మరియు III"],["I and III","I మరియు III"]],"a":2,"xe":"Radiating drainage from a dome is the radial pattern.","xt":"గుమ్మటం నుండి వ్యాపించే నీటి పారుదల రేడియల్ నమూనా."},{"n":13,"en":["Consider the following statements:","I. Bhakra Dam is built on the Sutlej.","II. Sardar Sarovar Dam is built on the Tapti.","III. Tehri Dam is built on the Bhagirathi.","IV. Hirakud Dam is built on the Mahanadi.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. భాక్రా ఆనకట్ట సట్లెజ్ నదిపై నిర్మించబడింది.","II. సర్దార్ సరోవర్ ఆనకట్ట తపతిపై నిర్మించబడింది.","III. తెహ్రీ ఆనకట్ట భాగీరథిపై నిర్మించబడింది.","IV. హీరాకుడ్ ఆనకట్ట మహానదిపై నిర్మించబడింది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and III","I మరియు III"],["I, III and IV","I, III మరియు IV"],["I and IV","I మరియు IV"],["III and IV","III మరియు IV"]],"a":1,"xe":"Sardar Sarovar is on the Narmada.","xt":"సర్దార్ సరోవర్ నర్మదపై ఉంది."},{"n":14,"en":["Consider the following statements:","I. The Himalayas were formed by the collision of the Indian and Eurasian plates.","II. The Indus–Tsangpo Suture marks the plate junction.","III. The Himalayas are still rising.","IV. Peninsular India is geologically young and unstable.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. భారత, యురేషియా పలకల ఢీకొనడం వల్ల హిమాలయాలు ఏర్పడ్డాయి.","II. ఇండస్–త్సాంగ్పో సూచర్ పలకల కలయిక రేఖ.","III. హిమాలయాలు ఇంకా పైకి లేస్తున్నాయి.","IV. ద్వీపకల్ప భారతం భౌగోళికంగా యువ, అస్థిర భూభాగం.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["Only IV","IV మాత్రమే"],["II and IV","II మరియు IV"],["III and IV","III మరియు IV"],["I and IV","I మరియు IV"]],"a":0,"xe":"The Peninsula is among the oldest and most stable land blocks (part of Gondwana).","xt":"ద్వీపకల్పం అతి పురాతన, స్థిర భూభాగం (గోండ్వానా భాగం)."},{"n":15,"en":["Match the passes with their locations/routes:","List-I (Pass)","A. Nathu La","B. Shipki La","C. Zoji La","D. Lipulekh","List-II (Location / route)","I. Kailash Mansarovar route, Uttarakhand","II. Sikkim–Tibet","III. Sutlej valley, Himachal–Tibet","IV. Srinagar–Leh road","Choose the correct answer using the codes given below:"],"te":["కనుమలను వాటి ప్రాంతాలు/మార్గాలతో జతపరచండి:","జాబితా-I (కనుమ)","A. నాథు లా","B. శిప్కి లా","C. జోజి లా","D. లిపులేఖ్","జాబితా-II (ప్రాంతం / మార్గం)","I. కైలాస మానస సరోవర మార్గం, ఉత్తరాఖండ్","II. సిక్కిం–టిబెట్","III. సట్లెజ్ లోయ, హిమాచల్–టిబెట్","IV. శ్రీనగర్–లేహ్ రహదారి","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–IV, B–III, C–II, D–I","A–IV, B–III, C–II, D–I"],["A–II, B–I, C–IV, D–III","A–II, B–I, C–IV, D–III"],["A–I, B–III, C–IV, D–II","A–I, B–III, C–IV, D–II"],["A–II, B–III, C–IV, D–I","A–II, B–III, C–IV, D–I"]],"a":3,"xe":"Nathu La–Sikkim; Shipki La–Himachal; Zoji La–Srinagar–Leh; Lipulekh–Uttarakhand.","xt":"నాథు లా–సిక్కిం; శిప్కి లా–హిమాచల్; జోజి లా–శ్రీనగర్–లేహ్; లిపులేఖ్–ఉత్తరాఖండ్."},{"n":16,"en":["Consider the following statements:","I. The Luni rises in the Aravalli near Ajmer.","II. The Luni ends in the Rann of Kutch.","III. The Ghaggar is an inland-drainage river.","IV. The Luni is a perennial river fed by glaciers.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. లూని అజ్మీర్ సమీపంలోని ఆరావళిలో పుడుతుంది.","II. లూని కచ్ రణ్‌లో అంతమవుతుంది.","III. ఘగ్గర్ అంతర్గత పారుదల నది.","IV. లూని హిమానీనదాల నీటితో ప్రవహించే నిత్యవాహిని.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and II","I మరియు II"],["I and III","I మరియు III"],["I, II and III","I, II మరియు III"],["II and III","II మరియు III"]],"a":2,"xe":"The Luni is seasonal and rain-fed.","xt":"లూని రుతు సంబంధ, వర్షాధార నది."},{"n":17,"en":["Consider the following Assertion (A) and Reason (R) and choose the correct code:","Assertion (A): Mangroves flourish in the deltas of India's east coast.","Reason (R): Deltas offer muddy, saline, tidal conditions suited to mangroves."],"te":["కింది ధృవీకరణ (A), కారణం (R) లను పరిగణించి సరైన కోడ్‌ను ఎంచుకోండి:","ధృవీకరణ (A): భారత తూర్పు తీర డెల్టాల్లో మడ అడవులు వృద్ధి చెందుతాయి.","కారణం (R): డెల్టాలు మడ అడవులకు అనుకూలమైన బురద, లవణ, పోటు పరిస్థితులు కల్పిస్తాయి."],"o":[["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A), (R) రెండూ నిజం, (R) అనేది (A)కు సరైన వివరణ"],["Both (A) and (R) are true but (R) is not the correct explanation of (A)","(A), (R) రెండూ నిజం, కానీ (R) అనేది (A)కు సరైన వివరణ కాదు"],["(A) is true but (R) is false","(A) నిజం, కానీ (R) తప్పు"],["(A) is false but (R) is true","(A) తప్పు, కానీ (R) నిజం"]],"a":0,"xe":"R explains A (Sundarbans, Bhitarkanika, Godavari–Krishna).","xt":"R, Aను వివరిస్తుంది (సుందర్‌బన్స్, భితర్కనిక, గోదావరి–కృష్ణా)."},{"n":18,"en":["Consider the following statements:","I. The Deccan Traps are basaltic lava flows from fissure eruptions at the end of the Cretaceous.","II. The Peninsular plateau slopes generally from west to east.","III. The Peninsular block was once part of the Gondwana landmass.","IV. The Rann of Kachchh is part of the Himalayan foredeep.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. దక్కన్ ట్రాప్స్ క్రెటేషియస్ చివరలో పగుళ్ల విస్ఫోటనాల బసాల్ట్ లావా ప్రవాహాలు.","II. ద్వీపకల్ప పీఠభూమి సాధారణంగా పశ్చిమం నుండి తూర్పుకు వాలుతుంది.","III. ద్వీపకల్ప భూభాగం ఒకప్పుడు గోండ్వానా భూభాగంలో భాగం.","IV. కచ్ రణ్ హిమాలయ పూర్వలోయలో భాగం.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I, II and III","I, II మరియు III"],["II and III","II మరియు III"],["I and II","I మరియు II"],["I and III","I మరియు III"]],"a":0,"xe":"The Rann of Kachchh is a salt marsh on the western edge of the Thar–Kachchh region, not a Himalayan foredeep.","xt":"కచ్ రణ్ ఉప్పు చిత్తడి ప్రాంతం; హిమాలయ పూర్వలోయ కాదు."},{"n":19,"en":["Consider the following statements:","I. The Sutlej enters India near Shipki La.","II. The Beas is a tributary of the Chenab.","III. The Chenab is formed by the confluence of the Chandra and Bhaga.","IV. The Jhelum rises from Verinag in Kashmir.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. సట్లెజ్ నది శిప్కి లా వద్ద భారత్‌లోకి ప్రవేశిస్తుంది.","II. బియాస్ నది చినాబ్ ఉపనది.","III. చంద్ర, భాగ నదుల సంగమంతో చినాబ్ ఏర్పడుతుంది.","IV. జీలం నది కశ్మీర్‌లోని వెరినాగ్ వద్ద పుడుతుంది.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and III","I మరియు III"],["I and IV","I మరియు IV"],["III and IV","III మరియు IV"],["I, III and IV","I, III మరియు IV"]],"a":3,"xe":"The Beas joins the Sutlej near Harike.","xt":"బియాస్ హరికే వద్ద సట్లెజ్‌లో కలుస్తుంది."},{"n":20,"en":["Match the protected areas with their notable species:","List-I (Protected area)","A. Dachigam","B. Silent Valley","C. Gir","D. Kaziranga","List-II (Species)","I. Asiatic lion","II. One-horned rhinoceros","III. Hangul (Kashmir stag)","IV. Lion-tailed macaque","Choose the correct answer using the codes given below:"],"te":["రక్షిత ప్రాంతాలను వాటి ప్రముఖ జాతులతో జతపరచండి:","జాబితా-I (రక్షిత ప్రాంతం)","A. దచిగామ్","B. సైలెంట్ వ్యాలీ","C. గిర్","D. కాజీరంగా","జాబితా-II (జాతి)","I. ఆసియా సింహం","II. ఒంటికొమ్ము ఖడ్గమృగం","III. హంగుల్ (కశ్మీర్ జింక)","IV. సింహపు తోక కోతి","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–III, B–IV, C–II, D–I","A–III, B–IV, C–II, D–I"],["A–I, B–IV, C–III, D–II","A–I, B–IV, C–III, D–II"],["A–III, B–IV, C–I, D–II","A–III, B–IV, C–I, D–II"],["A–III, B–II, C–I, D–IV","A–III, B–II, C–I, D–IV"]],"a":2,"xe":"Dachigam–Hangul; Silent Valley–lion-tailed macaque; Gir–Asiatic lion; Kaziranga–rhino.","xt":"దచిగామ్–హంగుల్; సైలెంట్ వ్యాలీ–సింహపు తోక కోతి; గిర్–ఆసియా సింహం; కాజీరంగా–ఖడ్గమృగం."},{"n":21,"en":["Consider the following statements:","I. India's coastline including islands is about 7,516 km.","II. Gujarat has the longest coastline among Indian states.","III. Nine Indian states have a sea coast.","IV. Tamil Nadu has the longest coastline in India.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. దీవులతో కలిపి భారత తీరరేఖ సుమారు 7,516 కి.మీ.","II. భారత రాష్ట్రాల్లో గుజరాత్‌కు అత్యంత పొడవైన తీరం ఉంది.","III. తొమ్మిది భారత రాష్ట్రాలకు సముద్ర తీరం ఉంది.","IV. భారతదేశంలో అత్యంత పొడవైన తీరం తమిళనాడుకు ఉంది.","పై ప్రకటనలలో ఏవి తప్పు?"],"o":[["III and IV","III మరియు IV"],["Only IV","IV మాత్రమే"],["I and IV","I మరియు IV"],["II and IV","II మరియు IV"]],"a":1,"xe":"Gujarat (about 1,600 km) is first; Andhra Pradesh is second (≈974 km).","xt":"గుజరాత్ (సుమారు 1,600 కి.మీ.) మొదటిది; ఆంధ్రప్రదేశ్ (≈974 కి.మీ.) రెండవది."},{"n":22,"en":["Match the soils with their features:","List-I (Soil)","A. Regur","B. Bhangar","C. Laterite","D. Peaty","List-II (Feature)","I. Formed by leaching under heavy rainfall","II. Self-ploughing, suited to cotton","III. Marshy, as in Kuttanad (Kerala)","IV. Older alluvium","Choose the correct answer using the codes given below:"],"te":["నేలలను వాటి లక్షణాలతో జతపరచండి:","జాబితా-I (నేల)","A. రేగడి","B. భాంగర్","C. లేటరైట్","D. పీటీ","జాబితా-II (లక్షణం)","I. భారీ వర్షంలో లీచింగ్ వల్ల ఏర్పడినది","II. స్వయం దున్నే స్వభావం, పత్తికి అనుకూలం","III. చిత్తడి, ఉదా: కుట్టనాడ్ (కేరళ)","IV. పాత ఒండ్రు నేల","కింది కోడ్‌లను ఉపయోగించి సరైన సమాధానాన్ని ఎంచుకోండి:"],"o":[["A–II, B–IV, C–I, D–III","A–II, B–IV, C–I, D–III"],["A–II, B–III, C–I, D–IV","A–II, B–III, C–I, D–IV"],["A–III, B–IV, C–I, D–II","A–III, B–IV, C–I, D–II"],["A–II, B–I, C–IV, D–III","A–II, B–I, C–IV, D–III"]],"a":0,"xe":"Regur–cotton; Bhangar–older alluvium; Laterite–leaching; Peaty–marshy Kerala.","xt":"రేగడి–పత్తి; భాంగర్–పాత ఒండ్రు; లేటరైట్–లీచింగ్; పీటీ–కేరళ చిత్తడి."},{"n":23,"en":["Consider the following Assertion (A) and Reason (R) and choose the correct code:","Assertion (A): The Western Ghats are true fold mountains like the Himalayas.","Reason (R): They are the faulted western edge of the Deccan plateau, forming an escarpment."],"te":["కింది ధృవీకరణ (A), కారణం (R) లను పరిగణించి సరైన కోడ్‌ను ఎంచుకోండి:","ధృవీకరణ (A): పశ్చిమ కనుమలు హిమాలయాల వలె నిజమైన ముడత పర్వతాలు.","కారణం (R): అవి దక్కన్ పీఠభూమి పశ్చిమ చీలిక అంచు, ఎగుడుదిగుడు ప్రాకారం."],"o":[["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A), (R) రెండూ నిజం, (R) అనేది (A)కు సరైన వివరణ"],["Both (A) and (R) are true but (R) is not the correct explanation of (A)","(A), (R) రెండూ నిజం, కానీ (R) అనేది (A)కు సరైన వివరణ కాదు"],["(A) is true but (R) is false","(A) నిజం, కానీ (R) తప్పు"],["(A) is false but (R) is true","(A) తప్పు, కానీ (R) నిజం"]],"a":3,"xe":"(A) false; (R) true.","xt":"(A) తప్పు; (R) నిజం."},{"n":24,"en":["Consider the following statements:","I. Devprayag is the confluence of the Bhagirathi and the Alaknanda.","II. The Yamuna originates from the Gangotri glacier.","III. The Son is a right-bank (southern) tributary of the Ganga.","IV. The Gandak, Ghaghara and Kosi are left-bank tributaries of the Ganga.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. భాగీరథి, అలకనంద సంగమం దేవప్రయాగ.","II. యమున గంగోత్రి హిమానీనదం నుండి పుడుతుంది.","III. సోన్ గంగకు కుడి ఒడ్డు (దక్షిణ) ఉపనది.","IV. గండక్, ఘాఘ్రా, కోసి గంగకు ఎడమ ఒడ్డు ఉపనదులు.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["III and IV","III మరియు IV"],["I and III","I మరియు III"],["I, III and IV","I, III మరియు IV"],["I and IV","I మరియు IV"]],"a":2,"xe":"The Yamuna rises from the Yamunotri glacier.","xt":"యమున యమునోత్రి హిమానీనదం నుండి పుడుతుంది."},{"n":25,"en":["Consider the following statements:","I. Black soils are rich in lime, iron and magnesium but poor in nitrogen and phosphorus.","II. Khadar is the older alluvium, rich in kankar nodules.","III. Red soils owe their colour to iron oxide.","IV. Laterite soils are suited to tea, coffee and cashew.","Which of the above statements is/are correct?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. నల్లరేగడి నేలల్లో సున్నం, ఇనుము, మెగ్నీషియం ఎక్కువ; నత్రజని, భాస్వరం తక్కువ.","II. ఖాదర్ కంకర బిళ్లలతో కూడిన పాత ఒండ్రు నేల.","III. ఎర్ర నేలల రంగుకు ఐరన్ ఆక్సైడ్ కారణం.","IV. లేటరైట్ నేలలు తేయాకు, కాఫీ, జీడిమామిడికి అనుకూలం.","పై ప్రకటనలలో ఏవి సరైనవి?"],"o":[["I and III","I మరియు III"],["I, III and IV","I, III మరియు IV"],["I and IV","I మరియు IV"],["III and IV","III మరియు IV"]],"a":1,"xe":"Bhangar is the older alluvium; Khadar is the newer, more fertile.","xt":"భాంగర్ పాత ఒండ్రు; ఖాదర్ కొత్త, సారవంతమైనది."},{"n":26,"en":["Consider the following Assertion (A) and Reason (R) and choose the correct code:","Assertion (A): The Himalayas act as a barrier to cold Central Asian winds.","Reason (R): Himalayan rivers are perennial."],"te":["కింది ధృవీకరణ (A), కారణం (R) లను పరిగణించి సరైన కోడ్‌ను ఎంచుకోండి:","ధృవీకరణ (A): హిమాలయాలు మధ్య ఆసియా చల్లని గాలులకు అడ్డుగోడగా పనిచేస్తాయి.","కారణం (R): హిమాలయ నదులు నిత్యవాహినులు."],"o":[["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A), (R) రెండూ నిజం, (R) అనేది (A)కు సరైన వివరణ"],["Both (A) and (R) are true but (R) is not the correct explanation of (A)","(A), (R) రెండూ నిజం, కానీ (R) అనేది (A)కు సరైన వివరణ కాదు"],["(A) is true but (R) is false","(A) నిజం, కానీ (R) తప్పు"],["(A) is false but (R) is true","(A) తప్పు, కానీ (R) నిజం"]],"a":1,"xe":"Both true; the perennial nature of rivers does not explain the barrier role.","xt":"రెండూ నిజం; నదుల నిత్యవాహిత్వం అడ్డుగోడ పాత్రను వివరించదు."},{"n":27,"en":["Consider the following statements:","I. The shifting of the ITCZ helps explain the Indian monsoon.","II. The Tropical Easterly Jet is associated with the summer monsoon.","III. El Niño years usually bring above-normal monsoon rainfall to India.","IV. A positive Indian Ocean Dipole generally favours the Indian monsoon.","Which of the above statements is/are incorrect?"],"te":["కింది ప్రకటనలను పరిగణించండి:","I. ITCZ స్థాన మా
