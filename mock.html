<style>
:root{--ink:#16324a;--paper:#f6f8f9;--card:#fff;--line:#d6dfe5;--muted:#52677a;--pasupu:#e3a400;--pasupu-soft:#fff3cf;--leaf:#1f7a55;--leaf-soft:#e3f3ea;--kumkum:#b3322b;--kumkum-soft:#fbe9e7;--chain:#2c6e8f;--chain-soft:#e6f1f6;--plum:#7a3b8f;--plum-soft:#f3e8f6;
  --f-display:"Anek Telugu","Noto Sans",sans-serif;--f-body:"Noto Sans","Noto Sans Telugu",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6eef4;--paper:#0f1a23;--card:#16242f;--line:#29404f;--muted:#9fb3c2;--pasupu:#f2bd2f;--pasupu-soft:#3a2f0e;--leaf:#4cc28c;--leaf-soft:#123326;--kumkum:#ef7a72;--kumkum-soft:#3a1c1a;--chain:#7cc3e0;--chain-soft:#14303d;--plum:#d59be6;--plum-soft:#2c1a33;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e6eef4;--paper:#0f1a23;--card:#16242f;--line:#29404f;--muted:#9fb3c2;--pasupu:#f2bd2f;--pasupu-soft:#3a2f0e;--leaf:#4cc28c;--leaf-soft:#123326;--kumkum:#ef7a72;--kumkum-soft:#3a1c1a;--chain:#7cc3e0;--chain-soft:#14303d;--plum:#d59be6;--plum-soft:#2c1a33;color-scheme:dark}
*{box-sizing:border-box}
html[lang="te"]{--f-body:"Noto Sans Telugu","Noto Sans",sans-serif}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
a{color:var(--chain)}button{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
nav{position:sticky;top:0;z-index:8;background:var(--card);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.brand b{color:var(--pasupu)}.brand img{width:32px;height:32px}.sp{flex:1}
.nl{font-size:.9rem;font-weight:600;text-decoration:none;color:var(--muted)}
.nshare{border:1px solid var(--line);background:var(--paper);border-radius:999px;min-width:38px;min-height:38px;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;font-weight:600;font-size:.88rem;padding:7px 12px;min-height:38px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hero{background:linear-gradient(135deg,#0f2f4f,#1d4f91 60%,#2c6e8f);color:#fff;padding:22px 0 20px}
.hero .eb{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.1;margin:4px 0 8px}
.hero p{margin:0;opacity:.92;font-size:.95rem}
.pat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.pat div{background:rgba(255,255,255,.12);border-radius:12px;padding:8px;text-align:center}
.pat b{display:block;font-family:var(--f-display);font-size:1.3rem;line-height:1.1}.pat small{font-size:.74rem;opacity:.9}
h2{font-family:var(--f-display);font-size:1.25rem;margin:20px 0 10px}
.mk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.mk h3{margin:0;font-family:var(--f-display);font-size:1.15rem}.mk .m{color:var(--muted);font-size:.85rem;margin:2px 0 10px}
.mk .st{font-size:.88rem;font-weight:700;margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.go{border:0;border-radius:999px;background:linear-gradient(135deg,#e3a400,#c98f00);color:#1b1500;font-weight:800;padding:10px 16px;min-height:44px;cursor:pointer}
.ln{border:1.5px solid var(--line);border-radius:999px;background:var(--card);font-weight:700;padding:9px 14px;min-height:44px;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.ln.sm{min-height:38px;padding:6px 12px;font-size:.88rem}
.secs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}.secs span{background:var(--chain-soft);color:var(--chain);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700}
.note{background:var(--pasupu-soft);border-radius:12px;padding:10px 12px;font-size:.9rem;margin:0 0 12px}
.ins{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0}
.ins ol{padding-left:20px;margin:8px 0 14px}.ins li{margin:5px 0}
/* exam */
.xbar{position:sticky;top:56px;z-index:7;background:var(--paper);padding:8px 0 6px;border-bottom:1px solid var(--line)}
.xtop{display:flex;align-items:center;gap:8px}
.tm{font-family:ui-monospace,monospace;font-weight:800;font-size:1.1rem;background:var(--ink);color:var(--paper);border-radius:10px;padding:5px 10px}
.tm.low{background:var(--kumkum);color:#fff}
.xtop .cnt{font-size:.82rem;color:var(--muted);font-weight:700;white-space:nowrap}
.stabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px}.stabs::-webkit-scrollbar{display:none}
.stabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:700;cursor:pointer;min-height:36px;white-space:nowrap}
.stabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.qq{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.qq .qn{display:flex;justify-content:space-between;gap:6px;font-size:.78rem;font-weight:700;color:var(--muted);margin:0 0 4px}
.qq .qt{margin:4px 0 6px;font-weight:600}
.qfig{margin:8px 0;color:var(--ink)}.qfig svg{max-width:100%;height:auto}
.ops{display:grid;gap:8px;margin-top:10px}
.ops button{display:flex;gap:10px;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;cursor:pointer;line-height:1.4;width:100%}
.ops button.sel{border-color:var(--chain);background:var(--chain-soft);font-weight:600}
.ops button.ok{border-color:var(--leaf);background:var(--leaf-soft)}.ops button.no{border-color:var(--kumkum);background:var(--kumkum-soft)}
.ops button:disabled{cursor:default}
.ops .tag{margin-left:auto;font-size:.74rem;font-weight:800;white-space:nowrap}
.why{margin:10px 0 0;font-size:.93rem;background:var(--chain-soft);border-radius:10px;padding:10px 12px}
.xnav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin:4px 0 12px}
.xnav .r{display:flex;gap:8px;flex-wrap:wrap}
.mkd{border-color:var(--plum)!important;color:var(--plum)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:8px 0 14px}
.pal button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;min-height:40px;font-weight:700;font-size:.85rem;cursor:pointer;position:relative}
.pal button.a{background:var(--leaf);border-color:var(--leaf);color:#fff}
.pal button.m{border-color:var(--plum);box-shadow:inset 0 0 0 2px var(--plum)}
.pal button.cur{outline:3px solid var(--pasupu);outline-offset:1px}
.pal button.ok{background:var(--leaf);border-color:var(--leaf);color:#fff}.pal button.no{background:var(--kumkum);border-color:var(--kumkum);color:#fff}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--muted)}.leg i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1.5px solid var(--line)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,20,30,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--card);width:100%;max-width:860px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.sheet h3{margin:0 0 6px;font-family:var(--f-display)}
/* result */
.res{background:linear-gradient(135deg,#0f2f4f,#1d4f91);color:#fff;border-radius:18px;padding:16px;margin:14px 0}
.res .big{font-family:var(--f-display);font-size:2.6rem;font-weight:800;line-height:1}
.res .sm{opacity:.9;font-size:.9rem}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.kp div{background:rgba(255,255,255,.13);border-radius:10px;padding:6px;text-align:center}.kp b{display:block;font-size:1.15rem}.kp small{font-size:.72rem;opacity:.9}
table.sec{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:.88rem}
table.sec th,table.sec td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}table.sec th:first-child,table.sec td:first-child{text-align:left}
table.sec th{background:var(--chain-soft);font-size:.78rem}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--leaf)}
.weak{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.weak li{margin:4px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:.84rem;font-weight:600;cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.empty{color:var(--muted);padding:16px 4px}
footer{color:var(--muted);font-size:.85rem;padding:20px 0 40px}
@media(max-width:430px){.xtop .aw{display:none}.xtop{gap:6px}nav .wrap{gap:6px}nav .seg button{padding:7px 8px;font-size:.82rem}nav .brand{font-size:1.02rem;gap:6px}nav .brand img{width:28px;height:28px}.pat{grid-template-columns:repeat(2,1fr)}.kp{grid-template-columns:repeat(2,1fr)}}
</style>

  h+='<div class="row" style="margin:14px 0"><a class="go" style="text-decoration:none;display:inline-flex;align-items:center" href="revise.html?tab=mis">'+x.fix+'</a><button type="button" class="ln" data-share data-url="mock.html" data-text-en="'+esc(M.kind==="ca"?T.en.shareC(r.net,M.qs.length,L2(M.title,"en")):T.en.shareT(r.net,M.n))+'" data-text-te="'+esc(M.kind==="ca"?T.te.shareC(r.net,M.qs.length,L2(M.title,"te")):T.te.shareT(r.net,M.n))+'">'+x.shareR+'</button><button type="button" class="ln" data-home="1">'+x.back+'</button></div>';
  h+='<h2>'+x.rev+'</h2><div class="chips">'+[["all",x.rvAll],["w",x.rvW],["s",x.rvS],["r",x.rvR]].map(function(f){return'<button type="button" class="chip" data-rv="'+f[0]+'" aria-pressed="'+(rvF===f[0])+'">'+f[1]+'</button>'}).join("")+'</div><div id="rvl">'+reviewList()+'</div></main>';
  $("app").innerHTML=h}
function reviewList(){var x=t(),out="";M.qs.forEach(function(q,i){var a=S.ans[i],st=a===undefined?"s":(a===q.a?"r":"w");if(rvF!=="all"&&rvF!==st)return;
  out+='<div class="qq"><div class="qn"><span>'+x.q+' '+(i+1)+'</span><span>'+(st==="r"?"✅":st==="w"?"❌":"⬜ "+x.notA)+'</span></div>'+SUL_q.stem(q,L,esc)+'<div class="ops">'+q.o.map(function(o,j){var cl=j===q.a?"ok":(j===a?"no":"");return'<button type="button" disabled'+(cl?' class="'+cl+'"':'')+'><b>('+"abcd"[j]+')</b><span>'+esc(L(o))+'</span>'+(j===q.a?'<span class="tag" style="color:var(--leaf)">✅ '+x.corr+'</span>':j===a?'<span class="tag" style="color:var(--kumkum)">❌ '+x.yours+'</span>':'')+'</button>'}).join("")+'</div><div class="why">💡 '+esc(L(q.why))+'</div></div>'});
  return out||'<p class="empty">—</p>'}
/* ---------- routing ---------- */
function chrome(){var x=t();document.documentElement.lang=med;$("foot").textContent=x.foot;document.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-m")===med)})}
/* ---------- leaderboard (Google Sheet web app; URL in mocks/lb.json) ---------- */
function dev(){return window.SUL_dev?SUL_dev.id():""}
function lbTable(d,full){var x=t();if(!d||!d.top||!d.top.length)return'<p style="margin:6px 0">'+x.lbNone+'</p>';
  var rows=full?d.top:d.top.slice(0,10);
  return'<p style="margin:0 0 6px;font-size:.85rem;color:var(--muted)">'+x.lbTop(d.n)+'</p><table class="sec"><tr><th>'+x.lbR+'</th><th style="text-align:left">'+x.lbN+'</th><th>'+x.lbS+'</th><th>'+x.lbT+'</th></tr>'+
    rows.map(function(z){return'<tr'+(z.me?' style="background:var(--pasupu-soft);font-weight:700"':'')+'><td>'+(z.r<4?["🥇","🥈","🥉"][z.r-1]:z.r)+'</td><td style="text-align:left">'+esc(z.name)+(z.place?'<br><small style="color:var(--muted)">'+esc(z.place)+'</small>':'')+'</td><td><b>'+z.score+'</b></td><td>'+z.mins+x.min+'</td></tr>'}).join("")+'</table>'+
    (d.you&&!rows.some(function(z){return z.me})?'<p style="margin:8px 0 0;font-weight:700">'+x.lbRank(d.you.r,d.n)+' · '+d.you.score+'</p>':'')}
function lbFetch(id,cb){fetch(LB+"?mock="+encodeURIComponent(id)+"&dev="+dev()).then(function(r){return r.json()}).then(cb).catch(function(){cb(null)})}
function lbBox(){var x=t();
  if(S.lb){setTimeout(function(){lbFetch(M.id,function(d){var b=$("lbbox");if(b&&d)b.innerHTML=(d.you?'<p style="margin:0 0 8px;font-weight:800;font-size:1.05rem">'+x.lbRank(d.you.r,d.n)+'</p>':'')+lbTable(d)+'<p style="margin:8px 0 0"><button type="button" class="ln sm" data-lb="'+M.id+'">'+x.lbAll+'</button></p>'})},0);return'<p>'+x.lbLoad+'</p>'}
  var note=S.mode==="prac"?x.lbPrac:(S.retake?x.lbRetake:"");
  if(S.mode==="prac"){setTimeout(function(){lbFetch(M.id,function(d){var b=$("lbbox");if(b)b.innerHTML='<p style="margin:0 0 8px">'+note+'</p>'+lbTable(d)})},0);return'<p>'+x.lbLoad+'</p>'}
  var nm="",pl="";try{nm=localStorage.getItem("sul_lb_name")||"";pl=localStorage.getItem("sul_lb_place")||""}catch(e){}
  return'<p style="margin:0 0 8px">'+x.lbP+'</p><div style="display:grid;gap:8px"><input id="lbn" maxlength="40" placeholder="'+x.lbName+'" value="'+esc(nm)+'" style="padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;min-height:46px"><input id="lbp" maxlength="40" placeholder="'+x.lbPlace+'" value="'+esc(pl)+'" style="padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;min-height:46px">'+
    '<label style="display:flex;gap:8px;align-items:flex-start;font-size:.88rem"><input type="checkbox" id="lbc" style="margin-top:4px;width:20px;height:20px"> <span>'+x.lbOk+'</span></label><button type="button" class="go" data-lbjoin="1">'+x.lbJoin+'</button><p id="lbm" style="margin:0;font-weight:700;color:var(--kumkum)"></p></div>'}
function lbJoin(){var x=t(),n=($("lbn").value||"").trim(),p=($("lbp").value||"").trim();if(n.length<2||!$("lbc").checked){$("lbm").textContent=x.lbNeed;return}
  try{localStorage.setItem("sul_lb_name",n);localStorage.setItem("sul_lb_place",p)}catch(e){}
  var btn=document.querySelector("[data-lbjoin]");btn.disabled=true;btn.textContent=x.lbSend;
  fetch(LB,{method:"POST",body:JSON.stringify({mock:M.id,name:n,place:p,dev:dev(),ans:S.ans,mins:Math.round(((S.end||Date.now())-S.start)/60000)})}).then(function(r){return r.json()}).then(function(d){
    if(d&&(d.ok||d.err==="dup")){S.lb=1;save();$("lbbox").innerHTML=(d.err==="dup"?'<p style="margin:0 0 8px;font-weight:700">'+x.lbDup+'</p>':'')+(d.you?'<p style="margin:0 0 8px;font-weight:800;font-size:1.05rem">'+x.lbRank(d.you.r,d.n)+'</p>':'')+lbTable(d)+'<p style="margin:8px 0 0"><button type="button" class="ln sm" data-lb="'+M.id+'">'+x.lbAll+'</button></p>';return}
    throw 0}).catch(function(){btn.disabled=false;btn.textContent=x.lbJoin;$("lbm").textContent=x.lbFail})}
function drawLb(id){var x=t(),m=IX.filter(function(z){return z.id===id})[0];
  $("app").innerHTML='<main class="wrap"><h2>'+x.lbH+' · '+esc(m?L(m.title):id)+'</h2><div class="weak" id="lbfull"><p>'+x.lbLoad+'</p></div><p class="row" style="margin:14px 0"><button type="button" class="ln" data-home="1">'+x.back+'</button></p></main>';
  lbFetch(id,function(d){var b=$("lbfull");if(b)b.innerHTML=d?lbTable(d,true):'<p>'+x.lbFail+'</p>'})}
function draw(){chrome();if(view==="list")drawList();else if(view==="ins")drawIns(S&&S.pend||"exam");else if(view==="exam")drawExam();else if(view==="res")drawRes();else if(view==="lb")drawLb(lbId)}
function open(id){return getJ("mocks/"+id+".json").then(function(j){M=j;return j})}
function go(v,id){var u=v==="list"?location.pathname:"?m="+id+(v==="res"?"&r=1":"");history.replaceState(null,"",u);view=v;draw();window.scrollTo({top:0})}
document.addEventListener("click",function(e){var b;
  if(b=e.target.closest(".seg button")){med=b.getAttribute("data-m");try{localStorage.setItem("sul_med",med);localStorage.setItem("sul_lang",med)}catch(x){}draw();return}
  if(e.target.closest("[data-home]")){M=null;S=null;go("list");return}
  if(b=e.target.closest("[data-new]")){var id=b.getAttribute("data-new"),mode=b.getAttribute("data-mode");open(id).then(function(){S={pend:mode};go("ins",id)});return}
  if(b=e.target.closest("[data-begin]")){var md=b.getAttribute("data-begin"),old=ls(key(M.id)),rt=!!(old&&(old.done||old.retake));S={mode:md,start:Date.now(),ans:{},mark:{},done:false,retake:rt};save();cur=0;go("exam",M.id);return}
  if(b=e.target.closest("[data-cont]")){open(b.getAttribute("data-cont")).then(function(){S=ls(key(M.id));cur=S.cur||0;go("exam",M.id)});return}
  if(b=e.target.closest("[data-res]")){open(b.getAttribute("data-res")).then(function(){S=ls(key(M.id));go("res",M.id)});return}
  if(view==="exam"&&S&&!S.done){
    if(b=e.target.closest("[data-op]")){var j=+b.getAttribute("data-op");if(S.mode==="prac"&&S.ans[cur]!==undefined)return;S.ans[cur]=j;S.cur=cur;
      if(S.mode==="prac"){var q=M.qs[cur];sulRev("g:"+M.id+":"+cur,j===q.a,j)}save();drawExam();return}
    if(e.target.closest("[data-clear]")){delete S.ans[cur];save();drawExam();return}
    if(e.target.closest("[data-mark]")){if(S.mark[cur])delete S.mark[cur];else S.mark[cur]=1;save();drawExam();return}
    if(b=e.target.closest("[data-step]")){cur=Math.min(M.qs.length-1,Math.max(0,cur+(+b.getAttribute("data-step"))));S.cur=cur;save();drawExam();window.scrollTo({top:0});return}
    if(b=e.target.closest("[data-go]")){cur=+b.getAttribute("data-go");S.cur=cur;save();closeSheet();drawExam();window.scrollTo({top:0});return}
    if(e.target.closest("[data-pal]")){palette();return}
    if(e.target.closest("[data-sub]")){confirmSub();return}
    if(e.target.closest("[data-yes]")){if(S.mode==="prac")S.logged=1;finish(false);return}
  }
  if(b=e.target.closest("[data-shclose]")){if(e.target===b||b.tagName==="BUTTON")closeSheet();return}
  if(b=e.target.closest("[data-lb]")){lbId=b.getAttribute("data-lb");view="lb";history.replaceState(null,"","?lb="+lbId);draw();window.scrollTo({top:0});return}
  if(e.target.closest("[data-lbjoin]")){lbJoin();return}
  if(b=e.target.closest("[data-rv]")){rvF=b.getAttribute("data-rv");document.querySelectorAll("[data-rv]").forEach(function(c){c.setAttribute("aria-pressed",c===b)});$("rvl").innerHTML=reviewList();return}
});
Promise.all([getJ("mocks/index.json"),getJ("syllabus/group2.json"),getJ("mocks/lb.json")]).then(function(r){IX=r[0]||[];LB=r[2]&&/^https:\/\/script\.google\.com\//.test(r[2].url||"")?r[2].url:null;
  if(r[1])r[1].stages.forEach(function(st){st.sec.forEach(function(se){se.u.forEach(function(u){u.t.forEach(function(tp){SYL[tp.id]={en:tp.en,te:tp.te}});SYL[u.id]=u.h})})});
  if(P.get("lb")&&LB){lbId=P.get("lb");view="lb";draw();return}
  var m=P.get("m");if(m){open(m).then(function(j){if(!j){view="list";draw();return}S=ls(key(m));if(S&&S.done){view="res"}else if(S&&S.mode){cur=S.cur||0;view="exam"}else{S={pend:"exam"};view="ins"}draw()})}else draw()});
})();
