*{box-sizing:border-box}

body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
a{color:var(--chain)}button{font:inherit;color:inherit}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}
nav{position:sticky;top:0;z-index:8;background:var(--card);border-bottom:1px solid var(--line)}

.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:10px 18px;min-height:44px;font-weight:700;cursor:pointer;text-decoration:none;line-height:1.2;text-align:center}

.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.wline{background:transparent;border:1.5px solid rgba(255,255,255,.6);color:#fff}
.btn.sm{min-height:38px;padding:7px 14px;font-size:.88rem}

.hero{background:radial-gradient(circle at 85% 10%,rgba(255,212,92,.25),transparent 45%),linear-gradient(135deg,#0f2740,#1d4a73 60%,#24557a);color:#fff;padding:26px 0 24px}
.hero .eb{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#ffd45c}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,6.5vw,2.8rem);line-height:1.08;margin:6px 0 8px}
.hero p{margin:0 0 14px;opacity:.92;max-width:60ch}
.hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 16px}
.hstats div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 6px;text-align:center}
.hstats b{display:block;font-family:var(--f-display);font-size:1.45rem;line-height:1.1;color:#ffd45c}
.hstats small{font-size:.74rem;opacity:.9;line-height:1.25;display:block}
@media(max-width:520px){.hstats{grid-template-columns:repeat(2,1fr)}}
.price{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;background:#fff;color:#16324a;border-radius:16px;padding:14px 16px}
.price .amt{font-family:var(--f-display);font-weight:800;font-size:2.2rem;line-height:1}
.price .amt s{font-size:1rem;color:#7a8b99;font-weight:600;margin-left:6px}
.price .amt small{display:block;font-family:var(--f-body);font-size:.78rem;font-weight:600;color:#52677a;margin-top:4px}
.price ul{margin:0;padding:0;list-style:none;font-size:.86rem;flex:1;min-width:200px}
.price li::before{content:"✓ ";color:#1f7a55;font-weight:800}
.okhero{display:flex;gap:10px;align-items:center;background:#e3f3ea;color:#1f7a55;border-radius:14px;padding:12px 14px;font-weight:700}
/* sections */
h2.sec{font-family:var(--f-display);font-size:1.5rem;margin:28px 0 4px;display:flex;align-items:center;gap:10px}
h2.sec::before{content:"";width:6px;height:26px;border-radius:3px;background:var(--pasupu)}
.sub{color:var(--muted);margin:0 0 12px;font-size:.95rem}
.free{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:720px){.free{grid-template-columns:1fr}}
.ft{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.ft::after{content:"FREE";position:absolute;top:12px;right:-30px;transform:rotate(35deg);background:#1f8f4e;color:#fff;font-weight:800;font-size:.7rem;letter-spacing:.08em;padding:3px 34px}
.ft .ic{font-size:2rem;line-height:1}
.ft h3{margin:0;font-family:var(--f-display);font-size:1.15rem;line-height:1.25;padding-right:24px}
.ft p{margin:0;color:var(--muted);font-size:.9rem;flex:1}
.ft .bt{display:flex;flex-wrap:wrap;gap:6px}
/* subject tiles */
.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:720px){.subjects{grid-template-columns:repeat(2,1fr)}}
.st{position:relative;text-align:left;border:2px solid transparent;border-radius:16px;padding:14px;color:#fff;background:var(--c);cursor:pointer;min-height:122px;display:flex;flex-direction:column;gap:4px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.st[aria-pressed="true"]{border-color:#ffd45c;box-shadow:0 0 0 3px rgba(255,212,92,.5)}
.st .ic{font-size:1.7rem;line-height:1}
.st b{font-family:var(--f-display);font-size:1.15rem;line-height:1.2}
.st small{font-size:.78rem;opacity:.92;line-height:1.3}
.st .bd{position:absolute;top:10px;right:10px;font-size:.68rem;font-weight:800;border-radius:999px;padding:2px 8px;background:rgba(255,255,255,.22)}
.st.soon{background:var(--card);color:var(--muted);border:2px dashed var(--line);cursor:default}
.st.soon .bd{background:var(--pasupu-soft);color:var(--lock)}
/* subject panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between;margin-bottom:6px}
.ph h3{margin:0;font-family:var(--f-display);font-size:1.4rem}
.ph .mk{font-size:.85rem;color:var(--muted)}
.covrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--chain-soft);border-radius:12px;padding:10px 12px;margin:10px 0 14px;font-size:.9rem}
.covrow b{color:var(--chain)}
.vols{display:grid;gap:10px}
.vol{display:flex;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper)}
.spine{flex:none;width:54px;border-radius:8px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;line-height:1;padding:8px 0;box-shadow:inset -6px 0 0 rgba(0,0,0,.12)}
.spine small{font-size:.62rem;font-weight:700;letter-spacing:.06em;opacity:.85}
.spine b{font-size:1.6rem}
.vol .tx{flex:1;min-width:0}
.vol .tx h4{margin:0 0 2px;font-size:1rem;line-height:1.3}
.vol .tx p{margin:0 0 8px;font-size:.86rem;color:var(--muted)}
.vol .tag{display:inline-block;font-size:.7rem;font-weight:800;border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:2px}
.tag.f{background:var(--leaf-soft);color:var(--leaf)}.tag.l{background:var(--pasupu-soft);color:var(--lock)}.tag.u{background:var(--leaf-soft);color:var(--leaf)}
.vol .bt{display:flex;flex-wrap:wrap;gap:6px}
.vol.soonv{opacity:.65}.vol.soonv .spine{background:var(--line);color:var(--muted)}
.tests{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
@media(max-width:600px){.tests{grid-template-columns:1fr}}
.tc{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper);display:flex;flex-direction:column;gap:6px}

.tc small{color:var(--muted);font-size:.82rem}
.tc .bt{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
h4.mini{margin:18px 0 8px;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.exi{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.exi{grid-template-columns:1fr}}
.ex1{position:relative;text-align:left;border:0;border-radius:16px;padding:14px 16px;color:#fff;cursor:pointer;display:flex;gap:12px;align-items:center;overflow:hidden;box-shadow:0 6px 16px rgba(12,34,56,.18)}
.ex1.g1{background:linear-gradient(135deg,#6a1b4d,#a2306b)}.ex1.g2{background:linear-gradient(135deg,#0d5c63,#178f8f)}
.ex1 .bdg{flex:none;width:58px;height:58px;border-radius:14px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;line-height:1}
.ex1 .bdg small{font-size:.6rem;letter-spacing:.06em;opacity:.9}.ex1 .bdg b{font-size:1.6rem}
.ex1 .tx{flex:1;min-width:0}.ex1 .tx b{display:block;font-family:var(--f-display);font-size:1.12rem;line-height:1.25}
.ex1 .tx small{display:block;font-size:.8rem;opacity:.92;line-height:1.35;margin-top:2px}
.ex1 .tx i{display:inline-block;font-style:normal;font-size:.72rem;font-weight:700;background:#ffd45c;color:#1b1500;border-radius:999px;padding:1px 8px;margin-top:6px}
.ex1 .go{flex:none;font-weight:800;font-size:1.3rem}

.vw{padding-top:14px}
.vh{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0 12px}
.vh h2{margin:0 0 4px;font-family:var(--f-display);font-size:1.4rem;line-height:1.2}
.vh p{margin:0;color:var(--muted);font-size:.9rem}
.kv{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:8px}
.kv th{width:36%;text-align:left;color:var(--muted);font-weight:600;padding:7px 10px 7px 0;vertical-align:top}
.kv td{padding:7px 0;vertical-align:top}.kv tr+tr>*{border-top:1px solid var(--line)}
.vsec{margin:16px 0 6px;font-size:.85rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pgs{display:grid;gap:10px}
.pgs img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.vdl{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);margin:16px -16px 0;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vdl b{width:100%;font-size:.85rem;color:var(--muted)}
/* cta */
.cta{margin:26px 0;background:linear-gradient(120deg,#16324a,#24557a);color:#fff;border-radius:18px;padding:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.cta h3{margin:0;font-family:var(--f-display);font-size:1.3rem}.cta p{margin:2px 0 0;opacity:.9;font-size:.92rem}

.tv{padding-top:14px}
.tinfo{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.tinfo h3{margin:0 0 4px;font-family:var(--f-display);font-size:1.25rem}
.tinfo p{margin:4px 0;color:var(--muted);font-size:.9rem}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mode button{border:1.5px solid var(--line);border-radius:10px;background:var(--paper);padding:8px 10px;font-weight:600;font-size:.86rem;line-height:1.35;cursor:pointer;min-height:44px;text-align:left}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;scroll-margin-top:80px}
.qn{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-bottom:4px}
.qb p{margin:4px 0}.qb p.li{padding-left:14px}
.ops{display:grid;gap:7px;margin-top:10px}
.ops button{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;cursor:pointer;line-height:1.4}

.ops button.sel{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,var(--paper))}

.ops button:disabled{cursor:default}
.ex{margin:10px 0 0;font-size:.92rem;border-radius:8px;padding:8px 12px;background:var(--chain-soft)}
.ex b.r{color:var(--leaf)}.ex b.w{color:var(--kumkum)}
.sbar{position:sticky;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);margin:0 -16px;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:600;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-family:var(--f-display);font-size:1.2rem}.timer.low{color:var(--kumkum)}
.result{background:var(--card);border:2px solid var(--leaf);border-radius:14px;padding:14px 16px;margin:0 0 14px;scroll-margin-top:80px}
.result h3{margin:0 0 6px;font-family:var(--f-display)}
.rg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.rg div{background:var(--paper);border-radius:10px;padding:8px 4px}.rg b{display:block;font-size:1.3rem;font-family:var(--f-display)}.rg small{font-size:.75rem;color:var(--muted)}
.lkcta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;background:var(--pasupu-soft);border-radius:12px;padding:12px;margin:0 0 14px}
.lkcta b{color:var(--lock)}
/* dialog */
dialog{border:0;border-radius:18px;padding:0;max-width:440px;width:calc(100% - 24px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,30,.55)}
.dh{background:linear-gradient(120deg,#16324a,#24557a);color:#fff;padding:16px 18px;position:relative}
.dh h3{margin:0;font-family:var(--f-display);font-size:1.3rem}.dh p{margin:4px 0 0;font-size:.88rem;opacity:.9}
.dh .x{position:absolute;right:10px;top:8px;background:transparent;border:0;color:#fff;font-size:1.6rem;cursor:pointer;min-width:44px;min-height:44px}
.dbody{padding:14px 18px 18px}
.step{display:flex;gap:12px;margin:0 0 16px}
.step .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);font-weight:800;display:flex;align-items:center;justify-content:center}
.step .c{flex:1;min-width:0}.step .c>b{display:block;margin-bottom:6px}
.upirow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:.9rem}
.upirow code{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.qr{width:132px;height:132px;image-rendering:pixelated;border:1px solid var(--line);border-radius:8px;margin-top:8px;background:#fff}
.codein{display:flex;gap:8px;margin-top:6px}
.codein input{flex:1;min-width:0;font:600 1.05rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);min-height:46px}
.msg{min-height:1.4em;margin:6px 0 0;font-size:.9rem;font-weight:600}.msg.err{color:var(--kumkum)}.msg.ok{color:var(--leaf)}
.small{font-size:.82rem;color:var(--muted)}
footer{color:var(--muted);font-size:.85rem;padding:20px 0 40px}
.load{padding:30px 0;color:var(--muted)}
</style>
</head>

    else{h+='<a class="btn line sm" href="'+v.sample[med]+'" target="_blank" rel="noopener">'+x.sample+'</a>';h+=LOCK?'<button class="btn ink sm" type="button" data-pdf="'+subj+'|vol|'+i+'">'+x.dl+'</button>':'<button class="btn gold sm" type="button" data-unlock="1">'+x.full+' · ₹499</button>'}
    h+='</div></div></div>';
  });
  (s.soon||[]).forEach(function(z){h+='<div class="vol soonv"><div class="spine"><small>'+x.vol+'</small><b>⏳</b></div><div class="tx"><h4>'+esc(L(z))+'</h4><p>'+x.soonT+' · '+x.inPack+'</p></div></div>'});
  h+='</div><h4 class="mini">'+x.testsH+'</h4><div class="tests">';
  s.tests.forEach(function(ts,i){
    h+='<div class="tc"><b>📝 '+esc(L(ts.title))+'</b><small>'+ts.n+' '+x.qn+' · '+(ts.free_all?'<span class="tag f">'+x.freeAll+'</span>':(LOCK?'<span class="tag u">'+x.open+'</span>':'<span class="tag l">'+x.free10+'</span>'))+'</small><div class="bt"><button class="btn ink sm" type="button" data-test="'+ts.id+'">▶ '+x.startT+'</button>';
    if(ts.free_all)h+='<a class="btn line sm" href="'+ts.pdf+'" download>⬇ PDF</a>';else if(LOCK)h+='<button class="btn line sm" type="button" data-pdf="'+subj+'|test|'+i+'">⬇ PDF</button>';
    h+='</div></div>';

}

/* ---------- test ---------- */
function curTest(){var r=null;D.subjects.forEach(function(s){s.tests.forEach(function(x){if(x.id===view)r=x})});return r}
function allQs(){var f=D.tests[view]||[];return LOCK&&LOCK.tests[view]?f.concat(LOCK.tests[view]):f}
var LI=/^([IVX]+\.|[A-D][.)]|\d{1,2}\.|\(\w\)|[ⅰ-ⅻ])\s/;
function qbody(q){var a=med==="te"?q.te:q.en;if(typeof a==="string")a=[a];return a.map(function(s,i){return'<p'+(i&&LI.test(s)?' class="li"':'')+'>'+esc(s)+'</p>'}).join("")}
function akey(){return"sul_pk_"+view+"_"+mode}
function loadAns(){ans={};submitted=false;left=0;try{var s=JSON.parse(ls(akey())||"null");if(s){ans=s.a||{};submitted=!!s.done;left=s.left||0}}catch(e){}if(mode==="exam"&&!left)left=curTest().n*60}
function saveAns(){ls(akey(),JSON.stringify({a:ans,done:submitted,left:left}))}
function qcard(q,i,n){
  var x=t(),a=ans[i],show=(mode==="practice"&&a!==undefined)||(mode==="exam"&&submitted);
  var h='<div class="qcard" id="q'+i+'"><div class="qn">'+x.q+' '+(i+1)+' / '+n+'</div><div class="qb">'+qbody(q)+'</div><div class="ops">'+q.o.map(function(o,j){var c="";if(show){if(j===q.a)c="ok";else if(j===a)c="no"}else if(a===j)c="sel";return'<button type="button" data-q="'+i+'" data-j="'+j+'"'+(c?' class="'+c+'"':"")+(show?" disabled":"")+'><b>('+"abcd"[j]+')</b><span>'+esc(med==="te"?o[1]:o[0])+'</span></button>'}).join("")+'</div>';
  if(show){var xp=med==="te"?q.xt:q.xe;h+='<p class="ex"><b class="'+(a===q.a?"r":"w")+'">'+(a===q.a?x.right:(a===undefined?"":x.wrong))+'</b> '+x.ans+': ('+"abcd"[q.a]+')'+(xp?' — '+esc(xp):'')+'</p>'}
  return h+'</div>';
}
function cnt(qs){var c=0,w=0;qs.forEach(function(q,i){var a=ans[i];if(a===undefined)return;if(a===q.a)c++;else w++});return{c:c,w:w,s:qs.length-c-w,m:Math.round((c-w/3)*100)/100}}
function drawTest(){
  var x=t(),ts=curTest(),qs=allQs(),h='<main class="wrap tv"><p><button class="btn line sm" type="button" id="back">'+x.back+'</button></p><div class="tinfo"><h3>'+esc(L(ts.title))+'</h3><p>'+ts.n+' '+x.qn+' · '+x.tinfo+'</p><div class="mode" role="group"><button type="button" data-mode="practice" aria-pressed="'+(mode==="practice")+'">'+x.practice+'</button><button type="button" data-mode="exam" aria-pressed="'+(mode==="exam")+'">'+x.exam+'</button></div></div>';
  if(mode==="exam"&&submitted){var k=cnt(qs);h+='<div class="result" id="res"><h3>'+x.resT+'</h3><div class="rg"><div><b>'+k.m+'</b><small>'+x.marks+' / '+qs.length+'</small></div><div><b style="color:var(--leaf)">'+k.c+'</b><small>'+x.correct+'</small></div><div><b style="color:var(--kumkum)">'+k.w+'</b><small>'+x.wrongs+'</small></div><div><b>'+k.s+'</b><small>'+x.skip+'</small></div></div><p style="margin:10px 0 0"><button class="btn line sm" type="button" data-retry="1">'+x.retry+'</button></p></div>'}
  h+=qs.map(function(q,i){return qcard(q,i,ts.n)}).join("");
  if(qs.length<ts.n)h+='<div class="lkcta"><span>'+x.lockQ(ts.n-qs.length)+'</span><button class="btn gold" type="button" data-unlock="1">'+x.unlock+'</button></div>';
  h+='<div class="sbar" id="sbar"></div></main>';
  $("app").innerHTML=h;bar();
}
function bar(){var b=$("sbar");if(!b)return;var x=t(),qs=allQs(),k=cnt(qs),a=k.c+k.w;
  if(mode==="practice")b.innerHTML='<span>'+x.attempted(a,qs.length)+'</span><span style="color:var(--leaf)">✓ '+k.c+'</span><span style="color:var(--kumkum)">✗ '+k.w+'</span><span>'+x.score+': '+k.m+'</span>';
  else if(submitted)b.innerHTML='<span>'+x.score+': '+k.m+' / '+qs.length+'</span><button class="btn line sm" type="button" data-retry="1">'+x.retry+'</button>';
  else{var m=Math.floor(left/60),s=left%60;b.innerHTML='<span class="timer'+(left<300?" low":"")+'">⏱ '+(m<10?"0":"")+m+":"+(s<10?"0":"")+s+'</span><span>'+x.attempted(a,qs.length)+'</span><button class="btn ink sm" type="button" id="submit">'+x.submit+'</button>'}}
function timer(){clearInterval(tid);if(!view||mode!=="exam"||submitted)return;tid=setInterval(function(){left--;if(left%10===0)saveAns();if(left<=0){left=0;doSubmit();return}bar()},1000)}
function doSubmit(){submitted=true;clearInterval(tid);saveAns();drawTest();var r=$("res");if(r)r.scrollIntoView({behavior:"smooth"})}

/* ---------- viewer ---------- */
var IMG=null,vview=null;
var FACTS={g1:[["Notification","నోటిఫికేషన్","No. 07/2026 (brief 15 Sep 2026; detailed 6 Oct 2026)","నం. 07/2026 (బ్రీఫ్ 15 సెప్టెంబర్ 2026; పూర్తి 6 అక్టోబర్ 2026)"],["Apply online","ఆన్‌లైన్ దరఖాస్తు","6 Oct – 27 Oct 2026, 11:59 PM","6 అక్టోబర్ – 27 అక్టోబర్ 2026, రాత్రి 11:59"],["Prelims (Screening Test)","ప్రిలిమ్స్ (స్క్రీనింగ్ టెస్ట్)","24 January 2027","24 జనవరి 2027"],["Paper I — General Studies","పేపర్ I — జనరల్ స్టడీస్","120 marks: History & Culture, Polity, Indian & AP Economy, Geography (30 each)","120 మార్కులు: చరిత్ర & సంస్కృతి, పాలిటీ, భారత & ఏపీ ఆర్థిక వ్యవస్థ, భూగోళం (ఒక్కోటి 30)"],["Paper II — General Aptitude","పేపర్ II — జనరల్ ఆప్టిట్యూడ్","120 marks: reasoning, maths, data interpretation, emotional & social intelligence","120 మార్కులు: రీజనింగ్, గణితం, డేటా ఇంటర్‌ప్రెటేషన్, భావోద్వేగ & సామాజిక ప్రజ్ఞ"],["Negative marking","నెగెటివ్ మార్కులు","1/3 mark per wrong answer, both papers","ప్రతి తప్పు జవాబుకు 1/3 మార్కు, రెండు పేపర్లలో"],["Qualification · Age","అర్హత · వయస్సు","Any degree · 18–44 years for most posts (SC/ST/BC/EWS +5)","ఏదైనా డిగ్రీ · చాలా పోస్టులకు 18–44 సంవత్సరాలు (SC/ST/BC/EWS +5)"]],
 g2:[["Notification","నోటిఫికేషన్","Brief Notification No. 37/2026, dated 13 Oct 2026","బ్రీఫ్ నోటిఫికేషన్ నం. 37/2026, తేదీ 13 అక్టోబర్ 2026"],["Apply online","ఆన్‌లైన్ దరఖాస్తు","10 Nov – 30 Nov 2026, 11:59 PM","10 నవంబర్ – 30 నవంబర్ 2026, రాత్రి 11:59"],["Detailed notification","పూర్తి నోటిఫికేషన్","On or before 10 Nov 2026 (age, community break-up)","10 నవంబర్ 2026 లోపు (వయస్సు, కమ్యూనిటీ వివరాలు)"],["Screening Test","స్క్రీనింగ్ టెస్ట్","Offline OMR · General Studies & Mental Ability · 150 questions, 150 marks, 150 minutes","ఆఫ్‌లైన్ OMR · జనరల్ స్టడీస్ & మెంటల్ ఎబిలిటీ · 150 ప్రశ్నలు, 150 మార్కులు, 150 నిమిషాలు"],["Mains","మెయిన్స్","Paper I: Social History of AP + Indian Constitution (150) · Paper II: Indian & AP Economy + Science & Technology (150)","పేపర్ I: ఏపీ సామాజిక చరిత్ర + భారత రాజ్యాంగం (150) · పేపర్ II: భారత & ఏపీ ఆర్థిక వ్యవస్థ + సైన్స్ & టెక్నాలజీ (150)"],["Interview","ఇంటర్వ్యూ","None — Mains 300 marks decides selection","లేదు — మెయిన్స్ 300 మార్కులే ఎంపికను నిర్ణయిస్తాయి"],["Qualification","అర్హత","Any degree for most posts (special degrees for ASO Finance/Law, Accountants)","చాలా పోస్టులకు ఏదైనా డిగ్రీ (ASO ఫైనాన్స్/లా, అకౌంటెంట్లకు ప్రత్యేక డిగ్రీలు)"]]};
function pgs(k){return'<div class="pgs">'+(IMG&&IMG[k]||[]).map(function(i,n){return'<a href="'+i[0]+'" target="_blank" rel="noopener"><img src="'+i[0]+'" width="'+i[1]+'" height="'+i[2]+'" alt="Page '+(n+1)+'" loading="lazy"></a>'}).join("")+'</div><p class="small" style="margin:6px 0 0">'+(med==="te"?"🔍 పెద్దగా చూడటానికి పేజీపై నొక్కండి":"🔍 Tap a page to open it full size and zoom")+'</p>'}
function drawViewer(){
  var x=t(),h='<main class="wrap vw"><p><button class="btn line sm" type="button" id="back">'+x.back+'</button></p>',dl="";
  if(vview==="g1"||vview==="g2"){
    var g=vview;h+='<div class="vh"><h2>'+x[g+"t"]+'</h2><p>'+x[g+"s"]+'</p><table class="kv">'+FACTS[g].map(function(r){return'<tr><th>'+esc(med==="te"?r[1]:r[0])+'</th><td>'+esc(med==="te"?r[3]:r[2])+'</td></tr>'}).join("")+'</table></div>';
    if(g==="g1"){h+='<div class="vsec">📘 '+x.psyl+'</div>'+pgs("g1-syl");dl='<a class="btn ink sm" href="Group1_Syllabus_07_2026.pdf" download>'+x.dlSyl+'</a>'}
    else{h+='<div class="vsec">📄 '+x.notif+'</div>'+pgs("g2-not")+'<div class="vsec">📘 '+x.psyl+'</div>'+pgs("g2-syl");dl='<a class="btn ink sm" href="Group2_Notification_37_2026.pdf" download>'+x.dlNot+'</a>'}
    dl+='<a class="btn line sm" href="https://psc.ap.gov.in" target="_blank" rel="noopener">'+x.site+'</a>';
  }else{
    var sid=vview.replace("cov-",""),s=D.subjects.filter(function(z){return z.id===sid})[0];
    h+='<div class="vh"><h2>🗺️ '+esc(x.covT(L(s.name)))+'</h2><p>'+x.covS+'</p></div>'+pgs(vview+"-"+med);
    dl='<a class="btn ink sm" href="'+s.coverage.en+'" download>⬇ English PDF</a><a class="btn ink sm" href="'+s.coverage.te+'" download>⬇ తెలుగు PDF</a>';
  }
  h+='<div class="vdl"><b>'+x.dlH+'</b>'+dl+'</div></main>';
  $("app").innerHTML=h;
}

/* ---------- routing ---------- */
function chrome(){document.documentElement.lang=med;$("foot").textContent=t().foot;$("nlM").textContent=t().monthly;document.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-m")===med)})}
function render(){chrome();if(!D)return;if(vview){clearInterval(tid);drawViewer()}else if(view){loadAns();drawTest();timer()}else{clearInterval(tid);drawCatalog()}}
function route(){var m=location.hash.match(/test=([\w-]+)/),v=location.hash.match(/view=([\w-]+)/);view=m?m[1]:null;if(view&&!curTest())view=null;vview=v&&/^(g1|g2|cov-geo|cov-his)$/.test(v[1])?v[1]:null;render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);

/* ---------- pdf ---------- */
function getPdf(spec,btn){
  var p=spec.split("|"),s=D.subjects.filter(function(z){return z.id===p[0]})[0],item=p[1]==="vol"?s.vols[+p[2]]:s.tests[+p[2]];
  var f=p[1]==="vol"?item.enc[med]:item.enc,name="Sulabham_"+(p[1]==="vol"?L(s.name).replace(/\W+/g,"_")+"_Vol"+item.n+"_"+med:item.id)+".pdf";
  btn.disabled=true;var old=btn.innerHTML;btn.textContent=t().dlg;
  fetch(f.file).then(function(r){return r.arrayBuffer()}).then(function(b){return dec(KEY,new Uint8Array(b))}).then(function(pdf){var u=URL.createObjectURL(new Blob([pdf],{type:"application/pdf"})),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},60000)}).catch(function(){alert("Download failed. Please try again.")}).then(function(){btn.disabled=false;btn.innerHTML=old});
}

/* ---------- dialog ---------- */
function openDlg(){var x=t();$("dlgT").textContent=x.dlgT;$("dlgS").textContent=x.dlgS;$("s1").textContent=x.s1;$("payBtn").textContent=x.pay;$("payBtn").href=D.upi;$("s1n").textContent=x.s1n;$("copyUpi").textContent=x.copy;$("qr").src=D.qr;$("s2").textContent=x.s2;$("s2n").textContent=x.s2n;$("s3").textContent=x.s3;$("unBtn").textContent=x.un;$("msg").textContent="";$("msg").className="msg";var d=$("dlg");if(d.showModal)d.showModal();else d.setAttribute("open","")}
$("dlgX").onclick=function(){$("dlg").close()};
$("copyUpi").onclick=function(){var b=this;try{navigator.clipboard.writeText("raghu.cse999@axl").then(function(){b.textContent=t().copied})}catch(e){prompt("UPI ID","raghu.cse999@axl")}};
$("codeForm").onsubmit=function(e){e.preventDefault();var c=$("codeIn").value;if(!norm(c))return;$("msg").className="msg";$("msg").textContent=t().checking;tryCode(c).then(function(ok){if(ok){$("msg").className="msg ok";$("msg").textContent=t().good;setTimeout(function(){$("dlg").close();render()},800)}else{$("msg").className="msg err";$("msg").textContent=t().bad}})};

document.addEventListener("click",function(e){var b;
  if(b=e.target.closest(".seg button[data-m]")){med=b.getAttribute("data-m");ls("sul_med",med);ls("sul_lang",med);render();return}
  if(b=e.target.closest("[data-unlock]")){openDlg();return}
  if(b=e.target.closest("[data-subj]")){subj=b.getAttribute("data-subj");document.querySelectorAll("[data-subj]").forEach(function(z){z.setAttribute("aria-pressed",z===b)});drawPanel();$("panelIn").scrollIntoView({behavior:"smooth",block:"start"});return}
  if(b=e.target.closest("[data-test]")){location.hash="test="+b.getAttribute("data-test");return}
  if(b=e.target.closest("[data-view]")){location.hash="view="+b.getAttribute("data-view");return}
  if(b=e.target.closest("#back")){history.pushState(null,"",location.pathname+location.search);route();return}
  if(b=e.target.closest("[data-pdf]")){getPdf(b.getAttribute("data-pdf"),b);return}
  if(b=e.target.closest("[data-mode]")){mode=b.getAttribute("data-mode");render();return}
  if(b=e.target.closest(".ops button")){var i=+b.getAttribute("data-q"),j=+b.getAttribute("data-j");if(mode==="practice"&&ans[i]!==undefined)return;if(mode==="exam"&&submitted)return;ans[i]=j;saveAns();var qs=allQs(),tmp=document.createElement("div");tmp.innerHTML=qcard(qs[i],i,curTest().n);$("q"+i).replaceWith(tmp.firstChild);bar();return}
  if(b=e.target.closest("#submit")){doSubmit();return}
  if(b=e.target.closest("[data-retry]")){ans={};submitted=false;left=curTest().n*60;saveAns();drawTest();timer();window.scrollTo(0,0);return}
});
chrome();
fetch("pk/view/index.json").then(function(r){return r.json()}).then(function(j){IMG=j;if(vview)render()}).catch(function(){});
fetch("pk/pack.json").then(function(r){return r.json()}).then(function(j){D=j;var c=P.get("code")||ls("sul_pack");if(P.get("code"))history.replaceState(null,"",location.pathname+location.hash);if(c)tryCode(c).then(function(ok){if(!ok)ls("sul_pack",null);route()});else route()});
})();
