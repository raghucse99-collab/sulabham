<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Current Affairs &amp; Quiz</title>
<meta name="description" content="Daily, weekly and monthly current affairs for APPSC Group 1 & 2 in easy Telugu and English — with daily quiz, weekly test and monthly test.">
<meta property="og:image" content="sulabham-logo.png">
<link rel="icon" type="image/svg+xml" href="sulabham-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Telugu:wght@500;700;800&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans:wght@400;600&display=swap">
<style>
:root{--ink:#16324a;--paper:#f6f8f9;--card:#fff;--line:#d6dfe5;--muted:#52677a;--pasupu:#e3a400;--pasupu-soft:#fff3cf;--leaf:#1f7a55;--leaf-soft:#e3f3ea;--kumkum:#b3322b;--chain:#2c6e8f;--chain-soft:#e6f1f6;--plum:#7a3b8f;--plum-soft:#f3e8f6;
  --f-display:"Anek Telugu","Noto Sans",sans-serif;--f-body:"Noto Sans","Noto Sans Telugu",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6eef4;--paper:#0f1a23;--card:#16242f;--line:#29404f;--muted:#9fb3c2;--pasupu:#f2bd2f;--pasupu-soft:#3a2f0e;--leaf:#4cc28c;--leaf-soft:#123326;--kumkum:#ef7a72;--chain:#7cc3e0;--chain-soft:#14303d;--plum:#d59be6;--plum-soft:#2c1a33;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e6eef4;--paper:#0f1a23;--card:#16242f;--line:#29404f;--muted:#9fb3c2;--pasupu:#f2bd2f;--pasupu-soft:#3a2f0e;--leaf:#4cc28c;--leaf-soft:#123326;--kumkum:#ef7a72;--chain:#7cc3e0;--chain-soft:#14303d;--plum:#d59be6;--plum-soft:#2c1a33;color-scheme:dark}
*{box-sizing:border-box}
html[lang="te"]{--f-body:"Noto Sans Telugu","Noto Sans",sans-serif}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
a{color:var(--chain)}
button{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
nav{position:sticky;top:0;z-index:8;background:var(--card);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.brand b{color:var(--pasupu)}.brand img{width:32px;height:32px}
.sp{flex:1}
.nl{font-size:.9rem;font-weight:600;text-decoration:none;color:var(--muted)}
@media(max-width:420px){.nl{display:none}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;font-weight:600;font-size:.88rem;padding:7px 12px;min-height:38px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
header{padding:20px 0 4px}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,6vw,2.5rem);line-height:1.1;margin:4px 0 6px}
.lede{color:var(--muted);margin:0}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1.1}
.stat small{color:var(--muted);font-size:.78rem;font-weight:600}
.stat.fire{background:linear-gradient(135deg,#fff3cf,#ffe08a);border-color:#e3a400;color:#3a2a00}
.stat.fire small{color:#6b5200}
/* main tabs */
.mt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 10px;position:sticky;top:56px;z-index:6;background:var(--paper);padding:8px 0}
.mt button{border:2px solid var(--line);border-radius:14px;background:var(--card);padding:9px 8px;cursor:pointer;min-height:54px;display:flex;flex-direction:column;align-items:center;gap:1px}
.mt button b{font-family:var(--f-display);font-size:1.02rem;line-height:1.2}
.mt button small{color:var(--muted);font-size:.74rem}
.mt button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mt button[aria-selected="true"] small{color:var(--paper);opacity:.85}
@media(max-width:420px){.mt button small{display:none}.mt button{min-height:46px}}
/* date strip */
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:4px -16px 10px;padding:2px 16px 6px}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;width:58px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:5px 0;cursor:pointer;text-align:center;line-height:1.15;position:relative}
.strip button small{display:block;font-size:.7rem;color:var(--muted);font-weight:600}
.strip button b{display:block;font-family:var(--f-display);font-size:1.25rem}
.strip button i{display:block;font-style:normal;font-size:.68rem;font-weight:700;color:var(--leaf);min-height:1em}
.strip button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.strip button[aria-pressed="true"] small,.strip button[aria-pressed="true"] i{color:var(--paper)}
.strip button.wk{width:auto;padding:6px 12px;text-align:left}
.strip button.wk b{font-size:1rem}
/* daily */
.dayh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:6px 0 10px}
.dayh h2{font-family:var(--f-display);font-size:1.35rem;margin:0}
.shr{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:#1f8f4e;color:#fff;font:600 .95rem var(--f-body);padding:9px 16px;min-height:42px;cursor:pointer}
.shrmsg{font-size:.85rem;color:var(--leaf);margin-left:8px}
.go{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:linear-gradient(135deg,#e3a400,#c98f00);color:#1b1500;font-weight:700;padding:9px 16px;min-height:42px;cursor:pointer;text-decoration:none}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px 4px}
.cats::-webkit-scrollbar{display:none}
.cats a{flex:0 0 auto;white-space:nowrap;text-decoration:none;font-size:.84rem;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 12px;scroll-margin-top:130px;overflow:hidden}
.it>summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.it>summary::-webkit-details-marker{display:none}
.it .em{font-size:1.5rem;line-height:1.2}
.it .ct{display:block;font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.it h3{margin:0;font-family:var(--f-display);font-size:1.15rem;line-height:1.25}
.it .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
.it[open] .chev{transform:rotate(180deg)}
.it .bd{padding:0 14px 14px}
.it ul.pts{margin:0;padding-left:20px}.it ul.pts li{margin:3px 0}
.ex{background:var(--leaf-soft);border-left:4px solid var(--leaf);border-radius:6px;padding:8px 12px;margin:10px 0 0;font-size:.95rem}
.ex b{color:var(--leaf)}
table.kv{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:10px}
table.kv th{width:36%;text-align:left;color:var(--muted);font-weight:600;padding:6px 10px 6px 0;vertical-align:top}
table.kv td{padding:6px 0;vertical-align:top}
table.kv tr+tr>*{border-top:1px solid var(--line)}
.refs{margin:10px 0 0;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.refs ul{margin:2px 0 0;padding-left:18px}.refs a{word-break:break-word}
/* pictures (same as Today page) */
.pic{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0 0;background:var(--paper)}
.pic .ph{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.tl{list-style:none;margin:0;padding:0 0 0 4px;position:relative}
.tl::before{content:"";position:absolute;left:61px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--chain);opacity:.35}
.tl li{display:flex;gap:14px;align-items:flex-start;padding:5px 0;position:relative}
.tl b{flex:0 0 44px;text-align:right;font-size:.9rem}
.tl li::after{content:"";position:absolute;left:56px;top:12px;width:13px;height:13px;border-radius:50%;background:var(--card);border:3px solid var(--chain)}
.tl span{padding-left:24px;font-size:.93rem}.tl li.hl span{font-weight:700}
.flow{display:flex;flex-wrap:wrap;gap:6px}
.flow .st{flex:1 1 120px;background:var(--card);border:2px solid var(--chain);border-radius:10px;padding:8px 10px;font-size:.9rem;text-align:center}
.flow .st i{font-style:normal;font-size:1.3rem;display:block}
.flow .ar{align-self:center;font-weight:700;color:var(--chain)}
@media(max-width:560px){.flow{flex-direction:column;gap:2px}.flow .st{flex:none;display:flex;gap:10px;align-items:center;text-align:left;padding:6px 10px}.flow .ar{transform:rotate(90deg);align-self:flex-start;margin-left:18px}}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp>div{background:var(--card);border-radius:10px;border-top:5px solid var(--chain);padding:8px 10px}.cmp>div+div{border-top-color:var(--pasupu)}
.cmp h5{margin:0 0 4px;font-size:.95rem}.cmp ul{margin:0;padding-left:18px;font-size:.88rem}
.dots .g{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:0 0 8px}.dots .d{width:20px;height:20px;border-radius:50%;background:var(--dc)}
.bars{display:grid;gap:7px}.bars .r{display:grid;grid-template-columns:minmax(80px,32%) 1fr;gap:8px;align-items:center;font-size:.88rem}
.bars .tr{background:var(--line);border-radius:6px;height:22px;position:relative;overflow:hidden}
.bars .fl{position:absolute;inset:0 auto 0 0;background:var(--chain);border-radius:6px}.bars .vv{position:absolute;right:6px;top:1px;font-weight:700;font-size:.82rem}
.pic .cap{margin:8px 0 0;font-size:.85rem;color:var(--muted)}
/* quiz */
.qhero{border-radius:16px;padding:16px;margin:18px 0 12px;color:#fff;scroll-margin-top:130px;background:radial-gradient(circle at 90% 10%,rgba(255,212,92,.35),transparent 45%),linear-gradient(135deg,#0c2238,#1f4f7c)}
.qhero.wk{background:radial-gradient(circle at 90% 10%,rgba(255,212,92,.35),transparent 45%),linear-gradient(135deg,#3b1d5e,#7a3b8f)}
.qhero h3{margin:0;font-family:var(--f-display);font-size:1.35rem}.qhero p{margin:4px 0 0;opacity:.9;font-size:.92rem}
.qq{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.qq .qn{font-size:.78rem;font-weight:800;color:var(--muted);letter-spacing:.05em}
.qq .qt{margin:4px 0 6px;font-weight:600}
.qq .ql p{margin:3px 0 3px 10px;font-size:.95rem;white-space:pre-wrap}
.qq .ops{display:grid;gap:7px;margin-top:10px}
.qq .ops button{display:flex;gap:10px;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px;cursor:pointer;line-height:1.4}
.qq .ops button.ok{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 14%,transparent)}
.qq .ops button.no{border-color:var(--kumkum);background:color-mix(in srgb,var(--kumkum) 12%,transparent)}
.qq .ops button:disabled{cursor:default}
.qq .why{margin:8px 0 0;font-size:.92rem;background:var(--chain-soft);border-radius:8px;padding:8px 10px}
.qbar{position:sticky;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);margin:0 -16px;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:700}
.qres{background:var(--card);border:2px solid var(--leaf);border-radius:16px;padding:16px;margin:0 0 14px;text-align:center}
.qres b.big{display:block;font-family:var(--f-display);font-size:2.4rem;color:var(--leaf);line-height:1.1}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center}
.acts a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;font-size:.88rem;border-radius:999px;padding:7px 14px;min-height:38px}
.a-wa{background:#1f8f4e;color:#fff}.a-tg{background:#2481cc;color:#fff}.a-ln{border:1px solid var(--line);color:var(--ink)}
/* weekly */
.grp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.grp h3{margin:0 0 6px;font-family:var(--f-display);font-size:1.1rem;display:flex;gap:8px;align-items:center}
.grp h3 i{font-style:normal;margin-left:auto;font-size:.8rem;color:var(--plum);background:var(--plum-soft);border-radius:999px;padding:1px 9px}
.grp ul{margin:0;padding-left:18px}.grp li{margin:5px 0}
.grp li small{display:block;color:var(--muted);font-size:.85rem}
.rev{background:var(--plum-soft);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.rev h3{margin:0 0 4px;font-family:var(--f-display);font-size:1.1rem;color:var(--plum)}
.rev ul{margin:0;padding-left:20px}
/* monthly */
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mc{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px}
.mc b{display:block;font-family:var(--f-display);font-size:1.15rem}
.mc small{display:block;color:var(--muted);font-size:.8rem}
.mc span{display:inline-block;margin-top:6px;font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--pasupu-soft);color:#8a5a00}
.soon{border:2px dashed var(--pasupu);border-radius:14px;padding:14px;margin:12px 0}
.soon h3{margin:0 0 4px;font-family:var(--f-display)}
.note{color:var(--muted);font-size:.9rem}
.join{background:var(--ink);color:var(--paper);border-radius:14px;padding:16px;margin:24px 0}
.join h3{font-family:var(--f-display);margin:0 0 4px;font-size:1.2rem}.join p{margin:0 0 8px;opacity:.9}
.join a{display:inline-flex;margin:4px 8px 0 0;padding:8px 16px;border-radius:999px;font-weight:600;text-decoration:none;min-height:40px;align-items:center}
footer{color:var(--muted);font-size:.85rem;padding:10px 0 40px}
.load{padding:30px 0;color:var(--muted)}
</style>
</head>

    var txt=med==="te"?"📰 *సులభం · నేటి కరెంట్ అఫైర్స్* | "+L(D.day)+"\nAPPSC గ్రూప్ 1 & 2కు ముఖ్యమైనవి\n\n"+hl+"\n\n1️⃣ ముందు చదవండి 👉 "+rl+"\n2️⃣ తర్వాత 10 ప్రశ్నల క్విజ్ రాయండి 👉 "+ql+"\n\n🆓 ఉచితం · తెలుగు + English":"📰 *Sulabham · Daily Current Affairs* | "+L(D.day)+"\nImportant for APPSC Group 1 & 2\n\n"+hl+"\n\n1️⃣ Read first 👉 "+rl+"\n2️⃣ Then take the 10-question quiz 👉 "+ql+"\n\n🆓 Free · Telugu + English";
    if(navigator.share){navigator.share({text:txt}).catch(function(){});return}
    var okm=function(){var m2=$("shareMsg");if(m2)m2.textContent=med==="te"?"కాపీ అయింది — వాట్సాప్/టెలిగ్రామ్‌లో పేస్ట్ చేయండి":"Copied — paste into WhatsApp/Telegram"};
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(okm,function(){prompt("Copy:",txt)});else prompt("Copy:",txt);return}
  var b=e.target.closest(".seg button");if(b){med=b.getAttribute("data-m");ls("sul_med",med);ls("sul_lang",med);draw();return}
  var tb=e.target.closest("[data-tab]");if(tb){tab=tb.getAttribute("data-tab");history.replaceState(null,"",tab==="day"?"?d="+day:"?tab="+tab);draw();window.scrollTo({top:0});return}
  var dy=e.target.closest("[data-day]");if(dy){day=dy.getAttribute("data-day");history.replaceState(null,"","?d="+day);drawDay();return}
  var wk=e.target.closest("[data-wk]");if(wk){wid=wk.getAttribute("data-wk");history.replaceState(null,"","?tab=week&w="+wid);drawWeek();return}
  var op=e.target.closest("[data-open]");if(op){e.preventDefault();var a=op.getAttribute("data-open").split("|");tab="day";day=a[0];history.replaceState(null,"","?d="+day+"#"+a[1]);chrome();D=null;drawDayThen(a[1]);return}
  var go=e.target.closest("[data-go]");if(go){e.preventDefault();var q=$("quiz");if(q)q.scrollIntoView({behavior:"smooth"});return}
  var jp=e.target.closest("[data-jump]");if(jp){e.preventDefault();var el=document.getElementById(jp.getAttribute("data-jump"));if(el){el.open=true;el.scrollIntoView({behavior:"smooth"})}return}
  var top=e.target.closest("[data-top]");if(top){e.preventDefault();window.scrollTo({top:0,behavior:"smooth"});return}
  var qb=e.target.closest("[data-qz]");if(qb){var i=+qb.getAttribute("data-qz");if(QA[i]!==undefined)return;QA[i]=+qb.getAttribute("data-j");qsave();var k=qcount(),N=qctx.qs.length;
    if(k.n===N){if(!qctx.week){markDone(qctx.date,k.c,N);stats()}var y=window.scrollY;draw();setTimeout(function(){stats();var r=$("qres");if(r)r.scrollIntoView({behavior:"smooth"})},60)}
    else{var tmp=document.createElement("div");tmp.innerHTML=qcard(qctx.qs[i],i);$("qz"+i).replaceWith(tmp.firstChild);$("qbar").children[0].textContent=t().qscore+": "+k.c+" / "+N;$("qbar").children[1].textContent=k.n+" / "+N}return}
  var rt=e.target.closest("[data-qretry]");if(rt){e.preventDefault();QA={};qsave();draw();setTimeout(function(){var q=$("quiz");if(q)q.scrollIntoView()},60);return}
});
