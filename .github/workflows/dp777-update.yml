name: DP 777 live and historical data refresh

on:
  workflow_dispatch:
  push:
    paths:
      - "dp777/scripts/**"
      - ".github/workflows/dp777-update.yml"
  schedule:
    # Refresh frequently; GitHub Actions schedule uses UTC and may be delayed.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: dp777-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      # Live results must refresh even if the separate historical-chart scraper fails.
      - name: Fetch current published live results
        run: python dp777/scripts/update_live_results.py
      - name: Fetch historical chart records
        continue-on-error: true
        run: python dp777/scripts/update_results.py
      - name: Merge refreshed data with latest branch and push
        shell: bash
        run: |
          cp dp777/data/results.json /tmp/dp777-generated.json
          cp dp777/data/latest_results.json /tmp/dp777-live-feed.json
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json
          from pathlib import Path

          current_path = Path("dp777/data/results.json")
          generated = json.loads(Path("/tmp/dp777-generated.json").read_text(encoding="utf-8"))
          live = json.loads(Path("/tmp/dp777-live-feed.json").read_text(encoding="utf-8"))
          current = {}
          if current_path.exists() and current_path.stat().st_size:
              try:
                  current = json.loads(current_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  current = {}
          current.setdefault("site", "DP 777")
          generated_charts = generated.get("charts", {})
          existing_charts = current.get("charts", {})
          # Always merge generated results with committed market files so a partial
          # scrape or empty results.json cannot erase saved historical rows.
          def merge_chart(old_chart, new_chart):
              old_chart = old_chart if isinstance(old_chart, dict) else {}
              new_chart = new_chart if isinstance(new_chart, dict) else {}
              from datetime import datetime, timedelta
              from zoneinfo import ZoneInfo
              today = datetime.now(ZoneInfo("Asia/Kolkata")).date()
              current_week_start = (today - timedelta(days=today.weekday())).isoformat()
              rows = []
              positions = {}
              def key(row):
                  import re
                  from datetime import datetime
                  value = str(row.get("date", ""))
                  m = re.search(r"(\d{1,2})[-/]([A-Za-z]{3}|\d{1,2})[-/](\d{2,4})", value)
                  if not m:
                      return value
                  a, b, year = m.groups()
                  try:
                      if b.isalpha():
                          dt = datetime.strptime(f"{a}-{b}-{year}", "%d-%b-%Y")
                      else:
                          dt = datetime.strptime(f"{a}-{b}-{year}", "%d-%m-%Y")
                      return dt.date().isoformat()
                  except ValueError:
                      return value
              fresh_rows = new_chart.get("rows", [])
              fresh_by_week = {key(row): row for row in fresh_rows}
              for row in old_chart.get("rows", []) + fresh_rows:
                  k = key(row)
                  if k not in positions:
                      positions[k] = len(rows)
                      rows.append(dict(row))
                  else:
                      target = rows[positions[k]]
                      fresh_current_week = (k == current_week_start and
                                            k in fresh_by_week and row is fresh_by_week[k])
                      if fresh_current_week and row.get("date"):
                          target["date"] = row["date"]
                      for field, value in row.items():
                          if field == "date":
                              continue
                          incoming = str(value or "").strip()
                          current_value = str(target.get(field, "") or "").strip()
                          is_missing = lambda v: not v or all(ch in "*★☆—- " for ch in v)
                          # For the current week, a successful chart scrape is authoritative:
                          # blank/star means not published and must clear stale saved values.
                          # For older weeks, preserve real saved history against partial scrapes.
                          if fresh_current_week:
                              target[field] = value
                          elif is_missing(current_value) and not is_missing(incoming):
                              target[field] = value
              result = dict(old_chart)
              result.update({k: v for k, v in new_chart.items() if k != "rows"})
              # Always show newest dated weeks first; sources may append old archive years after current rows.
              def sort_key(row):
                  value = key(row)
                  return value if re.fullmatch(r"\d{4}-\d{2}-\d{2}", value or "") else ""
              rows.sort(key=sort_key, reverse=True)
              result["rows"] = rows
              result["record_count"] = len(rows)
              if rows and new_chart.get("status") == "ok":
                  result["status"] = "ok"
                  result.pop("last_error", None)
              return result
          charts = {}
          chart_dir = Path("dp777/data/charts")
          for chart_id in set(existing_charts) | set(generated_charts):
              backup = {}
              backup_path = chart_dir / f"{chart_id}.json"
              if backup_path.exists():
                  try:
                      backup_payload = json.loads(backup_path.read_text(encoding="utf-8"))
                      backup = backup_payload.get("charts", {}).get(chart_id, backup_payload)
                  except (json.JSONDecodeError, OSError):
                      backup = {}
              charts[chart_id] = merge_chart(backup or existing_charts.get(chart_id, {}),
                                             generated_charts.get(chart_id, {}))
          current["charts"] = charts
          for key in ("updated_at", "updated_charts"):
              if key in generated:
                  current[key] = generated[key]
          current["latest_results"] = live.get("latest_results", {})
          for key in ("live_fetched_at", "live_source", "live_status"):
              if key in live:
                  current[key] = live[key]
          current_path.write_text(json.dumps(current, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          chart_dir = current_path.parent / "charts"
          chart_dir.mkdir(parents=True, exist_ok=True)
          for chart_id, chart in current.get("charts", {}).items():
              (chart_dir / f"{chart_id}.json").write_text(
                  json.dumps({"updated_at": current.get("updated_at"), "charts": {chart_id: chart}}, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8",
              )
          # Keep the compact browser feed aligned with the merged result.
          Path("dp777/data/latest_results.json").write_text(
              json.dumps(live, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dp777/data/results.json dp777/data/latest_results.json dp777/data/charts/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Refresh DP 777 live and historical results"
          git push origin main
