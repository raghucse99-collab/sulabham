name: DP 777 historical chart refresh

on:
  workflow_dispatch:
  push:
    paths:
      - "dp777/scripts/**"
      - ".github/workflows/dp777-update.yml"
  schedule:
    # Run hourly. GitHub Actions cron uses UTC.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: dp777-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Fetch latest published chart records
        run: python dp777/scripts/update_results.py
      - name: Merge refreshed data with latest branch and push
        shell: bash
        run: |
          cp dp777/data/results.json /tmp/dp777-generated.json
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          current_path = Path("dp777/data/results.json")
          generated = json.loads(Path("/tmp/dp777-generated.json").read_text(encoding="utf-8"))
          current = {}
          if current_path.exists() and current_path.stat().st_size:
              raw = current_path.read_text(encoding="utf-8").rstrip()
              if raw.endswith(chr(92) + "n"):
                  raw = raw[:-2]
              try:
                  current = json.loads(raw)
              except json.JSONDecodeError:
                  current = {}
          current.setdefault("site", "DP 777")
          current.setdefault("charts", {})
          current.setdefault("latest_results", {})
          if "historical" == "live":
              current["latest_results"] = generated.get("latest_results", current.get("latest_results", {}))
              for key in ("live_fetched_at", "live_source", "live_status"):
                  if key in generated:
                      current[key] = generated[key]
          else:
              current["charts"] = generated.get("charts", current.get("charts", {}))
              for key in ("updated_at", "updated_charts"):
                  if key in generated:
                      current[key] = generated[key]
          current_path.write_text(json.dumps(current, ensure_ascii=False, indent=2), encoding="utf-8")
          chart_dir = current_path.parent / "charts"
          chart_dir.mkdir(parents=True, exist_ok=True)
          for chart_id, chart in current.get("charts", {}).items():
              (chart_dir / f"{chart_id}.json").write_text(
                  json.dumps({"updated_at": current.get("updated_at"), "charts": {chart_id: chart}}, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8",
              )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dp777/data/results.json dp777/data/charts/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Refresh DP 777 historical charts"
          git push origin main
