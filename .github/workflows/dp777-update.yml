name: DP 777 historical chart refresh

on:
  workflow_dispatch:
  schedule:
    # Run hourly. GitHub Actions cron uses UTC.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: dp777-chart-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Fetch latest published chart records
        run: python dp777/scripts/update_results.py
      - name: Commit changed chart data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dp777/data/results.json
          if git diff --cached --quiet; then
            echo "No chart data changes."
          else
            git commit -m "Refresh DP 777 historical chart data"
            git push
          fi
