name: Telegram daily quiz
on:
  push:
    branches: [main]
    paths: ['days/20*.json', 'tools/telegram/post-now.txt']
  workflow_dispatch:
    inputs:
      date:
        description: 'Day to post (YYYY-MM-DD)'
        required: true
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Post quiz polls
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          QUIZ_LANG: ${{ vars.QUIZ_LANG }}
          BEFORE: ${{ github.event.before }}
          DAY: ${{ github.event.inputs.date }}
        run: |
          if [ -z "$TG_TOKEN" ]; then echo "TG_TOKEN secret not set - skipping"; exit 0; fi
          files=""
          if [ -n "$DAY" ]; then files="days/$DAY.json"
          else
            files=$(git diff --name-only --diff-filter=A "$BEFORE" HEAD -- 'days/20*.json' 2>/dev/null || true)
            if git diff --name-only "$BEFORE" HEAD -- tools/telegram/post-now.txt 2>/dev/null | grep -q .; then
              files="$files days/$(head -1 tools/telegram/post-now.txt | tr -d ' \r').json"; fi
          fi
          for f in $files; do python3 tools/telegram/post_quiz.py "$f" 2>&1 | sed "s/$TG_TOKEN/***/g" | tee -a tools/telegram/last_run.txt; test ${PIPESTATUS[0]} -eq 0; done
      - name: Save group id and run log
        if: always()
        run: |
          if [ -n "$(git status --porcelain tools/telegram/)" ]; then
            git config user.name "sulabham-bot"; git config user.email "actions@users.noreply.github.com"
            git add tools/telegram/; git commit -m "Telegram: run log"; git pull --rebase -q; git push; fi
