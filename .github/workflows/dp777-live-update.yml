name: DP 777 live result refresh

on:
  workflow_dispatch:
  push:
    paths:
      - "dp777/scripts/update_live_results.py"
      - ".github/workflows/dp777-live-update.yml"
  schedule:
    # Check the public result board every five minutes.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: dp777-live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Fetch current published results
        run: python dp777/scripts/update_live_results.py
      - name: Commit changed live results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dp777/data/results.json
          if git diff --cached --quiet; then
            echo "No live result changes."
          else
            git commit -m "Refresh DP 777 live results"
            git push
          fi
