name: DP 777 live result refresh

on:
  workflow_dispatch:
  push:
    paths:
      - "dp777/scripts/update_live_results.py"
      - "dp777/scripts/update_from_telegram.py"
      - ".github/workflows/dp777-live-update.yml"
  schedule:
    # Check the public result board every five minutes.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: dp777-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Fetch current published results
        run: python dp777/scripts/update_live_results.py
      - name: Supplement results from public Telegram channel
        run: python dp777/scripts/update_from_telegram.py
      - name: Merge refreshed data with latest branch and push
        shell: bash
        run: |
          cp dp777/data/results.json /tmp/dp777-generated.json
          cp dp777/data/latest_results.json /tmp/dp777-latest-results.json
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          current_path = Path("dp777/data/results.json")
          generated = json.loads(Path("/tmp/dp777-generated.json").read_text(encoding="utf-8"))
          current = {}
          if current_path.exists() and current_path.stat().st_size:
              raw = current_path.read_text(encoding="utf-8").rstrip()
              if raw.endswith(chr(92) + "n"):
                  raw = raw[:-2]
              try:
                  current = json.loads(raw)
              except json.JSONDecodeError:
                  current = {}
          current.setdefault("site", "DP 777")
          current.setdefault("charts", {})
          current.setdefault("latest_results", {})
          if "live" == "live":
              current["latest_results"] = generated.get("latest_results", current.get("latest_results", {}))
              for key in ("live_fetched_at", "live_source", "live_status"):
                  if key in generated:
                      current[key] = generated[key]
          else:
              current["charts"] = generated.get("charts", current.get("charts", {}))
              for key in ("updated_at", "updated_charts"):
                  if key in generated:
                      current[key] = generated[key]
          current_path.write_text(json.dumps(current, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/dp777-latest-results.json dp777/data/latest_results.json
          git add dp777/data/results.json dp777/data/latest_results.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Refresh DP 777 live results"
          git push origin main
