function errList(f){var E=ERR();return Object.keys(E).filter(function(id){var e=E[id];return f==="all"||(f==="fix"?!!e.f:!e.f)}).sort(function(a,b){return(E[b].l||"")>(E[a].l||"")?1:-1})}
/* ---------- question card (read-only, shows your pick) ---------- */
function qCard(id,i){var x=t(),q=Q[id],e=ERR()[id]||{};if(!q)return'<div class="qq"><p class="empty" style="padding:0">'+x.missing+'</p></div>';
  var h='<div class="qq"><div class="qn"><span>'+(i+1)+'</span><span>'+esc(L(q.lab))+'</span>'+(e.f?'<span class="fix">✓ '+x.fixed+' '+e.f+'</span>':'<span class="bad">'+x.times(e.n||1)+'</span>')+(e.d?'<span>'+x.first+' '+e.d+'</span>':'')+'</div>'+SUL_q.stem(q,L,esc);
  h+='<div class="ops">'+q.o.map(function(o,j){var c=j===q.a?"ok":(j===e.p?"no":"");return'<div'+(c?' class="'+c+'"':'')+'><b>('+"abcd"[j]+')</b><span>'+esc(L(o))+'</span>'+(j===q.a?'<span class="tag" style="color:var(--leaf)">✅ '+x.corr+'</span>':j===e.p?'<span class="tag" style="color:var(--kumkum)">❌ '+x.you+'</span>':'')+'</div>'}).join("")+'</div>';
  if(e.p===undefined&&e.old)h+='<p class="src">'+x.notRec+'</p>';
  h+='<div class="why"><b class="h">💡 '+x.why+'</b>'+esc(L(q.why))+'</div><p class="src"><a href="'+q.link+'">'+esc(L(q.lab))+' →</a></p></div>';return h}
/* ---------- quiz mode (re-test / recall) ---------- */
function startQuiz(ids,back){ids=ids.filter(function(id){return Q[id]});if(!ids.length)return;quiz={ids:ids,i:0,c:0,pick:null,back:back};draw();window.scrollTo({top:0})}
function drawQuiz(){var x=t(),z=quiz,h;
  if(z.i>=z.ids.length){h='<div class="done"><span class="big">'+x.res(z.c,z.ids.length)+'</span><p>'+x.resP(z.c,z.ids.length)+'</p><button type="button" class="go" data-back="1">'+x.again+'</button></div>';$("pane").innerHTML=h;return}
  var id=z.ids[z.i],q=Q[id],sh=z.pick!==null;
  h='<div class="qz"><b>'+x.qzT(z.i+1,z.ids.length)+' · ✅ '+z.c+'</b><button type="button" data-back="1">'+x.quit+'</button></div><div class="qq"><div class="qn"><span>'+esc(L(q.lab))+'</span></div>'+SUL_q.stem(q,L,esc);
  h+='<div class="ops">'+q.o.map(function(o,j){var c=sh?(j===q.a?"ok":(j===z.pick?"no":"")):"";return'<button type="button" data-pk="'+j+'"'+(c?' class="'+c+'"':'')+(sh?' disabled':'')+'><b>('+"abcd"[j]+')</b><span>'+esc(L(o))+'</span></button>'}).join("")+'</div>';
  if(sh)h+='<div class="why"><b class="h">'+(z.pick===q.a?x.ok:x.no)+' '+x.corr+': ('+"abcd"[q.a]+')</b>'+esc(L(q.why))+'</div><button type="button" class="go next" data-next="1">'+(z.i+1<z.ids.length?x.nextB:x.finish)+'</button>';
  $("pane").innerHTML=h+'</div>'}
/* ---------- Today I studied ---------- */
function drawDay(){var x=t(),G=LOG(),days=Object.keys(G).sort().reverse(),td=SUL_track.day(),yd=liso(-1);if(days.indexOf(td)<0)days.unshift(td);
  var lg=G[day]||{r:{},q:{}},refs=Object.keys(lg.r),qids=Object.keys(lg.q),ok=qids.filter(function(k){return lg.q[k][1]}).length,bad=qids.filter(function(k){return!lg.q[k][1]});
  var h='<div class="days">'+days.slice(0,10).map(function(d){return'<button type="button" class="chip" data-day="'+d+'" aria-pressed="'+(d===day)+'">'+(d===td?x.today:d===yd?x.yday:d.slice(8)+"/"+d.slice(5,7))+'</button>'}).join("")+'</div>';
  h+='<div class="sum"><div><b>'+refs.length+'</b><small>'+x.read+'</small></div><div class="g"><b>'+ok+'</b><small>'+x.right+'</small></div><div class="r"><b>'+bad.length+'</b><small>'+x.wrong+'</small></div></div>';
  var rec=recallIds(refs);
  if(refs.length||qids.length)h+='<div class="acts">'+(rec.length?'<button type="button" class="go" data-recall="1">'+x.recall+' ('+Math.min(15,rec.length)+')</button>':'')+(bad.length?'<button type="button" class="ln" data-fixday="1">'+x.fixT+' ('+bad.length+')</button>':'')+'<button type="button" class="ln" data-print="1">'+x.print+'</button></div>';
  if(!refs.length&&!qids.length)h+='<p class="empty">'+x.noDay+'</p>';
  var groups={t:[],c:[],v:[],a:[]};refs.forEach(function(r){var k=r.split(":")[0];(groups[k]||groups.a).push(r)});
  [["t",x.gT],["c",x.gC],["v",x.gV],["a",x.gA]].forEach(function(g){if(!groups[g[0]].length)return;h+='<h2 class="gh">'+g[1]+' · '+groups[g[0]].length+'</h2>';
    groups[g[0]].forEach(function(r){h+=readCard(r,lg.r[r])})});
  if(qids.length){h+='<h2 class="gh">'+x.gQ+' · '+x.qline(ok,qids.length)+'</h2>';
    h+=bad.map(function(id,i){return qCard(id,i)}).join("")}
  h+='<div class="how"><b>'+x.howH+'</b><ol>'+x.how.map(function(s){return"<li>"+s+"</li>"}).join("")+'</ol></div><p class="empty" style="font-size:.82rem">'+x.stored+'</p>';
  $("pane").innerHTML=h}
function readCard(ref,info){var x=t(),d=RD[ref],k=ref.split(":")[0];
  if(!d)return'<div class="rc k-'+k+'"><p class="meta">'+x.at+' '+esc(info.at)+'</p><h3>'+esc(info.t||ref)+'</h3>'+(info.u?'<a class="open" href="'+esc(info.u)+'">'+x.open+'</a>':'')+'</div>';
  var h='<div class="rc k-'+k+'"><p class="meta">'+x.at+' '+esc(info.at)+'</p><h3>'+esc(L(d.title))+'</h3>';
  if(d.line)h+='<p class="line">'+esc(L(d.line))+'</p>';
  if(d.pts&&d.pts.length)h+='<ul>'+d.pts.map(function(p){return"<li>"+esc(L(p))+"</li>"}).join("")+'</ul>';
  if(d.facts&&d.facts.length)h+='<table>'+d.facts.map(function(r){return"<tr><th>"+esc(L(r[0]))+"</th><td>"+esc(L(r[1]))+"</td></tr>"}).join("")+'</table>';
  if(d.tip)h+='<div class="box tip"><b>'+x.tip+':</b> '+esc(L(d.tip))+'</div>';
  if(d.trap)h+='<div class="box trap"><b>'+x.trap+':</b> '+esc(L(d.trap))+'</div>';
  return h+'<a class="open" href="'+d.link+'">'+x.open+'</a></div>'}
/* question ids that belong to the topics read (for the 🎯 recall test) */
var CADQ={};
function recallIds(refs){var out=[];refs.forEach(function(r){var p=r.split(":");
    if(p[0]==="t")out.push("dm:"+p[1]+":"+p[2]);
    if(p[0]==="v")for(var i=0;i<6;i++)out.push("v:"+p[1]+":"+i);
    if(p[0]==="c")(CADQ[p[1]]||[]).forEach(function(z,i){if(z===p[2])out.push("c:"+p[1]+":"+i)})});
  return out.filter(function(id){return Q[id]})}
function prepDay(){var lg=LOG()[day]||{r:{},q:{}},refs=Object.keys(lg.r),dates={};
  refs.forEach(function(r){var p=r.split(":");if(p[0]==="c")dates[p[1]]=1});
  return Promise.all(Object.keys(dates).map(function(d){return SUL_qsrc.getJ("cad/"+d+".json").then(function(j){CADQ[d]=j?(j.quiz||[]).map(function(q){return q.topic}):[]})})).then(function(){
    var ids=[];refs.forEach(function(r){var p=r.split(":");if(p[0]==="t")ids.push("dm:"+p[1]+":"+p[2]);if(p[0]==="v")for(var i=0;i<6;i++)ids.push("v:"+p[1]+":"+i);if(p[0]==="c")(CADQ[p[1]]||[]).forEach(function(z,i){if(z===p[2])ids.push("c:"+p[1]+":"+i)})});
    ids=ids.concat(Object.keys(lg.q));
    return Promise.all([SUL_qsrc.reads(refs.filter(function(r){return!RD[r]})),SUL_qsrc.questions(ids.filter(function(i){return!Q[i]}))])}).then(function(r){
    Object.keys(r[0]).forEach(function(k){RD[k]=r[0][k]});Object.keys(r[1]).forEach(function(k){Q[k]=r[1][k]})})}
/* ---------- My mistakes ---------- */
function drawMis(){var x=t(),A=errList(mf),todo=errList("not"),fx=errList("fix");
  var h='<div class="days">'+[["not",x.fNot+" · "+todo.length],["fix",x.fFix+" · "+fx.length],["all",x.fAll]].map(function(f){return'<button type="button" class="chip" data-mf="'+f[0]+'" aria-pressed="'+(mf===f[0])+'">'+f[1]+'</button>'}).join("")+'</div>';
  h+='<p class="lede" style="margin:0 0 10px">'+x.mP+'</p>';
  var avail=todo.filter(function(id){return Q[id]});
  if(avail.length)h+='<div class="acts"><button type="button" class="go" data-retest="1">'+x.retest(Math.min(20,avail.length))+'</button></div>';
  h+=A.length?A.map(qCard).join(""):'<p class="empty">'+x.none+'</p>';
  $("pane").innerHTML=h+'<p class="empty" style="font-size:.82rem">'+x.stored+'</p>'}
function prepMis(){var ids=errList("all").filter(function(i){return!Q[i]});return SUL_qsrc.questions(ids).then(function(r){Object.keys(r).forEach(function(k){Q[k]=r[k]})})}
/* ---------- page ---------- */
function chrome(){var x=t();document.documentElement.lang=med;["eb","h1","lede","foot"].forEach(function(k){$(k).textContent=x[k]});
  document.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-m")===med)});
  var lg=LOG()[SUL_track.day()],n=lg?Object.keys(lg.r).length:0,m=errList("not").length;
  $("tabs").innerHTML='<button type="button" role="tab" data-tab="day" aria-selected="'+(tab==="day")+'"><b>'+x.tT+'</b><small>'+x.tTs(n)+'</small></button><button type="button" role="tab" data-tab="mis" aria-selected="'+(tab==="mis")+'"'+(m?' class="hot"':'')+'><b>'+x.tM+'</b><small>'+x.tMs(m)+'</small></button>'}
function draw(){chrome();if(quiz)return drawQuiz();$("pane").innerHTML='<p class="empty">…</p>';
  (tab==="day"?prepDay():prepMis()).then(function(){if(quiz)return;tab==="day"?drawDay():drawMis()})}
function shuffle(a){for(var i=a.length-1;i>0;i--){var k=Math.floor(Math.random()*(i+1)),z=a[i];a[i]=a[k];a[k]=z}return a}
document.addEventListener("click",function(e){var b;
  if(b=e.target.closest(".seg button")){med=b.getAttribute("data-m");try{localStorage.setItem("sul_med",med);localStorage.setItem("sul_lang",med)}catch(x){}draw();return}
  if(b=e.target.closest("[data-tab]")){tab=b.getAttribute("data-tab");quiz=null;history.replaceState(null,"",tab==="mis"?"?tab=mis":location.pathname);draw();window.scrollTo({top:0});return}
  if(b=e.target.closest("[data-day]")){day=b.getAttribute("data-day");draw();return}
  if(b=e.target.closest("[data-mf]")){mf=b.getAttribute("data-mf");drawMis();return}
  if(e.target.closest("[data-print]")){window.print();return}
  if(e.target.closest("[data-retest]")){startQuiz(shuffle(errList("not").filter(function(i){return Q[i]})).slice(0,20));return}
  if(e.target.closest("[data-recall]")){var lg=LOG()[day]||{r:{}};startQuiz(shuffle(recallIds(Object.keys(lg.r))).slice(0,15));return}
  if(e.target.closest("[data-fixday]")){var g=LOG()[day]||{q:{}};startQuiz(Object.keys(g.q).filter(function(k){return!g.q[k][1]}));return}
  if(e.target.closest("[data-back]")){quiz=null;draw();window.scrollTo({top:0});return}
  if(b=e.target.closest("[data-pk]")){if(!quiz||quiz.pick!==null)return;var j=+b.getAttribute("data-pk"),id=quiz.ids[quiz.i],ok=j===Q[id].a;quiz.pick=j;if(ok)quiz.c++;sulRev(id,ok,j);drawQuiz();return}
  if(e.target.closest("[data-next]")){quiz.i++;quiz.pick=null;drawQuiz();window.scrollTo({top:0});return}
});
draw();
})();
</script>
