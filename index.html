<script>
/* Bridge: the old address forwards every visitor to the same page on sulabham.in and carries

(function(){
  var NEW="https://sulabham.in";
  var path=location.pathname.replace(/^\/sulabham(?=\/|$)/,"")||"/";
  var orig=location.hash.replace(/^#/,""),d={},n=0;
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);d[k]=localStorage.getItem(k);n++}}catch(e){}
  var frag=orig;
  if(n){var p="sulmig="+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(d)))));frag=p+(orig?"&h="+encodeURIComponent(orig):"")}
  location.replace(NEW+path+location.search+(frag?"#"+frag:""));
})();
</script></head>
