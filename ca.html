<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monthly Current Affairs</title>
<meta name="description" content="Monthly current affairs notes, APPSC Group 1 pattern mock tests and PDFs — Telugu and English. Free preview, full month ₹29.">
<meta property="og:image" content="sulabham-logo.png">
<link rel="icon" type="image/svg+xml" href="sulabham-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Telugu:wght@500;700;800&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans:wght@400;600&display=swap">
<style>
:root{--ink:#16324a;--paper:#f6f8f9;--card:#fff;--line:#d6dfe5;--muted:#52677a;--pasupu:#e3a400;--pasupu-soft:#fff3cf;--leaf:#1f7a55;--leaf-soft:#e3f3ea;--kumkum:#b3322b;--trap-soft:#fbe9e7;--chain:#2c6e8f;--chain-soft:#e6f1f6;--lock:#8a5a00;
  --f-display:"Anek Telugu","Noto Sans",sans-serif;--f-body:"Noto Sans","Noto Sans Telugu",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6eef4;--paper:#0f1a23;--card:#16242f;--line:#29404f;--muted:#9fb3c2;--pasupu:#f2bd2f;--pasupu-soft:#3a2f0e;--leaf:#4cc28c;--leaf-soft:#123326;--kumkum:#ef7a72;--trap-soft:#3a1d1b;--chain:#7cc3e0;--chain-soft:#14303d;--lock:#f2bd2f;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e6eef4;--paper:#0f1a23;--card:#16242f;--line:#29404f;--muted:#9fb3c2;--pasupu:#f2bd2f;--pasupu-soft:#3a2f0e;--leaf:#4cc28c;--leaf-soft:#123326;--kumkum:#ef7a72;--trap-soft:#3a1d1b;--chain:#7cc3e0;--chain-soft:#14303d;--lock:#f2bd2f;color-scheme:dark}
*{box-sizing:border-box}
html[lang="te"]{--f-body:"Noto Sans Telugu","Noto Sans",sans-serif}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
a{color:var(--chain)}
button{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
nav{position:sticky;top:0;z-index:8;background:var(--card);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.brand b{color:var(--pasupu)}.brand img{width:32px;height:32px}
.sp{flex:1}
.nl{font-size:.9rem;font-weight:600;text-decoration:none;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;font-weight:600;font-size:.88rem;padding:7px 12px;min-height:38px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
header{padding:22px 0 6px}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,6vw,2.5rem);line-height:1.1;margin:4px 0 6px}
.lede{color:var(--muted);margin:0}
/* month cards */
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
.mc{display:block;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;min-height:96px}
.mc[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--pasupu) 45%,transparent)}
.mc b{display:block;font-family:var(--f-display);font-size:1.15rem;line-height:1.2}
.mc small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.mc .st{display:inline-block;margin-top:6px;font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--pasupu-soft);color:var(--lock)}
.mc .st.ok{background:var(--leaf-soft);color:var(--leaf)}
@media(max-width:520px){.months{grid-template-columns:1fr 1fr 1fr;gap:6px}.mc{padding:9px;min-height:88px}.mc b{font-size:.98rem}.mc small{font-size:.7rem}}
/* unlock banner */
.ub{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:linear-gradient(120deg,#16324a,#24557a);color:#fff;border-radius:14px;padding:14px 16px;margin:14px 0}
.ub h3{margin:0;font-family:var(--f-display);font-size:1.2rem}
.ub p{margin:2px 0 0;font-size:.9rem;opacity:.92}
.ub .pr{font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:#ffd45c;line-height:1}
.ub .pr small{font-size:.8rem;color:#fff;opacity:.85;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:10px 18px;min-height:44px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.gold{background:#ffd45c;color:#1b1500}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.green{background:#1f8f4e;color:#fff}
.btn.tg{background:#2481cc;color:#fff}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.okbar{display:flex;gap:10px;align-items:center;background:var(--leaf-soft);color:var(--leaf);border-radius:12px;padding:10px 14px;margin:14px 0;font-weight:600}
/* tabs */
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin:8px 0 14px;position:sticky;top:56px;background:var(--paper);z-index:6;padding-top:6px}
.tabs button{border:0;background:transparent;padding:10px 12px;font-weight:700;font-size:.98rem;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;min-height:44px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pasupu)}
/* notes */
.intro{background:var(--pasupu-soft);border-left:4px solid var(--pasupu);border-radius:8px;padding:8px 12px;font-size:.92rem;margin:0 0 12px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 12px;overflow:hidden}
.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 16px;font-weight:700}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .tg{font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--leaf-soft);color:var(--leaf);white-space:nowrap}
.sec>summary .tg.lk{background:var(--pasupu-soft);color:var(--lock)}
.sec>summary .cnt{margin-left:auto;color:var(--muted);font-weight:600;font-size:.85rem;white-space:nowrap}
.sec>summary::after{content:"+";font-size:1.3rem;color:var(--muted);margin-left:6px}
.sec[open]>summary::after{content:"–"}
.sbody{padding:0 12px 12px}
.tp{border:1px solid var(--line);border-radius:10px;margin:0 0 8px;background:var(--card)}
.tp>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;font-weight:600;line-height:1.35}
.tp>summary::-webkit-details-marker{display:none}
.tp .n{flex:none;min-width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--paper);font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tp[open]>summary{border-bottom:1px solid var(--line)}
.tb{padding:6px 14px 12px;font-size:.95rem}
.tb ul{margin:6px 0;padding-left:20px}.tb li{margin:3px 0}
.tb h5{margin:12px 0 4px;font-size:.95rem;color:var(--chain)}
.tb p{margin:6px 0}
.tb .chain{background:var(--chain-soft);border-radius:8px;padding:8px 12px;margin:10px 0}
.tb .chain>b{color:var(--chain);font-size:.9rem}
.tb .trap{background:var(--trap-soft);border-left:4px solid var(--kumkum);border-radius:6px;padding:8px 12px}
.tb .trap b{color:var(--kumkum)}
.tb .note{background:var(--pasupu-soft);border-left:4px solid var(--pasupu);border-radius:6px;padding:8px 12px}
.tw{overflow-x:auto;margin:8px 0}
.tw table,.qt{border-collapse:collapse;width:100%;font-size:.88rem}
.tw th,.tw td,.qt th,.qt td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.tw th,.qt th{background:var(--paper)}
.lklist{list-style:none;margin:0;padding:0}
.lklist li{display:flex;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--line);color:var(--muted);font-size:.93rem}
.lklist li::before{content:"🔒";flex:none}
.lkmore{padding:10px 4px 2px;font-weight:600;color:var(--muted)}
.lkcta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;background:var(--pasupu-soft);border-radius:12px;padding:12px;margin-top:10px}
.lkcta b{color:var(--lock)}
/* test */
.tinfo{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.tinfo h3{margin:0 0 4px;font-family:var(--f-display);font-size:1.2rem}
.tinfo p{margin:4px 0;color:var(--muted);font-size:.9rem}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mode button{border:1.5px solid var(--line);border-radius:10px;background:var(--paper);padding:8px 10px;font-weight:600;font-size:.86rem;line-height:1.35;cursor:pointer;min-height:44px;text-align:left}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;scroll-margin-top:120px}
.qn{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-bottom:4px}
.qb p{margin:4px 0}
.qb p.st{padding-left:14px}
.qb p.ar{padding-left:14px;font-weight:600}
.ops{display:grid;gap:7px;margin-top:10px}
.ops button{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;cursor:pointer;line-height:1.4}
.ops button b{flex:none}
.ops button.sel{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,var(--paper))}
.ops button.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.ops button.no{border-color:var(--kumkum);background:var(--trap-soft)}
.ops button:disabled{cursor:default}
.ex{margin:10px 0 0;font-size:.92rem;border-radius:8px;padding:8px 12px;background:var(--chain-soft)}
.ex b.r{color:var(--leaf)}.ex b.w{color:var(--kumkum)}
.sbar{position:sticky;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);margin:0 -16px;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-family:var(--f-display);font-size:1.2rem}
.timer.low{color:var(--kumkum)}
.result{background:var(--card);border:2px solid var(--leaf);border-radius:14px;padding:14px 16px;margin:0 0 14px;scroll-margin-top:120px}
.result h3{margin:0 0 6px;font-family:var(--f-display)}
.rg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.rg div{background:var(--paper);border-radius:10px;padding:8px 4px}
.rg b{display:block;font-size:1.3rem;font-family:var(--f-display)}
.rg small{font-size:.75rem;color:var(--muted)}
/* pdf */
.pdfs{display:grid;gap:10px}
.pf{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pf .ic{flex:none;width:42px;height:50px;border-radius:6px;background:var(--kumkum);color:#fff;font-weight:800;font-size:.75rem;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.pf .tx{flex:1;min-width:0}
.pf .tx b{display:block;line-height:1.3}
.pf .tx small{color:var(--muted)}
/* dialog */
dialog{border:0;border-radius:18px;padding:0;max-width:440px;width:calc(100% - 24px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,30,.55)}
.dh{background:linear-gradient(120deg,#16324a,#24557a);color:#fff;padding:16px 18px;position:relative}
.dh h3{margin:0;font-family:var(--f-display);font-size:1.3rem}
.dh p{margin:4px 0 0;font-size:.88rem;opacity:.9}
.dh .x{position:absolute;right:10px;top:8px;background:transparent;border:0;color:#fff;font-size:1.6rem;cursor:pointer;min-width:44px;min-height:44px}
.dbody{padding:14px 18px 18px}
.step{display:flex;gap:12px;margin:0 0 16px}
.step .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);font-weight:800;display:flex;align-items:center;justify-content:center}
.step .c{flex:1;min-width:0}
.step .c>b{display:block;margin-bottom:6px}
.upirow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:.9rem}
.upirow code{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.qr{width:132px;height:132px;image-rendering:pixelated;border:1px solid var(--line);border-radius:8px;margin-top:8px;background:#fff}
.codein{display:flex;gap:8px;margin-top:6px}
.codein input{flex:1;min-width:0;font:600 1.05rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);min-height:46px}
.msg{min-height:1.4em;margin:6px 0 0;font-size:.9rem;font-weight:600}
.msg.err{color:var(--kumkum)}.msg.ok{color:var(--leaf)}
.small{font-size:.82rem;color:var(--muted)}
footer{color:var(--muted);font-size:.85rem;padding:24px 0 40px}
.load{padding:30px 0;color:var(--muted)}
</style>
</head>

  tinfo:"APPSC గ్రూప్ 1 ప్రిలిమ్స్ విధానం · సరైనదానికి +1, తప్పుకు −⅓",practice:"ప్రాక్టీస్ — ప్రతి ప్రశ్న తర్వాత జవాబు",exam:"పరీక్ష — టైమర్, చివర్లో స్కోరు",
  q:"ప్రశ్న",ans:"జవాబు",right:"సరైన జవాబు!",wrong:"సరైనది కాదు.",submit:"టెస్ట్ సబ్మిట్ చేయండి",score:"స్కోరు",correct:"సరైనవి",wrongs:"తప్పులు",skip:"వదిలినవి",marks:"మార్కులు",
  lockQ:function(n){return"<b>🔒 మరో "+n+" ప్రశ్నలు</b> జవాబులు, వివరణలతో. ₹29తో పూర్తి నెల అన్‌లాక్ చేయండి."},
  resT:"మీ ఫలితం",retry:"మళ్లీ రాయండి",attempted:function(a,n){return n+"లో "+a+" రాశారు"},
  dl:"డౌన్‌లోడ్",dlg:"తెరుస్తోంది…",lockedPdf:"లాక్",
  dlgT:function(m){return m+" అన్‌లాక్ — ₹29"},dlgS:"పూర్తి నోట్స్ + పూర్తి మాక్ టెస్ట్ + అన్ని PDFలు, తెలుగు & ఇంగ్లీష్",
  s1:"UPIతో ₹29 చెల్లించండి",pay:"UPI యాప్‌తో ₹29 చెల్లించండి",s1n:"కంప్యూటర్‌లో ఉన్నారా? ఏదైనా UPI యాప్‌తో (PhonePe, Google Pay, Paytm) QR స్కాన్ చేయండి.",copy:"కాపీ",copied:"కాపీ అయింది",
  s2:"చెల్లింపు స్క్రీన్‌షాట్ పంపండి",s2n:function(m){return"నెల పేరు ("+m+") రాయండి. మీకు అన్‌లాక్ కోడ్ వస్తుంది."},
  s3:"అన్‌లాక్ కోడ్ నమోదు చేయండి",un:"అన్‌లాక్",checking:"సరిచూస్తోంది…",bad:"ఈ కోడ్ ఈ నెలకు సరైనది కాదు. దయచేసి సరిచూసి మళ్లీ ప్రయత్నించండి.",good:"అన్‌లాక్ అయింది! 🎉",
  foot:"సులభం — స్వతంత్ర అధ్యయన సామగ్రి. APPSCతో సంబంధం లేదు. వాస్తవాలు వార్తా మూలాల నుంచి; అధికారిక నోటిఫికేషన్లతో సరిచూసుకోండి.",load:"లోడ్ అవుతోంది…"}
};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
var P=new URLSearchParams(location.search);
var med=P.get("lang")||ls("sul_med")||ls("sul_lang")||"en";if(med!=="te")med="en";
var IDX=[],cur=null,D=null,LOCK=null,tab=P.get("t")||"notes",mode="practice",ans={},submitted=false,left=0,tid=null;
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")};
var t=function(){return T[med]};
var lab=function(o){return o?(o[med]||o.en):""};

/* ---------- crypto ---------- */
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function norm(c){return String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"")}
function deriveKey(code,d){var enc=new TextEncoder();return crypto.subtle.importKey("raw",enc.encode(norm(code)),"PBKDF2",false,["deriveKey"]).then(function(k){return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(d.salt),iterations:d.iter,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"])})}
function dec(key,bytes){return crypto.subtle.decrypt({name:"AES-GCM",iv:bytes.slice(0,12)},key,bytes.slice(12))}
var KEY=null;
function tryCode(code){
  return deriveKey(code,D).then(function(k){return dec(k,b64(D.enc)).then(function(buf){KEY=k;LOCK=JSON.parse(new TextDecoder().decode(buf));ls("sul_code_"+D.id,norm(code));return true})}).catch(function(){return false});
}

/* ---------- chrome ---------- */
function chrome(){
  document.documentElement.lang=med;["eb","h1","lede"].forEach(function(k){$(k).textContent=t()[k]});$("foot").textContent=t().foot;$("nlToday").textContent=t().today;
  document.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-m")===med)});
  $("months").innerHTML=IDX.map(function(m){var ok=!!ls("sul_code_"+m.id);return'<button type="button" class="mc" data-id="'+m.id+'" aria-pressed="'+(cur===m.id)+'"><b>'+esc(lab(m.label))+'</b><small>'+m.topics+" "+t().topics+" · "+m.q+" "+t().qs+'</small><span class="st'+(ok?" ok":"")+'">'+(ok?"🔓 "+t().unlocked:"🎁 "+t().free)+'</span></button>'}).join("");
}
function unlockBanner(){
  var L=lab(D.label);
  if(LOCK)return'<div class="okbar">'+esc(t().okbar(L))+'</div>';
  var nt=D.notes?D.notes[med].total:0;
  return'<div class="ub"><div><h3>🔒 '+esc(t().ubT(L))+'</h3><p>'+esc(t().ubP(nt,D.test[med].n,D.pdfs.length))+'</p></div><div style="display:flex;align-items:center;gap:12px"><span class="pr">₹29<br><small>'+t().per+'</small></span><button class="btn gold" type="button" data-unlock="1">'+t().unlock+'</button></div></div>';
}
function draw(){
  chrome();if(!D)return;
  var h=unlockBanner();
  h+='<div class="tabs" role="tablist">'+["notes","test","pdf"].map(function(k){return'<button type="button" role="tab" data-tab="'+k+'" aria-selected="'+(tab===k)+'">'+t()[k]+'</button>'}).join("")+'</div>';
  h+='<div id="pane"></div>';
  $("main").innerHTML=h;drawPane();
}
function drawPane(){var p=$("pane");if(!p)return;if(tab==="notes")p.innerHTML=notesHTML();else if(tab==="test")p.innerHTML=testHTML();else p.innerHTML=pdfHTML();if(tab==="test")tickBar()}

/* ---------- notes ---------- */
function notesHTML(){
  if(!D.notes)return'<div class="tinfo"><p style="color:inherit">'+t().sepNotes+'</p><p><a class="btn ink" href="'+D.notes_link+'">'+t().sepGo+'</a></p></div>';
  var N=D.notes[med],h=N.intro?'<p class="intro">'+N.intro+'</p>':"",firstFree=true;
  N.sections.forEach(function(s,i){
    var topics=s.free?s.topics:(LOCK?LOCK.notes[med][String(i)]:null);
    var open=(s.free&&firstFree)||false;if(s.free)firstFree=false;
    h+='<details class="sec"'+(open?" open":"")+'><summary><span>'+esc(s.h||lab(D.label))+'</span><span class="tg'+(topics?"":" lk")+'">'+(s.free?t().freeTag:(topics?"🔓":"🔒 "+t().lockTag))+'</span><span class="cnt">'+s.n+" "+t().topics+'</span></summary><div class="sbody">';
    if(topics){h+='<p class="small" style="margin:0 0 8px">'+t().open+'</p>'+topics.map(function(x){return'<details class="tp"><summary><span class="n">'+x.n+'</span><span>'+esc(x.t)+'</span></summary><div class="tb">'+x.html+'</div></details>'}).join("")}
    else{var show=s.titles.slice(0,6);h+='<ul class="lklist">'+show.map(function(x){return"<li>"+x[0]+". "+esc(x[1])+"</li>"}).join("")+'</ul>'+(s.titles.length>6?'<div class="lkmore">'+t().more(s.titles.length-6)+'</div>':"")+'<div class="lkcta"><span>'+t().lkcta(s.n)+'</span><button class="btn gold" type="button" data-unlock="1">'+t().unlock+'</button></div>'}
    h+='</div></details>';
  });
  return h;
}

/* ---------- test ---------- */
function allQs(){var f=D.test[med].free;return LOCK?f.concat(LOCK.test[med]):f}
function lineHTML(x){
  if(typeof x==="object"&&x.tbl)return'<div class="tw"><table class="qt">'+x.tbl.map(function(r,i){return"<tr>"+r.map(function(c){return(i?"<td>":"<th>")+esc(c)+(i?"</td>":"</th>")}).join("")+"</tr>"}).join("")+'</table></div>';
  var s=String(x),cls=/^(I|II|III|IV|V|VI)\.\s/.test(s)?"st":(/^(Assertion|Reason|ప్రతిపాదన|కారణం|వాదన)/.test(s)?"ar":"");
  return'<p'+(cls?' class="'+cls+'"':"")+'>'+esc(s)+'</p>';
}
function akey(){return"sul_ans_"+D.id+"_"+med+"_"+mode}
function loadAns(){ans={};submitted=false;try{var s=JSON.parse(ls(akey())||"null");if(s){ans=s.a||{};submitted=!!s.done;if(mode==="exam")left=s.left||0}}catch(e){}if(mode==="exam"&&!left)left=D.test[med].n*60}
function saveAns(){ls(akey(),JSON.stringify({a:ans,done:submitted,left:left}))}
function testHTML(){
  var Tt=D.test[med],qs=allQs(),h='<div class="tinfo"><h3>'+esc(Tt.title)+'</h3><p>'+esc(Tt.info)+'</p><div class="mode" role="group"><button type="button" data-mode="practice" aria-pressed="'+(mode==="practice")+'">'+t().practice+'</button><button type="button" data-mode="exam" aria-pressed="'+(mode==="exam")+'">'+t().exam+'</button></div></div>';
  if(mode==="exam"&&submitted)h+=resultHTML(qs);
  qs.forEach(function(q,i){
    var a=ans[i],show=(mode==="practice"&&a!==undefined)||(mode==="exam"&&submitted);
    h+='<div class="qcard" id="q'+i+'"><div class="qn">'+t().q+" "+(i+1)+" / "+Tt.n+'</div><div class="qb">'+q.body.map(lineHTML).join("")+'</div><div class="ops">'+q.o.map(function(o,j){var c="";if(show){if(j===q.a)c="ok";else if(j===a)c="no"}else if(a===j)c="sel";return'<button type="button" data-q="'+i+'" data-j="'+j+'"'+(c?' class="'+c+'"':"")+(show?" disabled":"")+'><b>('+"abcd"[j]+')</b><span>'+esc(o)+'</span></button>'}).join("")+'</div>';
    if(show)h+='<p class="ex"><b class="'+(a===q.a?"r":"w")+'">'+(a===q.a?t().right:(a===undefined?"":t().wrong))+'</b> '+t().ans+': ('+"abcd"[q.a]+') '+(q.x?" — "+esc(q.x):"")+'</p>';
    h+='</div>';
  });
  if(!LOCK)h+='<div class="lkcta" style="margin-bottom:14px"><span>'+t().lockQ(Tt.n-qs.length)+'</span><button class="btn gold" type="button" data-unlock="1">'+t().unlock+'</button></div>';
  h+='<div class="sbar" id="sbar"></div>';
  return h;
}
function counts(qs){var c=0,w=0;qs.forEach(function(q,i){var a=ans[i];if(a===undefined)return;if(a===q.a)c++;else w++});return{c:c,w:w,s:qs.length-c-w,m:Math.round((c-w/3)*100)/100}}
function resultHTML(qs){var k=counts(qs);return'<div class="result" id="res"><h3>'+t().resT+'</h3><div class="rg"><div><b>'+k.m+'</b><small>'+t().marks+' / '+qs.length+'</small></div><div><b style="color:var(--leaf)">'+k.c+'</b><small>'+t().correct+'</small></div><div><b style="color:var(--kumkum)">'+k.w+'</b><small>'+t().wrongs+'</small></div><div><b>'+k.s+'</b><small>'+t().skip+'</small></div></div><p style="margin:10px 0 0"><button class="btn line" type="button" id="retry">'+t().retry+'</button></p></div>'}
function tickBar(){
  var b=$("sbar");if(!b)return;var qs=allQs(),k=counts(qs),a=k.c+k.w;
  if(mode==="practice")b.innerHTML='<span>'+t().attempted(a,qs.length)+'</span><span style="color:var(--leaf)">✓ '+k.c+'</span><span style="color:var(--kumkum)">✗ '+k.w+'</span><span>'+t().score+': '+k.m+'</span>';
  else if(submitted)b.innerHTML='<span>'+t().score+': '+k.m+' / '+qs.length+'</span><button class="btn line" type="button" id="retry2" style="min-height:38px">'+t().retry+'</button>';
  else{var m=Math.floor(left/60),s=left%60;b.innerHTML='<span class="timer'+(left<300?" low":"")+'">⏱ '+(m<10?"0":"")+m+":"+(s<10?"0":"")+s+'</span><span>'+t().attempted(a,qs.length)+'</span><button class="btn ink" type="button" id="submit" style="min-height:40px">'+t().submit+'</button>'}
}
function startTimer(){clearInterval(tid);if(mode!=="exam"||submitted)return;tid=setInterval(function(){if(tab!=="test"){return}left--;if(left%10===0)saveAns();if(left<=0){left=0;doSubmit();return}tickBar()},1000)}
function doSubmit(){submitted=true;clearInterval(tid);saveAns();drawPane();var r=$("res");if(r)r.scrollIntoView({behavior:"smooth"})}

/* ---------- pdf ---------- */
function pdfHTML(){
  return'<div class="pdfs">'+D.pdfs.map(function(p,i){return'<div class="pf"><span class="ic">PDF</span><span class="tx"><b>'+esc(lab(p.label))+'</b><small>'+esc(lab(D.label))+" · "+p.kb+' KB</small></span>'+(LOCK?'<button class="btn ink" type="button" data-pdf="'+i+'">⬇ '+t().dl+'</button>':'<button class="btn gold" type="button" data-unlock="1">🔒 ₹29</button>')+'</div>'}).join("")+'</div>';
}
function getPdf(i,btn){
  var p=D.pdfs[i];btn.disabled=true;var old=btn.innerHTML;btn.textContent=t().dlg;
  fetch(p.file).then(function(r){return r.arrayBuffer()}).then(function(b){return dec(KEY,new Uint8Array(b))}).then(function(pdf){
    var url=URL.createObjectURL(new Blob([pdf],{type:"application/pdf"})),a=document.createElement("a");a.href=url;a.download=p.name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},60000);
  }).catch(function(){alert("Download failed. Please try again.")}).then(function(){btn.disabled=false;btn.innerHTML=old});
}

/* ---------- dialog ---------- */
function openDlg(){
  var L=lab(D.label),x=t();$("dlgT").textContent=x.dlgT(L);$("dlgS").textContent=x.dlgS;$("s1").textContent=x.s1;$("payBtn").textContent=x.pay;$("payBtn").href=D.upi;$("s1n").textContent=x.s1n;$("copyUpi").textContent=x.copy;$("qr").src=D.qr;
  $("s2").textContent=x.s2;$("s2n").textContent=x.s2n(L);$("s3").textContent=x.s3;$("unBtn").textContent=x.un;$("msg").textContent="";$("msg").className="msg";$("codeIn").placeholder=D.id==="2026-07"?"JUL-XXXXXX":D.id==="2026-08"?"AUG-XXXXXX":"SEP-XXXXXX";
  var dl=$("dlg");if(dl.showModal)dl.showModal();else dl.setAttribute("open","");
}
$("dlgX").onclick=function(){$("dlg").close()};
$("copyUpi").onclick=function(){var b=this;try{navigator.clipboard.writeText("raghu.cse999@axl").then(function(){b.textContent=t().copied})}catch(e){prompt("UPI ID","raghu.cse999@axl")}};
$("codeForm").onsubmit=function(e){e.preventDefault();var c=$("codeIn").value;if(!norm(c))return;$("msg").className="msg";$("msg").textContent=t().checking;
  tryCode(c).then(function(ok){if(ok){$("msg").className="msg ok";$("msg").textContent=t().good;setTimeout(function(){$("dlg").close();loadAns();draw();startTimer()},700)}else{$("msg").className="msg err";$("msg").textContent=t().bad}})};

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var b;
  if(b=e.target.closest(".seg button[data-m]")){med=b.getAttribute("data-m");ls("sul_med",med);ls("sul_lang",med);loadAns();draw();startTimer();return}
  if(b=e.target.closest(".mc")){select(b.getAttribute("data-id"));return}
  if(b=e.target.closest("[data-tab]")){tab=b.getAttribute("data-tab");draw();history.replaceState(null,"","?m="+D.id+"&t="+tab);return}
  if(b=e.target.closest("[data-unlock]")){openDlg();return}
  if(b=e.target.closest("[data-mode]")){mode=b.getAttribute("data-mode");loadAns();drawPane();startTimer();return}
  if(b=e.target.closest(".ops button")){var i=+b.getAttribute("data-q"),j=+b.getAttribute("data-j");if(mode==="practice"&&ans[i]!==undefined)return;if(mode==="exam"&&submitted)return;ans[i]=j;saveAns();
    var card=$("q"+i),tmp=document.createElement("div");tmp.innerHTML=testHTML();var nc=tmp.querySelector("#q"+i);if(card&&nc)card.replaceWith(nc);tickBar();return}
  if(b=e.target.closest("#submit")){doSubmit();return}
  if(b=e.target.closest("#retry,#retry2")){ans={};submitted=false;left=D.test[med].n*60;saveAns();drawPane();startTimer();window.scrollTo({top:$("pane").offsetTop-120});return}
  if(b=e.target.closest("[data-pdf]")){getPdf(+b.getAttribute("data-pdf"),b);return}
});
function select(id){
  cur=id;D=null;LOCK=null;KEY=null;$("main").innerHTML='<p class="load">'+t().load+'</p>';chrome();
  history.replaceState(null,"","?m="+id+(tab!=="notes"?"&t="+tab:""));
  fetch("ca/"+id+".json").then(function(r){return r.json()}).then(function(j){
    D=j;var c=ls("sul_code_"+id);
    var go=function(){loadAns();draw();startTimer()};
    if(c)tryCode(c).then(function(ok){if(!ok)ls("sul_code_"+id,null);go()});else go();
  });
}
fetch("ca/index.json").then(function(r){return r.json()}).then(function(l){IDX=l;var want=P.get("m");if(!IDX.some(function(m){return m.id===want}))want=IDX[0].id;if(P.get("code"))ls("sul_code_"+want,norm(P.get("code")));select(want)});
chrome();
})();
</script>
